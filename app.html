(function(){
var module = { exports: {} }, exports = module.exports;
/* =====================================================================
   NeuroLab Profundo · o grafo

   Os arquivos de `content/` são recortes de autoria, não módulos. Aqui eles
   viram UM grafo só. Nenhum arquivo declara ligação com outro: a composição
   acontece porque dois arquivos usam o mesmo id de nó.

   O átomo é a TRANSIÇÃO. A entidade é o objeto sobre o qual as transições
   operam. O mecanismo é um recorte — entrada e terminal —, e o conjunto de
   nós dele é CALCULADO pela travessia, nunca listado à mão.
   ===================================================================== */
const fs = require('node:fs');
const path = require('node:path');

const RAIZ = path.join(__dirname, '..');
const CONTEUDO = path.join(RAIZ, 'content');

/* Vocabulário fechado. TODO tipo lê no sentido da seta: "A <tipo> B".
   `requer` foi removido daqui na Fase A por violar as duas regras — lia ao
   contrário ("A requer B" quando o sentido era B depender de A) e colidia
   com o campo `requer:` das entidades. Virou `compoe`: A é um dos termos
   que produzem B. */
const TIPOS_DE_TRANSICAO = ['causa', 'permite', 'compoe', 'modula', 'inibe', 'bloqueia', 'remove'];
const VERBO = { causa:'causa', permite:'permite', compoe:'compõe', modula:'modula',
                inibe:'inibe', bloqueia:'bloqueia', remove:'remove' };
const NIVEIS_DE_CERTEZA = ['consolidado', 'debatido', 'hipotese'];

function carregar(){
  const g = { entidades:{}, nos:{}, transicoes:[], mecanismos:{}, origem:{}, arquivos:[] };
  const arquivos = fs.readdirSync(CONTEUDO).filter(f=>f.endsWith('.json')).sort();
  for(const arq of arquivos){
    const dados = JSON.parse(fs.readFileSync(path.join(CONTEUDO, arq), 'utf8'));
    g.arquivos.push(arq);
    (dados.entidades||[]).forEach(e=>{ g.entidades[e.id] = e; g.origem[e.id] = arq; });
    (dados.nos||[]).forEach(n=>{ g.nos[n.id] = n; g.origem[n.id] = arq; });
    (dados.transicoes||[]).forEach((t,i)=>{ t._arquivo = arq; t._i = i; g.transicoes.push(t); });
    (dados.mecanismos||[]).forEach(m=>{ m._arquivo = arq; g.mecanismos[m.id] = m; });
  }
  return g;
}

/* ---------- travessia ---------- */

function saindoDe(g, noId){ return g.transicoes.filter(t=>t.de === noId); }
function chegandoEm(g, noId){ return g.transicoes.filter(t=>t.para === noId); }

// tudo que depende deste nó, direta ou indiretamente
function aJusante(g, noId){
  const vistos = new Set(), fila = [noId];
  while(fila.length){
    const atual = fila.shift();
    for(const t of saindoDe(g, atual)){
      if(vistos.has(t.para)) continue;
      vistos.add(t.para); fila.push(t.para);
    }
  }
  return vistos;
}

// tudo de que este nó depende
function aMontante(g, noId){
  const vistos = new Set(), fila = [noId];
  while(fila.length){
    const atual = fila.shift();
    for(const t of chegandoEm(g, atual)){
      if(vistos.has(t.de)) continue;
      vistos.add(t.de); fila.push(t.de);
    }
  }
  return vistos;
}

/* Todos os caminhos de A até B. Devolve listas de transições, não de nós —
   porque o átomo é a transição, e é ela que carrega o `porque`. */
function caminhos(g, de, para, limite){
  limite = limite || 200;
  const achados = [];
  (function anda(atual, trilha, visitados){
    if(achados.length >= limite) return;
    if(atual === para){ achados.push(trilha.slice()); return; }
    for(const t of saindoDe(g, atual)){
      if(visitados.has(t.para)) continue;          // não repete nó no mesmo caminho
      visitados.add(t.para);
      trilha.push(t);
      anda(t.para, trilha, visitados);
      trilha.pop();
      visitados.delete(t.para);
    }
  })(de, [], new Set([de]));
  return achados;
}

/* O recorte de um mecanismo: TUDO de que o terminal depende. Calculado,
   nunca listado.

   A primeira versão disto era `a jusante da entrada ∩ a montante do
   terminal`, e a Fase A mostrou que essa regra estava errada: ela descarta
   as CO-CAUSAS — o que determina o terminal sem descender da entrada. No
   potencial de repouso isso derrubava a permeabilidade desigual, que é
   justamente o fator de maior peso. Um mecanismo não é uma linha; é uma
   confluência. A `entrada` continua sendo por onde a narrativa começa (e o
   validador exige que o terminal seja alcançável a partir dela), mas quem
   define o recorte é o terminal. */
function subgrafo(g, mecanismoId){
  const m = g.mecanismos[mecanismoId];
  if(!m) return null;
  const nos = aMontante(g, m.terminal);
  nos.add(m.terminal);
  const transicoes = g.transicoes.filter(t=>nos.has(t.de) && nos.has(t.para));
  // raízes: nós do recorte que nada de dentro dele causa. A entrada é uma
  // delas; as outras são as co-causas.
  const raizes = [...nos].filter(n=>!transicoes.some(t=>t.para === n));
  return { mecanismo:m, nos, transicoes, raizes };
}

/* Pré-requisitos SEM bloqueio: outro mecanismo é pré-requisito deste quando
   o TERMINAL dele mora dentro do meu recorte — quando aquilo que ele explica
   é coisa de que eu dependo. Derivado, não escrito, e assimétrico de graça.

   Já tentei trocar isto por posse ("quem usa material de outro depende
   dele") e o resultado foi PIOR: o recorte da LTP tem 45 nós e o da
   transmissão sináptica tem 51, porque a LTP não alcança os ramos tardios
   da sinapse. Pela posse, a LTP virava dona do material da transmissão e a
   transmissão passava a depender da LTP — invertido. "Menor recorte" não
   serve como dono quando dois recortes se sobrepõem sem que um contenha o
   outro, e nenhuma variação simples disso é assimétrica, porque recorte é
   fecho a montante e os dois contêm a entrada um do outro.

   Fica o terminal, que nunca produziu dependência invertida: ele só produz
   dependência FALTANDO, e falta se conserta no conteúdo. Se um mecanismo
   deveria depender de outro e não depende, é porque a conclusão do primeiro
   não é usada pelo segundo — e ou existe uma afirmação verdadeira ligando
   os dois, ou a dependência que eu imaginava não existe. */
function prerequisitos(g, mecanismoId){
  const sg = subgrafo(g, mecanismoId);
  if(!sg) return [];
  return Object.keys(g.mecanismos).filter(id=>
    id !== mecanismoId && sg.nos.has(g.mecanismos[id].terminal));
}

/* Um nó "cruza arquivos" quando as transições que o tocam vêm de arquivos
   diferentes — é a assinatura da composição sem costura. */
function arquivosDoCaminho(caminho){
  return [...new Set(caminho.map(t=>t._arquivo))];
}

/* ---------- perturbação ----------
   Remove uma entidade ou uma transição e DERIVA o que deixa de acontecer.
   Nada aqui é escrito à mão: a consequência é o que some da alcançabilidade.
   É isto que substitui os contrafactuais autorados do NeuroLab.

   LIMITE CONHECIDO — alcançabilidade é OU, nunca E.
   Um nó com dois pais sobrevive se QUALQUER um deles sobrevive. Quando o nó
   só é verdadeiro com os dois juntos, a perturbação subestima o estrago e o
   gabarito sai curto (nunca invertido — isso é o defeito de polaridade, que
   é outro e está barrado no validador).

   Visto em 2026-08-18, no mecanismo 09: `sinal-global-da-credito-especifico`
   exige a marca de elegibilidade E a difusão do sinal. Remover a dopamina
   mata a difusão, o nó continua alcançável pela marca, e a perturbação
   conclui que só dois nós se perdem — quando, de fato, a atribuição de
   crédito inteira para.

   NÃO conserte isso reescrevendo o conteúdo para virar cadeia em série. A
   conjunção é real, e serializá-la para o número ficar bonito é falsificar
   o mecanismo para agradar o motor. O conserto certo é dar conjunção ao
   motor, e até lá o gabarito é conservador: o que ele lista realmente se
   perde, e pode faltar coisa. Ver a seção 10 de tools/valida-grafo.js, que
   avisa quando uma entidade nunca chega a derrubar nada. */
function transicoesAtingidas(g, alvo){
  return g.transicoes.filter(t=>{
    if(alvo.entidade) return (t.requer||[]).includes(alvo.entidade);
    if(alvo.transicao) return t === alvo.transicao;
    return false;
  });
}

function perturbar(g, alvo, entradaId){
  const mortas = transicoesAtingidas(g, alvo);
  const vivas = g.transicoes.filter(t=>!mortas.includes(t));
  const antes = aJusante(g, entradaId);
  const depois = aJusante(Object.assign({}, g, {transicoes:vivas}), entradaId);
  const perdidos = [...antes].filter(n=>!depois.has(n));
  return { mortas, perdidos, restantes: depois };
}

/* ---------- perturbação de um MECANISMO ----------
   `perturbar` parte de UM nó. Serve para pergunta solta, e é o primitivo.
   Para um mecanismo ele é a ferramenta errada, e isso custou caro:

   o recorte de um mecanismo é `aMontante(terminal)`, mas `aJusante(entrada)`
   é outro conjunto. A diferença entre os dois são os fios que entram pela
   lateral — as co-causas, que `subgrafo` já chamava de `raizes` desde o
   começo. Medir a partir da `entrada` deixava esses fios INVISÍVEIS para a
   perturbação: no mecanismo 07, o braço executor inteiro da LTD
   (`calcineurina-ativa`, `pp1-desfosforila`, `ampa-retirado-da-membrana`)
   entra pelo protocolo de estimulação, não pela entrada declarada. Remover
   a calcineurina perdia ZERO nós, no mecanismo cujo assunto é a calcineurina.

   Um nó do recorte acontece quando alguma raiz o sustenta. Perder é deixar
   de ser sustentado por qualquer uma delas. A `entrada` declarada continua
   sendo uma raiz — ela só deixou de ser a única.

   Continua valendo o limite de conjunção descrito em `perturbar`: dois pais
   viram OU, e o gabarito segue conservador. */
/* Uma BFS multi-origem, com índice de adjacência montado uma vez. A versão
   ingênua chamava `aJusante` uma vez POR RAIZ, e `aJusante` varre todas as
   transições a cada nó visitado — com 10 raízes num recorte de 103 nós isso
   é meio milhão de comparações por chamada, e `operacoesMensuraveisEm`
   chama isto para cada transição × mecanismo × entidade. O portão de
   perguntas foi de 24 s para mais de 5 min antes desta troca. */
function alcancadosDe(transicoes, raizes){
  const porDe = new Map();
  for(const t of transicoes){
    const a = porDe.get(t.de);
    if(a) a.push(t); else porDe.set(t.de, [t]);
  }
  const vistos = new Set(raizes), fila = raizes.slice();
  while(fila.length){
    const saidas = porDe.get(fila.pop());
    if(!saidas) continue;
    for(const t of saidas){
      if(vistos.has(t.para)) continue;
      vistos.add(t.para); fila.push(t.para);
    }
  }
  return vistos;
}

function perturbarRecorte(g, alvo, mecanismoId, sg){
  sg = sg || subgrafo(g, mecanismoId);
  if(!sg) return { mortas: [], perdidos: [], restantes: new Set() };
  const dentro = n=>sg.nos.has(n);

  /* O estado intacto não depende do alvo: vale a pena guardar. A identidade
     do array de transições é a chave — se o grafo mudou, o cache não serve. */
  if(sg._intactoDe !== g.transicoes){
    sg._intacto = new Set([...alcancadosDe(g.transicoes, sg.raizes)].filter(dentro));
    sg._intactoDe = g.transicoes;
  }
  const antes = sg._intacto;

  const mortas = transicoesAtingidas(g, alvo);
  if(!mortas.length) return { mortas, perdidos: [], restantes: new Set(antes) };

  const mortasSet = new Set(mortas);
  const vivas = g.transicoes.filter(t=>!mortasSet.has(t));
  const depois = new Set([...alcancadosDe(vivas, sg.raizes)].filter(dentro));
  return { mortas, perdidos: [...antes].filter(n=>!depois.has(n)), restantes: depois };
}

/* Transições que dependem de uma entidade — para saber o que dá para perturbar */
function transicoesQueDependemDe(g, entidadeId){
  return g.transicoes.filter(t=>(t.requer||[]).includes(entidadeId));
}

/* ---------- explicação ----------
   A pergunta e a resposta saem da própria transição: não existe banco de
   perguntas escrito à mão. E `certeza` tem consequência didática — nada
   fora de `consolidado` chega ao estudo sem ressalva junto. */
const RESSALVA = {
  debatido: 'Há disputa na literatura sobre esta etapa. Trate como leitura provável, não como fato fechado.',
  hipotese: 'Isto é hipótese. Não estude como mecanismo estabelecido.'
};
function explicar(g, t){
  const de = g.nos[t.de], para = g.nos[t.para];
  const nome = id => (g.nos[id] && g.nos[id].descricao) || id;
  return {
    pergunta: `Por que "${nome(t.de)}" leva a "${nome(t.para)}"?`,
    resposta: t.porque,
    tipo: t.tipo,
    condicao: t.condicao || null,
    requer: (t.requer||[]).map(id=> (g.entidades[id] && g.entidades[id].nome) || id),
    certeza: t.certeza,
    ressalva: t.certeza === 'consolidado' ? null
            : (RESSALVA[t.certeza] || 'Certeza fora de `consolidado`: não apresente como fato.'),
    _de: de, _para: para
  };
}

/* ---------- reconstrução nos dois sentidos ----------
   Para frente parte das raízes do recorte e pergunta "o que isto causa?".
   Para trás parte do terminal e pergunta "o que precisava ter acontecido?".
   Os dois percursos cobrem exatamente o mesmo conjunto de transições — é
   isso que significa o mecanismo ser reconstruível nas duas direções. */
function reconstruir(g, mecanismoId, sentido){
  const sg = subgrafo(g, mecanismoId);
  if(!sg) return null;
  const paraFrente = sentido !== 'tras';
  const vizinhas = no => sg.transicoes.filter(t => (paraFrente ? t.de : t.para) === no);
  const outroLado = t => paraFrente ? t.para : t.de;
  const nome = id => (g.nos[id] && g.nos[id].descricao) || id;

  const inicio = paraFrente ? sg.raizes.slice() : [sg.mecanismo.terminal];
  const passos = [], vistos = new Set(inicio), fila = inicio.slice();
  while(fila.length){
    const no = fila.shift();
    const ts = vizinhas(no);
    if(ts.length){
      passos.push({
        no,
        pergunta: paraFrente
          ? `Dado "${nome(no)}", o que acontece em seguida — e por quê?`
          : `Para chegar em "${nome(no)}", o que precisava ter acontecido — e por quê?`,
        resposta: ts.map(t=>({ no: outroLado(t), explicacao: explicar(g, t) })),
        transicoes: ts
      });
    }
    for(const t of ts){
      const prox = outroLado(t);
      if(vistos.has(prox)) continue;
      vistos.add(prox); fila.push(prox);
    }
  }
  return { mecanismo: sg.mecanismo, sentido: paraFrente ? 'frente' : 'tras',
           passos, alcancados: vistos,
           transicoesCobertas: new Set(passos.flatMap(p=>p.transicoes)) };
}

/* ---------- projeção por escala ----------
   A escala é atributo do NÓ, e o deslizador é uma projeção do mesmo grafo —
   nunca uma tela nova nem um conteúdo paralelo. Era a condição do plano: se
   cada escala tivesse texto próprio, voltaria a existir conteúdo escrito
   por camada, e a camada viraria dona do material.

   O vocabulário de escalas é DERIVADO do conteúdo, não uma lista fixa. No
   dia em que um mecanismo trouxer escala nova, ela aparece sozinha. */
function escalasDe(g){
  return [...new Set(Object.values(g.nos).map(n=>n.escala).filter(Boolean))].sort();
}

/* A cadeia do mecanismo em ordem causal: das raízes ao terminal, sem
   repetir transição. É a mesma travessia que gera as perguntas — a leitura
   e o estudo não podem discordar sobre a ordem das coisas. */
function cadeiaOrdenada(g, mecanismoId){
  const r = reconstruir(g, mecanismoId, 'frente');
  if(!r) return [];
  const vistas = new Set(), ordem = [];
  r.passos.forEach(p=>p.transicoes.forEach(t=>{
    if(vistas.has(t)) return;
    vistas.add(t); ordem.push(t);
  }));
  return ordem;
}

/* Uma transição pertence a uma escala quando QUALQUER das pontas está nela.
   Assim as pontes entre níveis aparecem nos dois — que é onde mora o que

           'é assim que ele fica fechado.' }));

  if(p.revisoesHoje > 0) botao('Estudar (' + p.revisoesHoje + ' vencidas)', comecarSessao);
  else { rodape.classList.remove('oculto'); acao.textContent = 'Nada vencido hoje'; acao.disabled = true; acao.onclick = null; }
}

/* ---------- ler o mecanismo ----------
   A mesma cadeia que gera as perguntas, em ordem causal e por extenso. Serve
   para duas coisas: estudar antes de ser cobrado, e AUDITAR — por isso cada
   transição mostra o endereço no arquivo, para um erro de neurociência poder
   ser reportado por número em vez de por descrição.

   O deslizador de escala é uma projeção deste mesmo grafo. Não existe texto
   por camada: se existisse, a camada voltaria a ser dona do conteúdo. */
function telaExplorar(mecanismoId, escala){
  limpar();
  semBotao();
  var m = g.mecanismos[mecanismoId];
  var cadeia = G.projetar(g, mecanismoId, escala);
  var total = G.cadeiaOrdenada(g, mecanismoId).length;

  var voltar = el('button', { class: 'fantasma', type: 'button', texto: '‹ percurso' });
  voltar.onclick = telaPercurso;
  app.appendChild(voltar);

  app.appendChild(el('h1', { texto: mecanismoId }));
  app.appendChild(el('p', { class: 'sub', texto: m.fenomeno }));

  var cabeca = el('div', { class: 'cartao' });
  cabeca.appendChild(el('div', { class: 'rotulo', texto: 'entrada' }));
  cabeca.appendChild(el('div', { texto: nomeNo(m.entrada) }));
  cabeca.appendChild(el('div', { class: 'rotulo', style: 'margin-top:10px', texto: 'termina em' }));
  cabeca.appendChild(el('div', { texto: nomeNo(m.terminal) }));
  var pre = G.prerequisitos(g, mecanismoId);
  if(pre.length) cabeca.appendChild(el('div', { class: 'dep', texto: 'pré-requisitos derivados: ' + pre.join(', ') }));
  cabeca.appendChild(el('div', { class: 'rotulo', style: 'margin-top:10px', texto: 'limites declarados' }));
  cabeca.appendChild(el('p', { class: 'fenomeno', texto: m.limites }));
  app.appendChild(cabeca);

  /* O vocabulário de escalas vem do conteúdo, nunca de uma lista fixa aqui. */
  var faixas = [{ id: 'todas', rotulo: 'todas' }]
    .concat(G.escalasDe(g).map(function(e){ return { id: e, rotulo: e }; }))
    .concat([{ id: 'pontes', rotulo: 'pontes entre escalas' }]);
  var barra = el('div', { class: 'faixas' });
  faixas.forEach(function(f){
    var b = el('button', { class: 'faixa' + (f.id === escala ? ' viva' : ''), type: 'button', texto: f.rotulo });
    b.onclick = (function(id){ return function(){ telaExplorar(mecanismoId, id); }; })(f.id);
    barra.appendChild(b);
  });
  app.appendChild(barra);
  app.appendChild(el('p', { class: 'rotulo',
    texto: cadeia.length + ' de ' + total + ' transições nesta projeção' }));

  if(!cadeia.length){
    app.appendChild(el('p', { class: 'aviso', texto: 'Nenhuma transição nesta escala.' }));
    return;
  }

  cadeia.forEach(function(t){
    var ex = G.explicar(g, t);
    var cartao = el('div', { class: 'cartao' });
    var rel = el('div', { class: 'rel' });
    rel.appendChild(document.createTextNode(nomeNo(t.de) + ' '));
    rel.appendChild(el('span', { class: 'verbo', texto: G.VERBO[t.tipo] || t.tipo }));
    rel.appendChild(document.createTextNode(' ' + nomeNo(t.para)));
    cartao.appendChild(rel);
    cartao.appendChild(el('div', { class: 'escalas',
      texto: (g.nos[t.de].escala || '?') + ' › ' + (g.nos[t.para].escala || '?') }));
    cartao.appendChild(el('p', { texto: ex.resposta }));
    var meta = [];
    if(ex.condicao) meta.push('condição: ' + ex.condicao);
    if(ex.requer && ex.requer.length) meta.push('depende de: ' + ex.requer.join(' · '));
    if(meta.length) cartao.appendChild(el('div', { class: 'meta', texto: meta.join('   ') }));
    if(ex.ressalva) cartao.appendChild(el('div', { class: 'ressalva', texto: ex.ressalva }));
    /* o endereço, para auditoria: dá para dizer "03[7] está errado" */
    cartao.appendChild(el('div', { class: 'endereco', texto: t._arquivo + '[' + t._i + ']' }));
    app.appendChild(cartao);
  });

  app.appendChild(el('p', { class: 'aviso',
    texto: 'Nenhum portão sabe se isto é verdade — eles verificam coerência. ' +
           'Se uma destas relações estiver errada, o endereço embaixo dela é o que identifica.' }));
}

/* ---------- sessão ---------- */
function comecarSessao(){
  var agora = Date.now();
  var montada = Q.montarSessao(g, estado, agora, { idx: idx, semente: (agora / 60000) | 0 });
  if(!montada.perguntas.length) return telaPercurso();
  sessao = {
    perguntas: montada.perguntas, i: 0, agora: agora,
    lote: E.iniciarLote(), resultados: [], caixas: 0
  };
  telaPergunta();
}

function telaPergunta(){
  limpar();
  var s = sessao, p = s.perguntas[s.i];
  var escolhidas = [];

  var prog = el('div', { class: 'progresso' });
  s.perguntas.forEach(function(_, i){
    var r = s.resultados[i];
    prog.appendChild(el('i', { class: i === s.i ? 'atual' : (r ? (r.acertou ? 'feita' : 'falha') : '') }));
  });
  app.appendChild(prog);

  app.appendChild(el('div', { class: 'linha' }, [
    el('span', { class: 'selo curso', texto: p.operacao }),
    el('span', { class: 'rotulo', texto: (s.i + 1) + ' de ' + s.perguntas.length })
  ]));
  app.appendChild(el('h2', { texto: p.enunciado }));
  app.appendChild(el('p', { class: 'sub',
    texto: p.tipoDeResposta === 'unica' ? 'Escolha uma.' : 'Pode haver mais de uma. Marcar tudo não passa.' }));

  var botoes = {};
  p.alternativas.forEach(function(a){
    var b = el('button', { class: 'alt' + (p.tipoDeResposta === 'unica' ? ' unica' : ''),
                           'aria-pressed': 'false', type: 'button' }, [
      el('span', { class: 'marca', texto: '✓' }),
      el('span', { texto: a.texto })
    ]);
    b.onclick = function(){
      if(p.tipoDeResposta === 'unica'){
        escolhidas = [a.id];
        Object.keys(botoes).forEach(function(k){ botoes[k].setAttribute('aria-pressed', String(k === a.id)); });
      } else {
        var j = escolhidas.indexOf(a.id);
        if(j >= 0) escolhidas.splice(j, 1); else escolhidas.push(a.id);
        b.setAttribute('aria-pressed', escolhidas.indexOf(a.id) >= 0 ? 'true' : 'false');
      }
      acao.disabled = escolhidas.length === 0;
    };
    botoes[a.id] = b;
    app.appendChild(b);
  });

  botao('Responder', function(){ responder(p, escolhidas, botoes); });
  acao.disabled = true;
}

function responder(p, escolhidas, botoes){
  var s = sessao;
  var c = Q.corrigir(p, escolhidas);
  s.caixas += Q.anotarNoLote(s.lote, p, c);
  s.resultados[s.i] = c;

  /* marca as alternativas: o que estava certo, o que faltou, o que sobrou */
  Object.keys(botoes).forEach(function(id){
    var b = botoes[id];
    b.onclick = null;
    b.disabled = true;
    var era = p.corretas.indexOf(id) >= 0;
    var marcou = escolhidas.indexOf(id) >= 0;
    if(era && marcou) b.className += ' certa';
    else if(era && !marcou) b.className += ' perdida';
    else if(!era && marcou) b.className += ' errada';
  });

  var caixa = el('div', { class: 'cartao' });
  caixa.appendChild(el('div', { class: 'linha' }, [
    el('h2', { texto: c.acertou ? 'Certo' : (c.nota > 0 ? 'Quase' : 'Errado') }),
    el('span', { class: 'selo' + (c.acertou ? ' ok' : ''), texto: 'nota ' + c.nota.toFixed(2) })
  ]));
  if(p.operacao === 'depurar' && p.correcao){
    caixa.appendChild(el('p', { class: 'sub', texto: 'O certo seria: ' + p.correcao }));
  }
  if(p.seFalhar){
    caixa.appendChild(el('p', { class: 'sub', texto: 'Se falhar: ' + p.seFalhar }));
  }

  /* A revelação é o `porque` da própria transição. É o momento em que a
     pergunta ensina, e por isso ela nunca é texto separado do conteúdo. */
  p.revelacao.forEach(function(r){
    var destaque = (p.chaveErrada && r.chave === p.chaveErrada) ? ' destaque' : '';
    var bloco = el('div', { class: 'rev' + destaque });
    var rel = el('div', { class: 'rel' });
    rel.appendChild(document.createTextNode(r.de + ' '));
    rel.appendChild(el('span', { class: 'verbo', texto: r.verbo }));
    rel.appendChild(document.createTextNode(' ' + r.para));
    bloco.appendChild(rel);
    bloco.appendChild(el('p', { texto: r.porque }));
    var meta = [];
    if(r.condicao) meta.push('condição: ' + r.condicao);
    if(r.requer && r.requer.length) meta.push('depende de: ' + r.requer.join(' · '));
    if(meta.length) bloco.appendChild(el('div', { class: 'meta', texto: meta.join('   ') }));
    if(r.ressalva) bloco.appendChild(el('div', { class: 'ressalva', texto: r.ressalva }));
    caixa.appendChild(bloco);
  });
  app.appendChild(caixa);
  window.scrollTo(0, document.body.scrollHeight);

  botao(s.i + 1 < s.perguntas.length ? 'Próxima' : 'Terminar', function(){
    s.i++;
    if(s.i < s.perguntas.length) telaPergunta();
    else fecharSessao();
  });
}

function fecharSessao(){
  var s = sessao;
  var r = E.fecharLote(g, estado, s.lote, s.agora);
  salvarEstado();

  limpar();
  semBotao();
  var acertos = s.resultados.filter(function(x){ return x.acertou; }).length;
  var subiram = r.decididas.filter(function(d){ return d.para > d.de; }).length;
  var cairam = r.decididas.filter(function(d){ return d.para < d.de; }).length;

  app.appendChild(el('h1', { texto: 'Sessão fechada' }));
  app.appendChild(el('p', { class: 'sub',
    texto: acertos + ' de ' + s.perguntas.length + ' perguntas · ' +
           r.decididas.length + ' caixas decididas' }));

  var cartao = el('div', { class: 'cartao' });
  var dois = el('div', { class: 'dois' });
  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Intervalos que subiram' }),
    el('div', { class: 'numero', texto: String(subiram) })
  ]));
  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Que voltaram atrás' }),
    el('div', { class: 'numero', texto: String(cairam) })
  ]));
  cartao.appendChild(dois);
  cartao.appendChild(el('p', { class: 'aviso',
    texto: 'Cada caixa tomou UMA decisão de intervalo, pela média das respostas que a ' +
           'exercitaram — não uma promoção por resposta. Acertar antes do vencimento ' +
           'não promove, e errar não zera a estrada andada.' }));
  app.appendChild(cartao);

  botao('Voltar ao percurso', telaPercurso);
}

telaPercurso();
})();
