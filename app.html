receptor metabotrópico de glutamato, nem LTD do cerebelo (que tem regra e maquinaria próprias), nem escalonamento sináptico homeostático, que é um mecanismo distinto e opera na célula inteira em vez de sinapse a sinapse. O protocolo de baixa frequência citado é o clássico de fatia; in vivo os padrões que produzem depressão são outros."}]},"08-consolidacao-sistemica.json":{"arquivo":"Consolidação sistêmica","nota_de_autoria":"Entra pelo terminal do 07 (`a-forca-fica-onde-ainda-pode-mudar`), e a ligação é o argumento: uma sinapse mantida onde ainda pode mudar é uma sinapse que pode ser sobrescrita. Este é o primeiro mecanismo em que o gargalo não é molecular e sim de ARQUITETURA — a tensão entre gravar de uma vez e não apagar o que já estava lá não tem solução dentro de uma rede só, e é dela que saem dois sistemas. As escalas `rede` e `sistemas` nascem aqui, e a distinção carrega o raciocínio: a interferência é um fato de rede, a saída é um fato de sistemas. O `debatido` daqui é o mais consequente do projeto até agora: até onde a lembrança antiga chega a dispensar o hipocampo.","entidades":[{"id":"hipocampo","nome":"Hipocampo","escala":"sistemas","funcao":"sistema de taxa alta: registra em uma exposição quais regiões corticais estavam ativas juntas, e devolve esse conjunto inteiro a partir de um fragmento","se_falhar":"episódios novos deixam de ser gravados e o que ainda dependia do índice se perde; o que já se sustenta no córtex continua acessível"},{"id":"giro-denteado","nome":"Giro denteado","escala":"sistemas","funcao":"primeira etapa do circuito hipocampal; espalha as entradas sobre uma população muito maior mantendo pouquíssimas células ativas de cada vez, o que afasta representações parecidas","se_falhar":"cenas parecidas voltam a receber códigos sobrepostos, e a interferência reaparece dentro do próprio sistema rápido"},{"id":"neocortex","nome":"Neocórtex","escala":"sistemas","funcao":"sistema de taxa baixa: acumula, ao longo de muitas reativações intercaladas, o que há de comum entre episódios diferentes","se_falhar":"nada chega a se tornar permanente, e toda evocação segue dependendo do índice para reunir as partes"}],"nos":[{"id":"sinapse-que-muda-rapido-e-sobrescrita","escala":"celular","descricao":"A mesma conexão que grava um episódio de uma vez pode ser regravada pelo episódio seguinte"},{"id":"representacao-distribuida-compartilha-pesos","escala":"rede","descricao":"As mesmas conexões participam de muitas lembranças, e nenhum peso pertence a uma só"},{"id":"aprender-rapido-num-so-lugar-apaga","escala":"rede","descricao":"Numa rede única, aprender depressa custa o que já estava guardado"},{"id":"passo-pequeno-so-soma-o-que-se-repete","escala":"rede","descricao":"Com ajuste pequeno, só o que aparece em muitos episódios chega a somar"},{"id":"passo-pequeno-perde-o-episodio-unico","escala":"rede","descricao":"O que aconteceu uma vez fica abaixo do ruído do próprio treino e não deixa marca"},{"id":"as-duas-exigencias-pedem-taxas-opostas","escala":"rede","descricao":"Guardar o que aconteceu uma vez e extrair o que se repete pedem valores opostos do mesmo parâmetro"},{"id":"dois-sistemas-com-taxas-diferentes","escala":"sistemas","descricao":"Um sistema rápido e um lento, com o rápido ensinando o lento"},{"id":"giro-denteado-separa-padroes","entidade":"giro-denteado","escala":"sistemas","descricao":"Entradas parecidas recebem conjuntos de células ativas que quase não se cruzam","quant":{"esparsidade":"poucos por cento das células granulares ativas de cada vez","expansao":"a população do giro denteado é da ordem de 5× a da entrada que ele recebe, no rato"}},{"id":"codigos-quase-disjuntos-nao-se-deslocam","escala":"rede","descricao":"Dois episódios cujas células quase não se cruzam não competem pelos mesmos pesos"},{"id":"hipocampo-grava-em-uma-exposicao","entidade":"hipocampo","escala":"sistemas","descricao":"O sistema rápido segura um episódio inteiro depois de acontecer uma única vez"},{"id":"hipocampo-guarda-o-indice-do-padrao","entidade":"hipocampo","escala":"sistemas","descricao":"O que fica gravado depressa é quais regiões corticais estavam ativas juntas, não o conteúdo delas"},{"id":"pista-parcial-completa-o-padrao","entidade":"hipocampo","escala":"sistemas","descricao":"Um fragmento da cena basta para o índice devolver o conjunto inteiro"},{"id":"ondulacao-aguda-reacende-a-sequencia","entidade":"hipocampo","escala":"sistemas","descricao":"Em repouso e no sono, o hipocampo percorre sozinho a sequência gravada, comprimida no tempo","quant":{"frequencia":"100 a 250 Hz","duracao":"≈ 50 a 100 ms por evento","compressao":"a sequência é percorrida cerca de 10 a 20× mais rápido do que foi vivida"}},{"id":"repeticao-sem-o-mundo-repetir","escala":"sistemas","descricao":"O episódio aconteceu uma vez e volta a acontecer centenas de vezes por dentro"},{"id":"reativacoes-vem-embaralhadas","escala":"sistemas","descricao":"Episódios de dias diferentes aparecem alternados na mesma janela de repouso"},{"id":"cortex-recebe-treino-intercalado","entidade":"neocortex","escala":"sistemas","descricao":"O sistema lento recebe muitos episódios misturados, em vez de um item de cada vez"},{"id":"cada-reativacao-soma-um-passo-no-cortex","entidade":"espinho-dendritico","escala":"celular","descricao":"Cada reativação produz nas sinapses corticais uma potenciação pequena, pela mesma regra de coincidência"},{"id":"ligacoes-corticais-se-sustentam","entidade":"neocortex","escala":"sistemas","descricao":"As regiões corticais passam a reacender umas às outras diretamente"},{"id":"evocar-deixa-de-precisar-do-indice","escala":"sistemas","descricao":"A evocação da lembrança antiga já não passa pelo sistema rápido"},{"id":"amnesia-retrograda-e-graduada-no-tempo","escala":"sistemas","descricao":"Uma lesão do hipocampo leva o recente e poupa o remoto","quant":{"gradiente_em_roedor":"dias a semanas","gradiente_em_humano":"anos a décadas"}},{"id":"o-que-sobrevive-e-o-que-se-repetiu","escala":"rede","descricao":"Fica o que era comum a muitas reativações, e cai o que era próprio de uma só"},{"id":"a-memoria-que-dura-mudou-de-lugar-e-de-forma","escala":"sistemas","descricao":"A lembrança estável não é a gravação original resistindo: é outra coisa, em outro sistema"}],"transicoes":[{"de":"a-forca-fica-onde-ainda-pode-mudar","para":"sinapse-que-muda-rapido-e-sobrescrita","tipo":"causa","certeza":"consolidado","porque":"É o mesmo parâmetro nos dois casos. Manter a sinapse numa faixa em que ainda dá para subir e descer é exatamente o que permite que a próxima entrada a mova de novo, e nenhuma regra local consegue ser sensível a uma gravação e surda à seguinte."},{"de":"representacao-distribuida-compartilha-pesos","para":"aprender-rapido-num-so-lugar-apaga","tipo":"compoe","certeza":"consolidado","porque":"Numa rede em que as mesmas conexões participam de tudo, não existe peso que pertença a uma lembrança só. Qualquer ajuste grande em favor de um item novo passa por cima dos valores de que os itens antigos dependiam."},{"de":"sinapse-que-muda-rapido-e-sobrescrita","para":"aprender-rapido-num-so-lugar-apaga","tipo":"causa","certeza":"consolidado","porque":"Um ajuste grande o bastante para gravar em uma exposição é, pelo mesmo tamanho, grande o bastante para desfazer o que estava gravado. O acerto no item novo e o erro no antigo crescem juntos porque saem do mesmo passo."},{"de":"representacao-distribuida-compartilha-pesos","para":"passo-pequeno-so-soma-o-que-se-repete","tipo":"compoe","certeza":"consolidado","porque":"Se o passo é pequeno, um episódio isolado quase não move os pesos, e só o que reaparece em muitos episódios chega a acumular. O compartilhamento deixa de ser o problema e vira o modo de extrair o que há de comum."},{"de":"passo-pequeno-so-soma-o-que-se-repete","para":"passo-pequeno-perde-o-episodio-unico","tipo":"causa","certeza":"consolidado","porque":"O mesmo tamanho de passo que protege o que já estava lá impede que uma exposição única deixe marca. Não são duas propriedades: é a mesma, vista pelo lado do que ela preserva e pelo lado do que ela descarta."},{"de":"aprender-rapido-num-so-lugar-apaga","para":"as-duas-exigencias-pedem-taxas-opostas","tipo":"compoe","certeza":"consolidado","porque":"Este é o custo do lado rápido: com passo grande a gravação de uma vez funciona, e o que já estava guardado é a moeda com que se paga por ela."},{"de":"passo-pequeno-perde-o-episodio-unico","para":"as-duas-exigencias-pedem-taxas-opostas","tipo":"compoe","certeza":"consolidado","porque":"E este é o custo do lado lento. Uma rede tem um valor de taxa por vez, e escolher um dos dois comportamentos custa o outro, o que faz do conflito uma propriedade da arquitetura e não uma falha de implementação."},{"de":"as-duas-exigencias-pedem-taxas-opostas","para":"dois-sistemas-com-taxas-diferentes","tipo":"permite","certeza":"consolidado","porque":"Se um valor não serve para as duas coisas, a saída é ter dois valores em lugares diferentes, com o rápido servindo de professor do lento. A separação não é elegância de projeto: é o que sobra depois que o conflito é levado a sério."},{"de":"giro-denteado-separa-padroes","para":"codigos-quase-disjuntos-nao-se-deslocam","tipo":"causa","certeza":"consolidado","requer":["giro-denteado"],"porque":"Se dois episódios usam células com pouquíssima interseção, os pesos que um ajusta não são os pesos de que o outro depende. A interferência cai porque as representações deixam de dividir substrato, e não porque o aprendizado tenha ficado mais cuidadoso."},{"de":"codigos-quase-disjuntos-nao-se-deslocam","para":"hipocampo-grava-em-uma-exposicao","tipo":"permite","certeza":"consolidado","requer":["hipocampo","giro-denteado"],"porque":"Com pouca sobreposição dá para usar passo grande sem pagar o preço da interferência. É essa combinação, e não a velocidade sozinha, que torna a gravação em uma exposição possível sem apagar o resto."},{"de":"dois-sistemas-com-taxas-diferentes","para":"hipocampo-grava-em-uma-exposicao","tipo":"compoe","certeza":"consolidado","requer":["hipocampo"],"porque":"Segurar o episódio inteiro depressa é a função do lado rápido da dupla, e é dele que vem a taxa alta. Sem alguém ocupando esse papel, a divisão de trabalho não tem serventia nenhuma."},{"de":"hipocampo-grava-em-uma-exposicao","para":"hipocampo-guarda-o-indice-do-padrao","tipo":"causa","certeza":"consolidado","requer":["hipocampo","neocortex"],"porque":"O conteúdo da cena continua espalhado pelo córtex, e o que cabe numa exposição só é o registro de quais regiões estavam ativas juntas. Guardar o endereço é barato o bastante para ser feito de primeira; guardar a cena não seria."},{"de":"hipocampo-guarda-o-indice-do-padrao","para":"pista-parcial-completa-o-padrao","tipo":"permite","certeza":"consolidado","requer":["hipocampo"],"condicao":"as células do índice se ligam densamente entre si, e não apenas às entradas","porque":"Uma população cujas células se ligam umas às outras devolve o conjunto inteiro a partir de um pedaço dele. Um cheiro isolado reacende o resto porque o índice foi guardado como um todo, e não como uma lista de itens separados."},{"de":"pista-parcial-completa-o-padrao","para":"ondulacao-aguda-reacende-a-sequencia","tipo":"permite","certeza":"consolidado","requer":["hipocampo"],"condicao":"fora do engajamento com o ambiente: sono de ondas lentas e repouso desperto","porque":"A mesma completação que serve para lembrar com uma pista dispara sem pista nenhuma quando o sistema não está ocupado com o mundo. É a autonomia dessa reativação que torna a etapa seguinte possível."},{"de":"ondulacao-aguda-reacende-a-sequencia","para":"repeticao-sem-o-mundo-repetir","tipo":"causa","certeza":"consolidado","porque":"O episódio aconteceu uma vez, e a reativação acontece centenas de vezes. O sistema lento recebe as repetições de que precisa sem que a experiência tenha de se repetir lá fora, que é o que resolve a impossibilidade prática de treiná-lo com o mundo."},{"de":"ondulacao-aguda-reacende-a-sequencia","para":"reativacoes-vem-embaralhadas","tipo":"causa","certeza":"consolidado","porque":"As reativações de uma noite não vêm em bloco: episódios de dias diferentes aparecem alternados na mesma janela. A mistura não é ruído do processo, é uma condição para que o passo seguinte funcione."},{"de":"repeticao-sem-o-mundo-repetir","para":"cortex-recebe-treino-intercalado","tipo":"compoe","certeza":"consolidado","requer":["neocortex"],"porque":"A quantidade é metade da receita: uma taxa baixa só chega a algum lugar se o mesmo padrão voltar muitas vezes. O número de repetições é o que compensa o tamanho pequeno de cada passo."},{"de":"reativacoes-vem-embaralhadas","para":"cortex-recebe-treino-intercalado","tipo":"compoe","certeza":"consolidado","requer":["neocortex"],"porque":"A ordem é a outra metade. Treinar um item até o fim antes de passar ao próximo é exatamente o que apaga o anterior numa rede compartilhada, e intercalar faz cada ajuste ser um acordo entre todos os itens em vez de uma reescrita."},{"de":"cortex-recebe-treino-intercalado","para":"cada-reativacao-soma-um-passo-no-cortex","tipo":"causa","certeza":"consolidado","requer":["neocortex","camkii","receptor-ampa","espinho-dendritico"],"porque":"A reativação põe pré e pós ativos ao mesmo tempo nas sinapses corticais, e a regra de coincidência responde ali como responde em qualquer lugar. Nada de novo é preciso na sinapse: muda a frequência com que o padrão volta, não a regra que ele obedece."},{"de":"cada-reativacao-soma-um-passo-no-cortex","para":"ligacoes-corticais-se-sustentam","tipo":"causa","certeza":"consolidado","requer":["neocortex"],"porque":"Muitos passos pequenos na mesma direção somam até que as regiões corticais consigam reacender umas às outras diretamente. O que precisava de um terceiro para ser reunido passa a se reunir sozinho."},{"de":"ligacoes-corticais-se-sustentam","para":"evocar-deixa-de-precisar-do-indice","tipo":"permite","certeza":"debatido","condicao":"vale de forma bem apoiada para conhecimento geral e para a versão esquemática do episódio","porque":"Se o padrão cortical se reúne sozinho, o índice deixa de ser necessário para evocá-lo. ATÉ ONDE isso vale está em disputa aberta: há evidência consistente de que lembranças ricas em detalhe do próprio episódio continuam exigindo o hipocampo a vida inteira, e nessa leitura o que fica independente é uma versão transformada, não a mesma lembrança."},{"de":"evocar-deixa-de-precisar-do-indice","para":"amnesia-retrograda-e-graduada-no-tempo","tipo":"causa","certeza":"consolidado","requer":["hipocampo"],"porque":"Uma lesão do sistema rápido leva o que ainda dependia dele e poupa o que já não depende. O gradiente não é sobre a idade da lembrança em si, é sobre quantas reativações ela já teve, e por isso ele se estica ou encurta conforme o quanto o material foi revisitado."},{"de":"passo-pequeno-so-soma-o-que-se-repete","para":"o-que-sobrevive-e-o-que-se-repetiu","tipo":"compoe","certeza":"consolidado","porque":"O destino acumula o que é comum a muitas reativações e deixa cair o que apareceu numa só. A perda de detalhe não é falha do arquivamento: é o mesmo mecanismo que extrai a regularidade, visto pelo lado do que ele descarta."},{"de":"cortex-recebe-treino-intercalado","para":"o-que-sobrevive-e-o-que-se-repetiu","tipo":"causa","certeza":"consolidado","porque":"Intercalar episódios diferentes reforça aquilo que eles têm em comum e dilui o que era próprio de cada um. A lembrança antiga se aproxima de um esquema, e o que ela perde é justamente o que a distinguia das outras."},{"de":"amnesia-retrograda-e-graduada-no-tempo","para":"a-memoria-que-dura-mudou-de-lugar-e-de-forma","tipo":"compoe","certeza":"consolidado","porque":"O gradiente é a assinatura observável da mudança de lugar. Se a lembrança tivesse ficado onde foi gravada, a lesão levaria as antigas junto com as recentes, e é isso que torna a afirmação testável em vez de retórica."},{"de":"o-que-sobrevive-e-o-que-se-repetiu","para":"a-memoria-que-dura-mudou-de-lugar-e-de-forma","tipo":"compoe","certeza":"consolidado","porque":"Mudar de lugar e mudar de forma aqui são a mesma coisa: o sistema lento não comporta o episódio inteiro, e o que chega até ele já vem filtrado pelo que se repetiu. Não existe transferência que preserve o original, porque o destino guarda outro tipo de coisa."}],"mecanismos":[{"id":"consolidacao-sistemica","fenomeno":"Se a sinapse que grava é a mesma que pode ser sobrescrita, como uma lembrança dura décadas?","entrada":"a-forca-fica-onde-ainda-pode-mudar","terminal":"a-memoria-que-dura-mudou-de-lugar-e-de-forma","limites":"Descreve a consolidação de memória declarativa dependente do hipocampo, na leitura de sistemas complementares de aprendizado. Não cobre consolidação sináptica local (as horas de síntese proteica logo depois do evento, que é outro processo e outra escala de tempo), nem memória procedural ou de medo, que têm circuitos próprios. A reconsolidação — o fato de que evocar uma lembrança a torna instável de novo — não está aqui e complica o quadro de transferência num sentido só. Os números de reativação e de gradiente vêm de roedor; em humano os prazos são de outra ordem e a evidência é sobretudo clínica e de imagem."}]},"09-erro-de-previsao.json":{"arquivo":"Erro de previsão de recompensa","nota_de_autoria":"Entra pelo terminal do 06, e não pelo do 08: este mecanismo é irmão da LTD, não filho dela. Os dois saem do mesmo buraco deixado pela regra de coincidência — a LTD porque a regra precisa de um sentido de descida, este porque a regra é CEGA à consequência. O argumento tem três fios que se encontram: quem recebe o crédito (a marca de elegibilidade), o que o sinal precisa relatar (diferença, não recompensa), e a evidência de que a dopamina tem exatamente essa forma. A ordem importa: a exigência é derivada do problema ANTES de olhar para o eletrodo, e é o encaixe entre as duas coisas que sustenta a identificação. O `debatido` daqui ataca a própria idealização que faz a conta fechar — a de que a difusão é um número só, igual para todo o alvo.","entidades":[{"id":"neuronio-dopaminergico","nome":"Neurônio dopaminérgico","escala":"sistemas","funcao":"população do mesencéfalo que dispara em rajada quando o resultado excede o previsto e silencia quando ele apenas confirma o previsto","se_falhar":"as marcas de elegibilidade expiram sem confirmação; a ação continua possível, mas deixa de ser corrigida pelo resultado"},{"id":"dopamina","nome":"Dopamina","escala":"molecular","funcao":"neuromodulador que não abre canal iônico e sim altera, por via metabotrópica, o que a marca deixada pela coincidência produz na sinapse","se_falhar":"o terceiro fator não chega à sinapse marcada e a coincidência expira sem virar mudança de peso"},{"id":"receptor-dopaminergico","nome":"Receptor dopaminérgico","escala":"molecular","funcao":"receptor metabotrópico que traduz a chegada da dopamina em mudança de sinalização interna, com efeito lento e sem corrente própria","se_falhar":"a dopamina chega e a sinapse não tem como lê-la; o sinal existe no tecido e não existe para a célula"}],"nos":[{"id":"coincidencia-nao-distingue-consequencia","escala":"rede","descricao":"A regra local fortalece qualquer par que coincidiu, tenha o resultado sido bom ou desastroso"},{"id":"a-consequencia-chega-depois-da-acao","escala":"rede","descricao":"O resultado que julga a ação aparece segundos depois da atividade que a produziu"},{"id":"quando-o-resultado-chega-a-coincidencia-ja-passou","escala":"celular","descricao":"No instante em que o resultado aparece, a atividade elétrica que o causou já terminou"},{"id":"regra-local-precisa-de-um-terceiro-fator","escala":"rede","descricao":"Além do lado que envia e do que recebe, faz falta um sinal que venha de fora da sinapse"},{"id":"a-coincidencia-deixa-uma-marca-quimica","entidade":"espinho-dendritico","escala":"molecular","descricao":"A coincidência deixa no espinho um estado bioquímico que dura muito mais que o evento elétrico"},{"id":"a-marca-nao-muda-a-forca-sozinha","entidade":"camkii","escala":"molecular","descricao":"Enquanto não é confirmada, a marca não altera o número de receptores da sinapse"},{"id":"a-marca-expira-se-nada-confirmar","entidade":"espinho-dendritico","escala":"molecular","descricao":"Sem confirmação em poucos segundos, o estado decai e a coincidência não vira mudança","quant":{"janela":"da ordem de 1 a 10 s entre a coincidência e o sinal que a confirma"}},{"id":"so-as-sinapses-marcadas-respondem-ao-sinal","escala":"rede","descricao":"Um sinal que chega a todas só produz efeito onde havia marca"},{"id":"o-sinal-alcanca-muitas-sinapses-de-uma-vez","entidade":"neuronio-dopaminergico","escala":"sistemas","descricao":"Poucos milhares de neurônios difundem o mesmo sinal por áreas enormes de uma vez"},{"id":"sinal-global-da-credito-especifico","escala":"rede","descricao":"Um sinal sem endereço nenhum consegue creditar exatamente quem participou"},{"id":"recompensa-ja-prevista-nao-traz-informacao","escala":"rede","descricao":"Um resultado que acontece sempre do mesmo jeito não diz nada que já não estivesse sabido"},{"id":"aprender-tem-de-parar-quando-a-previsao-acerta","escala":"rede","descricao":"Quando o que se espera já bate com o que acontece, não há correção a fazer"},{"id":"sinal-de-recompensa-nao-pararia-de-ensinar","escala":"rede","descricao":"Um sinal proporcional ao recebido seguiria chegando com força total depois de não haver mais nada a corrigir"},{"id":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","escala":"rede","descricao":"O terceiro fator relata o quanto o resultado excedeu ou ficou aquém do esperado"},{"id":"disparo-em-rajada-ao-inesperado","entidade":"neuronio-dopaminergico","escala":"sistemas","descricao":"Uma recompensa que não era esperada produz uma rajada curta e imediata","quant":{"latencia":"≈ 70 a 100 ms depois do evento","duracao":"poucas centenas de ms"}},{"id":"silencio-quando-o-resultado-era-previsto","entidade":"neuronio-dopaminergico","escala":"sistemas","descricao":"A mesma recompensa, depois de aprendida a pista, não produz resposta nenhuma"},{"id":"queda-abaixo-da-base-quando-o-esperado-falta","entidade":"neuronio-dopaminergico","escala":"sistemas","descricao":"A recompensa prevista que não vem produz uma pausa abaixo do disparo de repouso","quant":{"base_tonica":"≈ 1 a 8 Hz, o que limita o quanto o sinal negativo consegue descer"}},{"id":"a-queda-acontece-na-hora-marcada","escala":"sistemas","descricao":"A pausa cai exatamente no instante em que a recompensa era devida"},{"id":"a-resposta-anda-para-a-pista-mais-cedo","escala":"sistemas","descricao":"Com o treino, a rajada migra da recompensa para o primeiro aviso que a antecipa"},{"id":"dopamina-tem-a-forma-do-sinal-exigido","entidade":"dopamina","escala":"sistemas","descricao":"O que o eletrodo registra coincide com o que o problema exigia, ponto a ponto"},{"id":"a-previsao-se-corrige-ate-o-sinal-sumir","escala":"rede","descricao":"Cada erro ajusta a previsão no sentido que reduz o próximo erro, até não haver mais erro"},{"id":"so-o-que-nao-era-previsto-muda-peso","escala":"rede","descricao":"O que já era esperado atravessa o sistema sem alterar nada"},{"id":"extincao-e-aprendizado-e-nao-esquecimento","escala":"rede","descricao":"Deixar de esperar algo é uma correção ativa, movida por um sinal próprio"},{"id":"o-que-ensina-e-a-surpresa-nao-a-recompensa","escala":"rede","descricao":"O que move o aprendizado é a distância entre o mundo e o modelo dele, não o valor do que aconteceu"}],"transicoes":[{"de":"so-a-sinapse-coincidente-fica-mais-forte","para":"coincidencia-nao-distingue-consequencia","tipo":"causa","certeza":"consolidado","porque":"A regra olha só para o que aconteceu ao mesmo tempo nos dois lados da sinapse, e nem o lado que envia nem o que recebe carrega informação sobre como a história terminou. Uma coincidência que precedeu um desastre é fortalecida com o mesmo entusiasmo de uma que precedeu um acerto."},{"de":"coincidencia-nao-distingue-consequencia","para":"regra-local-precisa-de-um-terceiro-fator","tipo":"compoe","certeza":"consolidado","porque":"Se a informação que falta não está em nenhum dos dois lados, nenhum ajuste da regra local consegue recuperá-la. O que falta tem de chegar de fora, e isso faz do problema uma questão de arquitetura em vez de calibragem."},{"de":"a-consequencia-chega-depois-da-acao","para":"quando-o-resultado-chega-a-coincidencia-ja-passou","tipo":"causa","certeza":"consolidado","porque":"A atividade que produziu a ação dura dezenas de milissegundos e o resultado costuma levar segundos para aparecer. Os dois eventos que precisam ser associados não chegam a se sobrepor no tempo em momento nenhum."},{"de":"quando-o-resultado-chega-a-coincidencia-ja-passou","para":"regra-local-precisa-de-um-terceiro-fator","tipo":"compoe","certeza":"consolidado","porque":"Não basta um sinal vindo de fora: ele chega tarde demais para encontrar a atividade que deveria julgar. O terceiro fator precisa achar algum vestígio do que passou, ou não tem sobre o que agir."},{"de":"so-a-sinapse-coincidente-fica-mais-forte","para":"a-coincidencia-deixa-uma-marca-quimica","tipo":"compoe","certeza":"consolidado","requer":["espinho-dendritico"],"porque":"A mudança de força não é instantânea: entre detectar a coincidência e instalar receptores existe um estado intermediário que dura muito mais que o evento elétrico. O traço não é uma invenção deste mecanismo, é o intervalo que a potenciação comum já tinha."},{"de":"a-coincidencia-deixa-uma-marca-quimica","para":"a-marca-nao-muda-a-forca-sozinha","tipo":"causa","certeza":"consolidado","requer":["camkii","espinho-dendritico"],"porque":"O estado deixado pela coincidência é uma configuração transitória de proteínas, e mudar a força exige o passo separado de instalar ou retirar receptores. Marcar e executar são etapas distintas, e é a separação entre elas que abre espaço para uma confirmação vinda de fora."},{"de":"a-marca-nao-muda-a-forca-sozinha","para":"a-marca-expira-se-nada-confirmar","tipo":"causa","certeza":"consolidado","requer":["espinho-dendritico"],"porque":"Uma configuração de proteínas que não chega a ser consolidada decai no tempo próprio dela. A janela em que a sinapse continua elegível é curta, e é ela que define quanto atraso o resultado ainda pode ter para ser creditado."},{"de":"a-marca-expira-se-nada-confirmar","para":"so-as-sinapses-marcadas-respondem-ao-sinal","tipo":"permite","certeza":"consolidado","porque":"Se apenas as sinapses que coincidiram há pouco carregam a marca, um sinal que chega a todas encontra terreno preparado só nelas. A seletividade não está no sinal: está em quem tem como recebê-lo."},{"de":"so-as-sinapses-marcadas-respondem-ao-sinal","para":"sinal-global-da-credito-especifico","tipo":"compoe","certeza":"consolidado","porque":"O sinal não precisa descobrir qual sinapse merecia crédito, porque a própria sinapse já se marcou. Endereçamento específico sai de um sinal sem endereço nenhum, e é isso que torna a difusão em massa uma solução em vez de um problema."},{"de":"o-sinal-alcanca-muitas-sinapses-de-uma-vez","para":"sinal-global-da-credito-especifico","tipo":"compoe","certeza":"debatido","requer":["neuronio-dopaminergico","dopamina"],"condicao":"vale na idealização de um valor escalar único, igual para todo o alvo","porque":"Tratar a difusão como um número só é o que faz a conta fechar, e essa é a parte idealizada. Registros mostram populações dopaminérgicas heterogêneas, com subgrupos respondendo a coisas diferentes e com evidência de que o conjunto relata uma DISTRIBUIÇÃO de previsões em vez de uma média. Quanto disso muda a explicação continua em aberto, e a consequência prática é direta: um eletrodo em um neurônio sorteado não precisa reproduzir a curva do livro."},{"de":"regra-local-precisa-de-um-terceiro-fator","para":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","tipo":"permite","certeza":"consolidado","porque":"Um sinal vindo de fora só serve se carregar algo que a sinapse não tem como saber sozinha. E o que ela não sabe não é o valor do resultado: é o quanto esse resultado difere do que já estava previsto."},{"de":"recompensa-ja-prevista-nao-traz-informacao","para":"aprender-tem-de-parar-quando-a-previsao-acerta","tipo":"causa","certeza":"consolidado","porque":"Ajustar um modelo que já acerta só pode piorá-lo, porque não há direção de melhora disponível. O critério de parada não é economia de esforço: é a condição para o modelo se manter onde chegou."},{"de":"aprender-tem-de-parar-quando-a-previsao-acerta","para":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","tipo":"permite","certeza":"consolidado","porque":"Subtrair o que era esperado faz o próprio acerto da previsão zerar o sinal. O desligamento fica embutido na grandeza, sem precisar de um supervisor que observe de fora e decida quando terminou."},{"de":"sinal-de-recompensa-nao-pararia-de-ensinar","para":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","tipo":"permite","certeza":"consolidado","porque":"É a alternativa ingênua sendo descartada: um sinal proporcional ao recebido continuaria fortalecendo depois de a previsão estar certa, e o peso cresceria sem nada para detê-lo. Só uma diferença tem o zero no lugar certo."},{"de":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","requer":["dopamina"],"porque":"A comparação só vale porque a exigência foi derivada do problema ANTES de alguém olhar para o eletrodo. É o encaixe entre uma previsão feita por raciocínio e um registro feito por medida que sustenta a identificação, e não a semelhança notada depois."},{"de":"disparo-em-rajada-ao-inesperado","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","requer":["neuronio-dopaminergico"],"porque":"O primeiro encaixe é o mais óbvio: resultado melhor que o previsto produz sinal positivo. Sozinho ele não distinguiria um relato de recompensa de um relato de erro, e por isso não bastaria."},{"de":"silencio-quando-o-resultado-era-previsto","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","requer":["neuronio-dopaminergico"],"porque":"Este é o encaixe que separa as duas hipóteses. A recompensa continua sendo entregue e continua sendo boa, e mesmo assim não há resposta — o que só faz sentido se o que está sendo relatado for a diferença."},{"de":"queda-abaixo-da-base-quando-o-esperado-falta","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","requer":["neuronio-dopaminergico"],"porque":"Uma diferença precisa de sinal negativo, e nada acontecendo teria de ser codificado como zero. A pausa abaixo do repouso é a única forma de o sistema dizer pior do que eu esperava usando uma taxa de disparo."},{"de":"queda-abaixo-da-base-quando-o-esperado-falta","para":"a-queda-acontece-na-hora-marcada","tipo":"causa","certeza":"consolidado","porque":"A pausa não vem quando o animal desiste nem quando a sessão acaba: ela cai no instante em que a entrega era devida. Para acertar o instante, o sistema tem de guardar não só o quanto esperava, mas quando."},{"de":"a-queda-acontece-na-hora-marcada","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","porque":"Este encaixe é o mais exigente dos quatro, porque a hora não podia ser adivinhada por acaso. Ele mostra que a previsão tem endereço no tempo, e não apenas um valor esperado."},{"de":"disparo-em-rajada-ao-inesperado","para":"a-resposta-anda-para-a-pista-mais-cedo","tipo":"causa","certeza":"consolidado","porque":"Assim que a pista passa a prever a recompensa, a recompensa deixa de surpreender e a própria pista passa a ser o evento inesperado. A migração não é programada: ela cai de graça de um sinal que relata diferença."},{"de":"a-resposta-anda-para-a-pista-mais-cedo","para":"dopamina-tem-a-forma-do-sinal-exigido","tipo":"compoe","certeza":"consolidado","porque":"A migração é a assinatura que separa erro de previsão simples de erro de previsão encadeado no tempo. Ela mostra que cada estado aprende a prever o estado seguinte, e não apenas o desfecho final."},{"de":"dopamina-tem-a-forma-do-sinal-exigido","para":"o-sinal-alcanca-muitas-sinapses-de-uma-vez","tipo":"compoe","certeza":"consolidado","requer":["neuronio-dopaminergico","dopamina"],"porque":"A mesma população que relata a diferença é a que projeta para áreas enormes de uma vez. Conteúdo do sinal e alcance do sinal saem dos mesmos poucos milhares de neurônios, e por isso não podem ser separados um do outro."},{"de":"dopamina-tem-a-forma-do-sinal-exigido","para":"so-as-sinapses-marcadas-respondem-ao-sinal","tipo":"modula","certeza":"consolidado","requer":["dopamina","receptor-dopaminergico","camkii"],"porque":"A dopamina não abre canal iônico e não despolariza nada: ela age por receptor metabotrópico e altera o que a marca já existente vai produzir. Modular é a palavra exata, porque sem a marca o mesmo sinal não produz efeito nenhum."},{"de":"sinal-global-da-credito-especifico","para":"so-o-que-nao-era-previsto-muda-peso","tipo":"causa","certeza":"consolidado","porque":"Confirmação seletiva com sinal que já é diferença faz a mudança de peso acontecer só onde houve marca E houve surpresa. As duas condições juntas são o filtro que faltava à regra puramente local."},{"de":"o-sinal-e-a-diferenca-entre-previsto-e-recebido","para":"a-previsao-se-corrige-ate-o-sinal-sumir","tipo":"causa","certeza":"consolidado","porque":"Cada erro ajusta a previsão exatamente no sentido que reduz o erro seguinte, e o processo caminha para o ponto em que não sobra sinal. O aprendizado tem um fim natural, e o fim é a própria previsão ficar certa."},{"de":"a-previsao-se-corrige-ate-o-sinal-sumir","para":"o-que-ensina-e-a-surpresa-nao-a-recompensa","tipo":"compoe","certeza":"consolidado","porque":"Quando a correção converge, o que era novidade vira rotina e para de mover qualquer coisa. O sistema fica sensível apenas à margem entre o mundo e o que ele já dá por certo, e é essa margem que tem nome de surpresa."},{"de":"queda-abaixo-da-base-quando-o-esperado-falta","para":"extincao-e-aprendizado-e-nao-esquecimento","tipo":"permite","certeza":"consolidado","porque":"Deixar de esperar não acontece por desuso: acontece porque a ausência gera um sinal negativo que corrige a previsão para baixo. É por isso que a extinção tem curso próprio e pode ser mais rápida ou mais lenta que o esquecimento."},{"de":"so-o-que-nao-era-previsto-muda-peso","para":"o-que-ensina-e-a-surpresa-nao-a-recompensa","tipo":"compoe","certeza":"consolidado","porque":"Se o que já era esperado atravessa sem alterar nada, o valor do que aconteceu deixa de ser o que importa. O que importa é o tamanho do desacordo, e é ele, e não o prazer, que a dopamina está relatando."},{"de":"extincao-e-aprendizado-e-nao-esquecimento","para":"o-que-ensina-e-a-surpresa-nao-a-recompensa","tipo":"compoe","certeza":"consolidado","porque":"A surpresa ensina nos dois sentidos, e o sinal negativo é a prova de que ela não é sinônimo de coisa boa. Um resultado pior que o previsto corrige com a mesma legitimidade de um melhor."}],"mecanismos":[{"id":"erro-de-previsao","fenomeno":"Se a sinapse fortalece qualquer coincidência, por que uma recompensa que você já esperava não ensina nada?","entrada":"so-a-sinapse-coincidente-fica-mais-forte","terminal":"o-que-ensina-e-a-surpresa-nao-a-recompensa","limites":"Descreve o erro de previsão de recompensa do tipo diferença temporal e a leitura da dopamina mesencefálica como esse sinal. Não cobre os outros papéis da dopamina, que são reais e não derivam daqui: vigor e iniciação de movimento, custo de esforço, e a distinção entre querer e gostar (o prazer propriamente dito depende de outros sistemas). Não cobre erro de previsão sensorial fora do domínio de recompensa, nem aprendizado aversivo, cuja relação com esta população é mais disputada. A marca de elegibilidade está descrita no nível funcional: a identidade molecular do traço e a janela exata continuam sendo objeto de estudo."}]},"10-acumulo-de-evidencia.json":{"arquivo":"Acúmulo de evidência até o limiar","nota_de_autoria":"Entra pelo terminal do 03, e não pelo do 09: decidir a partir de evidência ruidosa não exige plasticidade nenhuma, exige neurônios que integrem e disparem. A entrada é o CÓDIGO DE FREQUÊNCIA, porque é a natureza do código que cria o problema — se a informação é uma taxa, ler exige uma janela, e janela curta é ambígua por construção. A escala `comportamento` nasce aqui: é o primeiro mecanismo cujo terminal se mede em tempo de resposta e taxa de acerto, não em eletrodo. O `debatido` é o mais afiado do projeto — a rampa média é compatível com duas histórias de tentativa única incompatíveis entre si, e a mesma figura sustenta as duas.","entidades":[{"id":"populacao-sensorial","nome":"População sensorial sintonizada","escala":"rede","funcao":"conjunto de neurônios cuja taxa sobe para uma das hipóteses e não para a outra; é a subtração entre duas dessas populações que isola a evidência","se_falhar":"não sobra grandeza a favor de nada, e o acumulador passa a somar ruído com a mesma diligência"},{"id":"circuito-integrador","nome":"Circuito integrador recorrente","escala":"rede","funcao":"rede cuja excitação entre os próprios membros repõe o que a membrana perde, sustentando um total por muito mais tempo que qualquer célula sozinha","se_falhar":"o total decai na escala da membrana, e a evidência de um segundo atrás já não está lá para ser somada"}],"nos":[{"id":"a-taxa-varia-mesmo-sem-mudar-o-estimulo","escala":"celular","descricao":"O mesmo estímulo, apresentado duas vezes, produz contagens de disparo diferentes"},{"id":"um-instante-nao-separa-as-hipoteses","escala":"rede","descricao":"Em janela curta, as contagens das duas hipóteses se sobrepõem quase por inteiro"},{"id":"somar-amostras-faz-o-ruido-crescer-mais-devagar","escala":"rede","descricao":"Numa soma de amostras independentes, a parte sistemática cresce mais depressa que a aleatória","quant":{"sistematica":"proporcional ao número de amostras","aleatoria":"proporcional à raiz do número de amostras"}},{"id":"so-o-tempo-desfaz-a-sobreposicao","escala":"rede","descricao":"A única coisa capaz de separar as duas hipóteses é olhar por mais tempo"},{"id":"a-diferenca-entre-populacoes-e-a-evidencia","entidade":"populacao-sensorial","escala":"rede","descricao":"A grandeza que informa é a subtração entre duas populações opostas, não a taxa de uma delas"},{"id":"a-membrana-esquece-em-dezenas-de-ms","entidade":"membrana","escala":"celular","descricao":"Uma célula sozinha perde o que recebeu na escala da própria constante de tempo","quant":{"constante_de_tempo":"≈ 10 a 30 ms"}},{"id":"realimentacao-positiva-compensa-o-vazamento","entidade":"circuito-integrador","escala":"rede","descricao":"A excitação recorrente entre os membros da rede repõe o que vaza de cada um"},{"id":"o-integrador-guarda-por-muito-mais-tempo","entidade":"circuito-integrador","escala":"rede","descricao":"A constante de tempo da rede fica muito maior que a de qualquer célula dela","quant":{"escala_util":"centenas de ms a alguns segundos"}},{"id":"o-acumulador-integra-a-diferenca","escala":"rede","descricao":"Um total cresce enquanto a evidência chega, mais depressa quando ela é mais forte"},{"id":"a-taxa-de-disparo-sobe-gradualmente","escala":"celular","descricao":"Durante a deliberação, a taxa média sobe em rampa, com inclinação maior quando a evidência é mais forte"},{"id":"atravessar-o-limiar-encerra-a-deliberacao","escala":"rede","descricao":"Alcançar um valor fixo dispara a resposta e interrompe o acúmulo"},{"id":"o-limiar-e-o-unico-parametro-livre","escala":"rede","descricao":"A força da evidência vem do mundo e a taxa de integração vem do circuito; só a altura sobra"},{"id":"limiar-alto-demora-e-acerta-mais","escala":"comportamento","descricao":"Exigir um total maior custa tempo e devolve acerto"},{"id":"limiar-baixo-responde-antes-e-erra-mais","escala":"comportamento","descricao":"Contentar-se com um total menor devolve tempo e custa acerto"},{"id":"velocidade-e-acerto-sao-a-mesma-escolha","escala":"comportamento","descricao":"Rapidez e precisão são duas leituras de uma única altura, e não duas capacidades"},{"id":"o-tempo-de-resposta-tem-cauda-longa","escala":"comportamento","descricao":"Muitas respostas perto do mínimo e uma cauda longa de tentativas lentas","quant":{"forma":"assimétrica à direita, e não em torno de uma média"}},{"id":"errar-e-acertar-saem-do-mesmo-processo","escala":"comportamento","descricao":"O erro é a mesma soma alcançando o limiar do lado oposto"},{"id":"a-taxa-chega-ao-mesmo-valor-no-fim","escala":"celular","descricao":"No instante da resposta a atividade é a mesma em tentativas fáceis e difíceis"},{"id":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","escala":"rede","descricao":"A decisão é uma acumulação cruzando um valor, e não um confronto resolvido num instante"}],"transicoes":[{"de":"codigo-de-frequencia-com-teto","para":"a-taxa-varia-mesmo-sem-mudar-o-estimulo","tipo":"causa","certeza":"consolidado","porque":"Se o que carrega a informação é quantos disparos por segundo, ler exige uma janela, e em janela curta a contagem flutua muito. A variação entre repetições é propriedade do código escolhido, e não erro de quem mede."},{"de":"a-taxa-varia-mesmo-sem-mudar-o-estimulo","para":"um-instante-nao-separa-as-hipoteses","tipo":"causa","certeza":"consolidado","porque":"Duas hipóteses com taxas médias parecidas produzem, em janela curta, distribuições que se cobrem quase por inteiro. Olhar uma vez e escolher a maior acerta pouco mais que o acaso sempre que a diferença for pequena."},{"de":"um-instante-nao-separa-as-hipoteses","para":"so-o-tempo-desfaz-a-sobreposicao","tipo":"compoe","certeza":"consolidado","porque":"Nenhum truque de leitura melhora um instante, porque a informação que falta não está nele. Se a grandeza disponível é sempre a mesma taxa, o que sobra para ser gasto é tempo."},{"de":"somar-amostras-faz-o-ruido-crescer-mais-devagar","para":"so-o-tempo-desfaz-a-sobreposicao","tipo":"permite","certeza":"consolidado","porque":"É o que torna gastar tempo um bom negócio em vez de mera espera. A razão entre a parte sistemática e a aleatória melhora sem limite conforme as amostras se acumulam, e é exatamente isso que o tempo compra."},{"de":"so-o-tempo-desfaz-a-sobreposicao","para":"a-diferenca-entre-populacoes-e-a-evidencia","tipo":"permite","certeza":"consolidado","requer":["populacao-sensorial"],"porque":"Uma taxa sozinha confunde evidência com contraste, atenção e vigília, que movem todas as taxas juntas. Subtrair duas populações sintonizadas em hipóteses opostas cancela o que é comum e deixa de pé só o que distingue."},{"de":"a-diferenca-entre-populacoes-e-a-evidencia","para":"o-acumulador-integra-a-diferenca","tipo":"causa","certeza":"consolidado","requer":["populacao-sensorial","circuito-integrador"],"porque":"Somar a diferença ao longo do tempo transforma amostras ambíguas numa grandeza que separa. O acumulador não decide nada e não compara nada: ele mantém um total que cresce mais depressa quando a evidência é mais forte."},{"de":"a-membrana-esquece-em-dezenas-de-ms","para":"realimentacao-positiva-compensa-o-vazamento","tipo":"permite","certeza":"consolidado","requer":["membrana","circuito-integrador"],"porque":"Guardar um total por um segundo com peças que esquecem em dezenas de milissegundos exige repor o que vaza. Excitação entre os próprios membros da rede é a forma mais barata de repor, porque usa as conexões que já existem."},{"de":"realimentacao-positiva-compensa-o-vazamento","para":"o-integrador-guarda-por-muito-mais-tempo","tipo":"causa","certeza":"consolidado","requer":["circuito-integrador"],"porque":"Quando o ganho da realimentação chega perto de compensar a perda, a constante de tempo efetiva do conjunto dispara para muito além da de qualquer célula. A memória do total passa a ser propriedade do circuito, e não de neurônio nenhum."},{"de":"o-integrador-guarda-por-muito-mais-tempo","para":"o-acumulador-integra-a-diferenca","tipo":"compoe","certeza":"consolidado","requer":["circuito-integrador"],"porque":"Sem sustentação o total decai antes de a evidência terminar de chegar, e a soma degenera numa média das últimas dezenas de milissegundos. Integrar de verdade exige que o começo do estímulo ainda esteja presente no fim dele."},{"de":"a-taxa-de-disparo-sobe-gradualmente","para":"o-acumulador-integra-a-diferenca","tipo":"compoe","certeza":"debatido","condicao":"a rampa é observada na MÉDIA sobre muitas tentativas","porque":"Uma taxa que sobe em rampa, com inclinação proporcional à força da evidência, é o que se esperaria de um total sendo somado. Só que a média sobre tentativas não distingue rampas de verdade de DEGRAUS abruptos disparados em instantes sorteados, e análise tentativa a tentativa já apoiou a segunda leitura em parte dos neurônios. A mesma figura sustenta duas histórias incompatíveis, e escolher entre elas exige olhar a tentativa única."},{"de":"o-acumulador-integra-a-diferenca","para":"atravessar-o-limiar-encerra-a-deliberacao","tipo":"permite","certeza":"consolidado","porque":"Um total que só cresce precisa de uma regra de parada, ou a deliberação não termina nunca. Fixar um valor e agir ao alcançá-lo é a regra mais barata possível, porque não exige confrontar nada com nada."},{"de":"atravessar-o-limiar-encerra-a-deliberacao","para":"o-limiar-e-o-unico-parametro-livre","tipo":"compoe","certeza":"consolidado","porque":"A força da evidência é imposta pelo mundo e a taxa de integração é imposta pelo circuito, mas a altura não é imposta por ninguém. É o único número que o próprio sistema pode mover de uma tentativa para a seguinte."},{"de":"o-limiar-e-o-unico-parametro-livre","para":"limiar-alto-demora-e-acerta-mais","tipo":"causa","certeza":"consolidado","porque":"Exigir um total maior significa esperar mais amostras, e mais amostras significam menos ruído dentro da soma. O acerto sobe pelo mesmo motivo pelo qual o tempo sobe, e não por dois motivos separados."},{"de":"o-limiar-e-o-unico-parametro-livre","para":"limiar-baixo-responde-antes-e-erra-mais","tipo":"causa","certeza":"consolidado","porque":"Contentar-se com um total menor encerra a deliberação antes de o ruído ter sido cancelado. O erro não vem de o sistema ter olhado mal, vem de ele ter olhado pouco."},{"de":"limiar-alto-demora-e-acerta-mais","para":"velocidade-e-acerto-sao-a-mesma-escolha","tipo":"compoe","certeza":"consolidado","porque":"Este é um lado do botão. Ganhar acerto sem gastar tempo exigiria mais informação por amostra, que é justamente o que não está disponível."},{"de":"limiar-baixo-responde-antes-e-erra-mais","para":"velocidade-e-acerto-sao-a-mesma-escolha","tipo":"compoe","certeza":"consolidado","porque":"E este é o outro. Rapidez e precisão não são duas capacidades a serem treinadas em separado: são as duas leituras de uma única altura, girada em sentidos opostos."},{"de":"atravessar-o-limiar-encerra-a-deliberacao","para":"o-tempo-de-resposta-tem-cauda-longa","tipo":"causa","certeza":"consolidado","porque":"O tempo até uma soma ruidosa alcançar um valor fixo tem distribuição assimétrica, com muitas respostas perto do mínimo e poucas muito lentas. Um sistema que respondesse depois de um tempo fixo produziria uma distribuição simétrica, que não é a que se mede."},{"de":"atravessar-o-limiar-encerra-a-deliberacao","para":"errar-e-acertar-saem-do-mesmo-processo","tipo":"causa","certeza":"consolidado","porque":"O erro é a mesma soma alcançando o valor do lado oposto, empurrada pelo ruído. Não existe um mecanismo do erro a ser explicado à parte, e é por isso que os tempos de acerto e de erro guardam relação previsível entre si."},{"de":"atravessar-o-limiar-encerra-a-deliberacao","para":"a-taxa-chega-ao-mesmo-valor-no-fim","tipo":"causa","certeza":"consolidado","porque":"Se o que encerra é alcançar um valor, a atividade no instante da resposta tem de ser a mesma em tentativa fácil e difícil, mudando só o tempo levado para chegar. É uma previsão arriscada, porque bastaria a atividade final acompanhar a dificuldade para derrubá-la."},{"de":"a-taxa-chega-ao-mesmo-valor-no-fim","para":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","tipo":"compoe","certeza":"consolidado","porque":"Valor final constante é o que separa um limiar de uma comparação. Comparar deixaria a atividade final acompanhar a diferença entre as opções, e o que se mede é o contrário disso."},{"de":"velocidade-e-acerto-sao-a-mesma-escolha","para":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","tipo":"compoe","certeza":"consolidado","porque":"Se a decisão fosse resolvida num instante não haveria botão a girar, e ser rápido não custaria acerto. O compromisso só existe porque a decisão acontece ao longo do tempo, e a sua própria existência é o argumento."},{"de":"errar-e-acertar-saem-do-mesmo-processo","para":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","tipo":"compoe","certeza":"consolidado","porque":"Uma comparação instantânea erraria por ter medido mal, e o erro seria um defeito a corrigir. Aqui ele é o resultado normal do procedimento correto, o que muda inteiramente o que faz sentido tentar consertar."},{"de":"o-tempo-de-resposta-tem-cauda-longa","para":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","tipo":"compoe","certeza":"consolidado","porque":"A forma da distribuição é assinatura de um processo que caminha até bater num limite, e não de um relógio que dispara na hora marcada. É o que se veria se a hesitação fosse uma travessia, e não uma consulta."}],"mecanismos":[{"id":"acumulo-de-evidencia","fenomeno":"Se cada instante é ambíguo, o que faz a hesitação terminar?","entrada":"codigo-de-frequencia-com-teto","terminal":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","limites":"Descreve decisão perceptual entre DUAS alternativas, com evidência estacionária, na leitura de acúmulo até limiar. Não cobre escolha entre muitas opções, nem evidência que muda durante a tentativa, nem decisão sob pressão de tempo com limiar que desce (os modelos de urgência descrevem os mesmos dados com um mecanismo diferente e disputam este terreno). Não cobre decisão baseada em valor, em que a grandeza acumulada não vem dos sentidos. O integrador está descrito no nível funcional: qual circuito faz a integração, e se ela é feita num lugar só, continua em aberto."}]},"11-controle-top-down.json":{"arquivo":"Controle top-down e competição enviesada","nota_de_autoria":"Entra pelo terminal do 10: se decidir é atravessar um limiar somando evidência, então a regra é boa mas só opera sobre o que chega. O argumento tem dois fios que se encontram no viés. Um vem da CONVERGÊNCIA — campos receptivos que crescem forçam competição, e a competição não é escolha de projeto. O outro vem do PADRÃO MANTIDO, e aqui há uma ponte real com o 10: a mesma realimentação recorrente que faz o integrador guardar um total é a que segura um alvo ativo sem estímulo. O ponto que o mecanismo existe para estabelecer é que o sinal de cima é pequeno e inespecífico, e quem amplifica é a competição local — a atenção não carrega o conteúdo. O `debatido` é sobre a força da conclusão: ausente ou apenas não relatado.","entidades":[{"id":"neuronio-de-convergencia","nome":"Neurônio de convergência","escala":"rede","funcao":"célula alta na hierarquia que recebe de muitas células abaixo, e por isso responde a uma região grande da cena em vez de a um ponto","se_falhar":"some a competição, e com ela some também a generalização: cada célula voltaria a responder a um ponto só, sem reconhecer nada acima do detalhe"},{"id":"interneuronio-inibitorio","nome":"Interneurônio inibitório local","escala":"rede","funcao":"célula de circuito curto pela qual duas representações ativas no mesmo lugar reduzem uma à outra","se_falhar":"as representações concorrentes coexistem sem que nenhuma se destaque, e a seleção nunca se resolve"},{"id":"cortex-prefrontal","nome":"Córtex pré-frontal","escala":"sistemas","funcao":"mantém ativo, por atividade persistente, o padrão do que está sendo procurado, mesmo quando ele não está presente na cena","se_falhar":"o viés perde a fonte, e a seleção passa a seguir apenas o que salta aos olhos"}],"nos":[{"id":"a-decisao-so-e-boa-quanto-a-evidencia-que-chega","escala":"rede","descricao":"A regra de acúmulo opera sobre o que lhe é entregue, e não sobre a cena inteira"},{"id":"o-que-nao-e-representado-nao-vira-evidencia","escala":"rede","descricao":"O que não chega a ter representação no alto não entra na soma de forma alguma"},{"id":"campos-receptivos-crescem-na-hierarquia","entidade":"neuronio-de-convergencia","escala":"rede","descricao":"Subindo a hierarquia, cada célula passa a responder a uma porção maior da cena","quant":{"ordem_de_grandeza":"de frações de grau na entrada a dezenas de graus no córtex temporal"}},{"id":"varios-objetos-caem-no-mesmo-campo","escala":"rede","descricao":"Numa cena comum, mais de um objeto cai dentro do campo da mesma célula"},{"id":"a-resposta-a-dois-objetos-fica-entre-as-duas","entidade":"neuronio-de-convergencia","escala":"celular","descricao":"A resposta ao par não é a soma das respostas a cada um: fica entre elas","quant":{"forma":"aproximadamente uma média das respostas isoladas, e não a soma"}},{"id":"um-neuronio-nao-representa-dois-de-uma-vez","escala":"celular","descricao":"A mesma taxa não consegue afirmar duas coisas diferentes ao mesmo tempo"},{"id":"a-competicao-e-forcada-pela-convergencia","escala":"rede","descricao":"A disputa por representação é consequência da arquitetura, não um recurso acrescentado"},{"id":"representacoes-vizinhas-se-reduzem","entidade":"interneuronio-inibitorio","escala":"rede","descricao":"Duas representações ativas no mesmo lugar reduzem uma à outra por circuito local"},{"id":"a-reducao-e-mutua-e-recorrente","escala":"rede","descricao":"Quem está por cima reduz mais o outro, e por isso fica ainda mais por cima"},{"id":"pequena-vantagem-vira-vantagem-grande","escala":"rede","descricao":"Uma diferença mínima entre os concorrentes acaba num resultado quase completo"},{"id":"o-vencedor-fica-como-se-o-outro-nao-existisse","entidade":"neuronio-de-convergencia","escala":"celular","descricao":"A resposta ao objeto selecionado se aproxima da que ele produziria sozinho no campo"},{"id":"um-padrao-e-mantido-ativo-sem-o-estimulo","entidade":"cortex-prefrontal","escala":"sistemas","descricao":"O padrão do que se procura permanece ativo enquanto o objeto não está presente","quant":{"duracao_tipica":"segundos, atravessando o intervalo entre a instrução e a cena"}},{"id":"o-padrao-mantido-favorece-quem-se-parece-com-ele","escala":"rede","descricao":"Quem se parece com o padrão mantido entra na disputa com uma vantagem"},{"id":"o-vies-e-pequeno-e-inespecifico","escala":"rede","descricao":"O sinal que desce é fraco e não carrega a forma do objeto"},{"id":"a-amplificacao-e-feita-pela-competicao-local","escala":"rede","descricao":"O trabalho de transformar vantagem em seleção é feito embaixo, não em cima"},{"id":"o-nao-selecionado-nao-chega-ao-alto","escala":"rede","descricao":"O que perdeu a disputa deixa de ter representação nos níveis altos"},{"id":"cegueira-ao-inesperado","escala":"comportamento","descricao":"Um objeto saliente e presente atravessa a cena sem ser relatado"},{"id":"atender-nao-e-olhar-com-mais-forca","escala":"rede","descricao":"Atender é resolver uma disputa, e não aumentar o ganho de um canal"},{"id":"atencao-muda-a-evidencia-nao-a-regra","escala":"rede","descricao":"O objetivo altera o que chega a contar como evidência, deixando intacta a regra que decide"}],"transicoes":[{"de":"decidir-e-um-limiar-atravessado-nao-uma-comparacao","para":"a-decisao-so-e-boa-quanto-a-evidencia-que-chega","tipo":"causa","certeza":"consolidado","porque":"Uma regra que soma o que recebe não tem como saber o que não recebeu. A qualidade da decisão passa a depender inteiramente do que foi entregue à soma, e nada dentro da regra protege contra uma entrega ruim."},{"de":"a-decisao-so-e-boa-quanto-a-evidencia-que-chega","para":"o-que-nao-e-representado-nao-vira-evidencia","tipo":"compoe","certeza":"consolidado","porque":"Só existe como evidência aquilo que chegou a ter representação em algum lugar que o acumulador leia. O que não foi representado não entra com peso pequeno: não entra."},{"de":"campos-receptivos-crescem-na-hierarquia","para":"varios-objetos-caem-no-mesmo-campo","tipo":"causa","certeza":"consolidado","requer":["neuronio-de-convergencia"],"porque":"Um campo que cobre dezenas de graus cobre também vários objetos de uma cena comum. O crescimento do campo é o que dá invariância à célula, e por isso a sobreposição não é defeito: é o preço de reconhecer o mesmo objeto em posições diferentes."},{"de":"varios-objetos-caem-no-mesmo-campo","para":"a-resposta-a-dois-objetos-fica-entre-as-duas","tipo":"causa","certeza":"consolidado","requer":["neuronio-de-convergencia"],"porque":"A resposta medida ao par fica próxima de uma média das respostas isoladas, e não da soma. É o achado que sustenta o mecanismo inteiro, porque somar seria o esperado se as duas entradas simplesmente convivessem."},{"de":"a-resposta-a-dois-objetos-fica-entre-as-duas","para":"um-neuronio-nao-representa-dois-de-uma-vez","tipo":"compoe","certeza":"consolidado","porque":"Uma taxa é um número só, e um número só não afirma duas coisas diferentes ao mesmo tempo. A média não é um meio-termo informativo: ela é ambígua entre os dois objetos e não identifica nenhum."},{"de":"um-neuronio-nao-representa-dois-de-uma-vez","para":"a-competicao-e-forcada-pela-convergencia","tipo":"compoe","certeza":"consolidado","porque":"Se a representação é escassa e a demanda é maior que ela, disputa é o que resta. A competição não foi acrescentada ao sistema por conveniência: ela cai da mesma convergência que torna o reconhecimento possível."},{"de":"varios-objetos-caem-no-mesmo-campo","para":"representacoes-vizinhas-se-reduzem","tipo":"causa","certeza":"consolidado","requer":["interneuronio-inibitorio"],"porque":"Circuitos locais fazem com que a atividade de uma representação reduza a da outra, através de interneurônios do mesmo lugar. A redução é de vizinhança, e por isso objetos distantes não disputam entre si."},{"de":"representacoes-vizinhas-se-reduzem","para":"a-reducao-e-mutua-e-recorrente","tipo":"causa","certeza":"consolidado","requer":["interneuronio-inibitorio"],"porque":"Cada lado reduz o outro na proporção da própria atividade, e o resultado volta a entrar na conta. Quem está momentaneamente por cima reduz mais, e com isso fica ainda mais por cima."},{"de":"a-reducao-e-mutua-e-recorrente","para":"pequena-vantagem-vira-vantagem-grande","tipo":"causa","certeza":"consolidado","porque":"Realimentação num sistema que se reduz mutuamente empurra o resultado para os extremos. Uma diferença mínima na entrada termina numa separação quase completa na saída, sem que nada tenha medido essa diferença."},{"de":"a-competicao-e-forcada-pela-convergencia","para":"pequena-vantagem-vira-vantagem-grande","tipo":"permite","certeza":"consolidado","porque":"A amplificação só faz sentido onde há disputa por um recurso escasso. Sem escassez de representação, favorecer um lado não tiraria nada do outro e não haveria o que amplificar."},{"de":"pequena-vantagem-vira-vantagem-grande","para":"o-vencedor-fica-como-se-o-outro-nao-existisse","tipo":"causa","certeza":"consolidado","requer":["neuronio-de-convergencia"],"porque":"A resposta ao objeto selecionado volta a se aproximar da que ele produziria sozinho no campo, como se o concorrente tivesse sido removido. Esta é a assinatura medida da seleção, e ela é forte porque prevê um valor específico em vez de apenas um aumento."},{"de":"o-integrador-guarda-por-muito-mais-tempo","para":"um-padrao-e-mantido-ativo-sem-o-estimulo","tipo":"permite","certeza":"consolidado","requer":["circuito-integrador","cortex-prefrontal"],"porque":"Guardar um alvo por segundos exige o mesmo recurso que guardar um total: excitação recorrente repondo o que a membrana perde. O que muda é o que está sendo sustentado, e não o modo de sustentar."},{"de":"um-padrao-e-mantido-ativo-sem-o-estimulo","para":"o-padrao-mantido-favorece-quem-se-parece-com-ele","tipo":"causa","certeza":"consolidado","requer":["cortex-prefrontal"],"porque":"Um padrão ativo soma-se à atividade de quem se parece com ele e não à de quem não se parece. A comparação com o alvo não é feita em lugar nenhum: ela é o efeito de somar duas atividades semelhantes."},{"de":"o-padrao-mantido-favorece-quem-se-parece-com-ele","para":"o-vies-e-pequeno-e-inespecifico","tipo":"compoe","certeza":"consolidado","porque":"O que desce é uma vantagem de partida, não uma descrição do objeto. Se o sinal de cima tivesse de carregar a forma procurada, ele precisaria da mesma banda que a via de baixo para cima, e a arquitetura estaria resolvendo o problema duas vezes."},{"de":"o-vies-e-pequeno-e-inespecifico","para":"a-amplificacao-e-feita-pela-competicao-local","tipo":"compoe","certeza":"consolidado","porque":"Um sinal fraco só produz efeito grande se houver algo embaixo capaz de amplificá-lo, e a competição recorrente é exatamente isso. O trabalho pesado da seleção acontece onde os objetos são representados, e não onde o objetivo é mantido."},{"de":"pequena-vantagem-vira-vantagem-grande","para":"a-amplificacao-e-feita-pela-competicao-local","tipo":"compoe","certeza":"consolidado","porque":"A não linearidade que transforma vantagem pequena em resultado grande está no circuito local, e é ela que dispensa o controle de ser detalhado. Um sistema sem essa amplificação precisaria de um sinal de cima proporcional ao efeito desejado."},{"de":"o-vencedor-fica-como-se-o-outro-nao-existisse","para":"o-nao-selecionado-nao-chega-ao-alto","tipo":"causa","certeza":"consolidado","porque":"Se a célula responde como se apenas um objeto estivesse ali, o outro deixou de ter representação naquele nível. A perda não é de intensidade e sim de existência para quem lê essa camada."},{"de":"a-amplificacao-e-feita-pela-competicao-local","para":"atender-nao-e-olhar-com-mais-forca","tipo":"compoe","certeza":"consolidado","porque":"Aumentar o ganho de um canal deixaria os concorrentes onde estavam, apenas mais fracos em comparação. Resolver uma disputa é outra operação, e é ela que explica por que o efeito é quase completo em vez de gradual."},{"de":"o-nao-selecionado-nao-chega-ao-alto","para":"cegueira-ao-inesperado","tipo":"causa","certeza":"debatido","condicao":"vale para o relato; medidas indiretas são o terreno em disputa","porque":"Se o objeto não conquistou representação no alto, não havia o que relatar, e a cegueira deixa de ser falha de memória para ser ausência do conteúdo. A leitura rival é que a representação existiu e não foi guardada até o momento do relato, e há evidência de efeitos indiretos de itens nunca relatados. As duas previsões só se separam em medidas que não dependem de relato."},{"de":"cegueira-ao-inesperado","para":"atencao-muda-a-evidencia-nao-a-regra","tipo":"compoe","certeza":"consolidado","porque":"Quem não relata o objeto não estava decidindo mal: estava decidindo bem sobre uma cena que não o continha. É a demonstração mais forte da separação, porque mostra a regra intacta e a conclusão errada ao mesmo tempo."},{"de":"o-nao-selecionado-nao-chega-ao-alto","para":"atencao-muda-a-evidencia-nao-a-regra","tipo":"compoe","certeza":"consolidado","porque":"O acumulador continua somando exatamente do mesmo jeito, e o que mudou foi o que lhe foi entregue. É por isso que a atenção altera o que se decide sem alterar o modo de decidir."},{"de":"o-que-nao-e-representado-nao-vira-evidencia","para":"atencao-muda-a-evidencia-nao-a-regra","tipo":"compoe","certeza":"consolidado","porque":"A regra de decisão não tem defesa contra o que nunca lhe chegou, e por isso selecionar a entrada é uma forma de determinar a saída sem tocar no procedimento. Quem controla o que vira evidência controla var __mods = {};
var __dirname = '.';
function require(pedido){
  if(pedido === 'node:fs' || pedido === 'fs') return {
    readdirSync: function(){ return Object.keys(__CONTEUDO); },
    readFileSync: function(p){
      var nome = String(p).split('/').pop();
      if(!(nome in __CONTEUDO)) throw new Error('conteúdo ausente no pacote: ' + nome);
      return JSON.stringify(__CONTEUDO[nome]);
    }
  };
  if(pedido === 'node:path' || pedido === 'path') return {
    join: function(){ return Array.prototype.slice.call(arguments).join('/'); }
  };
  var nome = String(pedido).replace(/^\.\//, '').replace(/\.js$/, '');
  if(!(nome in __mods)) throw new Error('módulo não empacotado: ' + pedido);
  return __mods[nome];
}
