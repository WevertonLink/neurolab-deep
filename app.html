<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>NeuroLab Profundo</title>
<style>
:root{
  --fundo:#0e1116; --painel:#161b23; --painel2:#1d2430; --borda:#2a3442;
  --texto:#e6edf5; --fraco:#93a1b3; --tenue:#5d6b7e;
  --acento:#4da3ff; --certo:#3fbf7f; --errado:#e8615a; --aviso:#e0a23c;
  --raio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo); color:var(--texto);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:720px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--fraco);font-size:13px;margin:0 0 18px}

.cartao{background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);padding:14px;margin:0 0 12px}
.linha{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}

/* trilha do percurso */
.trilha{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;
        color:var(--tenue);overflow-x:auto;padding:10px 0;white-space:nowrap}
.trilha .feito{color:var(--certo)} .trilha .curso{color:var(--acento)}

.barra{height:8px;background:var(--painel2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barra > i{display:block;height:100%;background:var(--certo);border-radius:99px;transition:width .35s}
.barra.tenue > i{background:var(--acento)}

.rotulo{font-size:12px;color:var(--fraco)}
.numero{font:600 15px/1 system-ui}
.selo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      padding:3px 8px;border-radius:99px;background:var(--painel2);color:var(--fraco)}
.selo.ok{background:rgba(63,191,127,.15);color:var(--certo)}
.selo.curso{background:rgba(77,163,255,.15);color:var(--acento)}
.fenomeno{color:var(--fraco);font-size:13px;margin:2px 0 8px}
.dep{font-size:11px;color:var(--tenue);margin-top:6px}

/* dois números lado a lado */
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dois > div{background:var(--painel2);border-radius:10px;padding:10px 12px}
.discorda{margin-top:10px;font-size:12px;color:var(--aviso);
          background:rgba(224,162,60,.1);border-radius:10px;padding:9px 11px}

/* botões */
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--borda);
       background:var(--painel2);color:var(--texto);padding:12px 16px}
button:disabled{opacity:.4;cursor:default}
.principal{background:var(--acento);border-color:var(--acento);color:#06121f;font-weight:600;width:100%;padding:15px}
.fantasma{background:transparent}

/* alternativas */
.alt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
     padding:13px 14px;margin:0 0 8px;background:var(--painel);border:1px solid var(--borda);border-radius:12px}
.alt .marca{flex:0 0 20px;height:20px;margin-top:1px;border:2px solid var(--tenue);
            border-radius:6px;display:grid;place-items:center;font-size:12px;color:transparent}
.alt.unica .marca{border-radius:99px}
.alt[aria-pressed="true"]{border-color:var(--acento);background:rgba(77,163,255,.09)}
.alt[aria-pressed="true"] .marca{border-color:var(--acento);background:var(--acento);color:#06121f}
.alt.certa{border-color:var(--certo);background:rgba(63,191,127,.1)}
.alt.errada{border-color:var(--errado);background:rgba(232,97,90,.1)}
.alt.perdida{border-color:var(--certo);border-style:dashed}

/* revelação */
.rev{border-left:3px solid var(--borda);padding:0 0 0 12px;margin:12px 0 0}
.rev + .rev{margin-top:14px}
.rev .rel{font-weight:600;font-size:14px;margin-bottom:4px}
.rev .verbo{color:var(--acento);font-weight:600}
.rev p{margin:6px 0 0;font-size:14px;color:var(--fraco)}
.rev .meta{font-size:12px;color:var(--tenue);margin-top:6px}
.ressalva{margin-top:8px;font-size:13px;color:var(--aviso);
          background:rgba(224,162,60,.1);border-radius:10px;padding:9px 11px}
.destaque{border-left-color:var(--errado)}

.progresso{display:flex;gap:4px;margin:0 0 14px}
.progresso i{flex:1;height:4px;background:var(--painel2);border-radius:99px}
.progresso i.feita{background:var(--certo)} .progresso i.falha{background:var(--errado)}
.progresso i.atual{background:var(--acento)}

.rodape{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--fundo) 26%);
        padding:22px 14px calc(14px + env(safe-area-inset-bottom))}
.rodape > div{max-width:720px;margin:0 auto}
.oculto{display:none}
.explorar{margin-top:12px;width:100%;padding:10px;font-size:14px}
.faixas{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.faixa{white-space:nowrap;padding:8px 13px;font-size:13px;border-radius:99px;background:var(--painel);color:var(--fraco)}
.faixa.viva{background:var(--acento);border-color:var(--acento);color:#06121f;font-weight:600}
.rel{font-weight:600;font-size:14px;margin-bottom:3px}
.verbo{color:var(--acento);font-weight:600}
.escalas{font-size:11px;color:var(--tenue);letter-spacing:.04em;margin-bottom:7px}
.meta{font-size:12px;color:var(--tenue);margin-top:7px}
.endereco{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tenue);margin-top:9px;opacity:.7}
.cartao > p{margin:6px 0 0;font-size:14px;color:var(--fraco)}
.aviso{font-size:12px;color:var(--tenue);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div class="rodape oculto" id="rodape"><div><button class="principal" id="acao"></button></div></div>
<script>

o","escala":"celular","descricao":"O interior fica eletricamente negativo em relação ao exterior"},{"id":"campo-eletrico-puxa-k-de-volta","entidade":"k","escala":"molecular","descricao":"O interior negativo atrai K⁺ de volta para dentro"},{"id":"equilibrio-eletroquimico","escala":"celular","descricao":"A saída por difusão e a entrada por atração elétrica se igualam: fluxo líquido zero"},{"id":"potencial-de-equilibrio-do-k","escala":"celular","descricao":"A voltagem em que as duas forças se anulam para o K⁺","quant":{"valor":"≈ −95 mV com estas concentrações","equacao":"E_K = 61,5 · log([K⁺]fora / [K⁺]dentro) = 61,5 · log(4/140)","por_que_os_livros_dizem_90":"o número muda com as concentrações assumidas: 5/140 mM dá ≈ −90 mV. A faixa −90 a −95 mV é a mesma conta com entradas diferentes, não duas teorias"}}],"transicoes":[{"de":"atp-disponivel","para":"k-concentrado-dentro","tipo":"causa","certeza":"consolidado","requer":["membrana","bomba-na-k"],"porque":"Transporte ativo: a ATPase usa a energia liberada pela quebra do ATP para empurrar íons CONTRA o gradiente — 3 Na⁺ para fora e 2 K⁺ para dentro a cada ciclo. É a única etapa desta cadeia que consome energia; todo o resto acontece de graça, a favor do que já está desequilibrado.","condicao":"membrana íntegra separando os dois meios"},{"de":"k-concentrado-dentro","para":"k-difunde-para-fora","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-k","membrana"],"porque":"Difusão: o movimento térmico de cada íon é aleatório e não tem direção preferida. Mas como há 35× mais K⁺ dentro, o número de íons que por acaso cruza para fora é maior que o número que cruza para dentro. O fluxo líquido não vem de nenhuma força puxando — vem só de haver mais partículas de um lado.","condicao":"canal de vazamento aberto — sem ele a diferença de concentração existe e não vai a lugar nenhum"},{"de":"k-difunde-para-fora","para":"carga-positiva-deixa-a-celula","tipo":"causa","certeza":"consolidado","porque":"O K⁺ é um cátion: mover o íon é mover a carga. Não existe transporte de matéria sem transporte de carga quando a partícula é carregada."},{"de":"carga-positiva-deixa-a-celula","para":"interior-mais-negativo","tipo":"causa","certeza":"consolidado","requer":["anions-internos","membrana"],"porque":"Os ânions intracelulares — proteínas e fosfatos — são grandes demais para atravessar a membrana. Quando o K⁺ sai, essas cargas negativas ficam para trás sem contraparte positiva. A negatividade não é criada: ela é o que sobra."},{"de":"interior-mais-negativo","para":"campo-eletrico-puxa-k-de-volta","tipo":"causa","certeza":"consolidado","porque":"Atração eletrostática: cargas opostas se atraem. O interior negativo passa a exercer força sobre o K⁺ positivo, no sentido oposto ao da difusão."},{"de":"k-difunde-para-fora","para":"equilibrio-eletroquimico","tipo":"compoe","certeza":"consolidado","porque":"A força química continua empurrando K⁺ para fora enquanto houver diferença de concentração."},{"de":"campo-eletrico-puxa-k-de-volta","para":"equilibrio-eletroquimico","tipo":"compoe","certeza":"consolidado","porque":"A força elétrica cresce à medida que mais K⁺ sai. Quando ela iguala a força química, cada íon que sai é compensado por um que entra: o fluxo líquido cessa, mas os dois fluxos continuam acontecendo. Equilíbrio não é imobilidade."},{"de":"equilibrio-eletroquimico","para":"potencial-de-equilibrio-do-k","tipo":"causa","certeza":"consolidado","porque":"Nernst quantifica em que voltagem as duas forças se anulam. O valor depende só da razão entre as concentrações — não de quantos íons existem, mas de quão desiguais estão.","quant":{"calculo":"61,5 · log(4/140) = 61,5 · (−1,544) ≈ −95 mV"}}],"mecanismos":[{"id":"gradiente-eletroquimico","fenomeno":"Por que existe uma diferença de carga elétrica entre o interior e o exterior da célula?","entrada":"atp-disponivel","terminal":"potencial-de-equilibrio-do-k","limites":"Descreve o equilíbrio para UM íon (K⁺) numa membrana permeável só a ele. A célula real é permeável a vários íons ao mesmo tempo, e por isso o potencial de repouso não fica no valor de equilíbrio do K⁺ — ver o mecanismo do potencial de membrana. Nernst também assume temperatura fixa e atividade iônica ideal."}]},"02-potencial-de-membrana.json":{"arquivo":"potencial de membrana em repouso","nota_de_autoria":"Este arquivo NÃO declara nenhuma aresta de ligação com o arquivo 01. Ele apenas usa os mesmos ids de nó (`atp-disponivel`, `potencial-de-equilibrio-do-k`). Se a travessia encontrar o caminho de ponta a ponta, a composição sem costura está provada.","entidades":[{"id":"canal-vazamento-na","nome":"Canal de vazamento de Na⁺","escala":"molecular","funcao":"poro sempre aberto para Na⁺, mas MUITO menos numeroso que os de K⁺","se_falhar":"a membrana ficaria permeável só a K⁺ e o repouso cairia praticamente em cima do equilíbrio do K⁺ (≈ −95 mV)"},{"id":"na","nome":"Íon sódio (Na⁺)","escala":"molecular","funcao":"cátion monovalente, concentrado do lado de FORA","se_falhar":"some a força que puxa o potencial para cima"}],"nos":[{"id":"na-concentrado-fora","entidade":"na","escala":"molecular","descricao":"Na⁺ muito mais concentrado fora do que dentro","quant":{"fora":"≈145 mM","dentro":"≈15 mM","razao":"≈10×"}},{"id":"na-difunde-para-dentro","entidade":"na","escala":"molecular","descricao":"Mais Na⁺ entra do que sai, pelos poucos canais de vazamento de Na⁺"},{"id":"carga-positiva-entra-na-celula","escala":"molecular","descricao":"Cada Na⁺ que entra traz uma carga positiva para dentro"},{"id":"mais-canais-de-k-que-de-na","escala":"molecular","descricao":"Há muito mais canais de vazamento de K⁺ abertos na membrana em repouso do que de Na⁺","quant":{"proporcao":"ordem de 25 a 40 canais de K⁺ para cada um de Na⁺, em número efetivo de poros abertos"}},{"id":"permeabilidade-desigual","escala":"celular","descricao":"A membrana em repouso é muito mais permeável a K⁺ do que a Na⁺","quant":{"razao_P_K_por_P_Na":"≈ 25 a 40 vezes"}},{"id":"bomba-e-eletrogenica","escala":"molecular","descricao":"A bomba tira 3 cargas positivas e devolve 2 — o saldo por ciclo é negativo","quant":{"contribuicao_direta":"≈ −3 mV"}},{"id":"potencial-de-repouso","escala":"celular","descricao":"A voltagem em que a célula se estabiliza quando nada a perturba","quant":{"valor":"≈ −70 mV","equacao":"Goldman: pondera cada íon pela permeabilidade da membrana a ele"}}],"transicoes":[{"de":"atp-disponivel","para":"na-concentrado-fora","tipo":"causa","certeza":"consolidado","requer":["membrana","bomba-na-k"],"porque":"Transporte ativo: a mesma ATPase que puxa K⁺ para dentro empurra Na⁺ para fora, no mesmo ciclo. Os dois gradientes são o mesmo investimento de energia.","condicao":"membrana íntegra separando os dois meios"},{"de":"na-concentrado-fora","para":"na-difunde-para-dentro","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-na","membrana"],"porque":"Difusão: há mais Na⁺ fora, então cruzam mais para dentro do que para fora. É o mesmo princípio do K⁺, no sentido oposto — porque o desequilíbrio é oposto."},{"de":"na-difunde-para-dentro","para":"carga-positiva-entra-na-celula","tipo":"causa","certeza":"consolidado","porque":"O Na⁺ é um cátion: mover o íon é mover a carga."},{"de":"potencial-de-equilibrio-do-k","para":"potencial-de-repouso","tipo":"compoe","certeza":"consolidado","porque":"O K⁺ é o íon a que a membrana é mais permeável, então é ele quem mais puxa o potencial. Por isso o repouso fica PERTO de E_K — mas não nele."},{"de":"carga-positiva-entra-na-celula","para":"potencial-de-repouso","tipo":"compoe","certeza":"consolidado","porque":"A entrada contínua de Na⁺ despeja carga positiva no interior e impede o potencial de chegar ao equilíbrio do K⁺ puro (≈ −95 mV). É esta a resposta para 'por que −70 e não o valor do potássio': existe um vazamento de sódio o tempo todo."},{"de":"mais-canais-de-k-que-de-na","para":"permeabilidade-desigual","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-k","canal-vazamento-na","membrana"],"porque":"Permeabilidade não é propriedade do íon, é do número de portas abertas para ele. A membrana não escolhe o K⁺: ela simplesmente tem muito mais poros por onde o K⁺ passa. Troque a densidade de canais e a permeabilidade muda junto, sem que nada no íon mude."},{"de":"permeabilidade-desigual","para":"potencial-de-repouso","tipo":"modula","certeza":"consolidado","porque":"Goldman: o potencial final é uma média dos potenciais de equilíbrio de cada íon, PONDERADA pela permeabilidade a cada um. Como P_K é 25 a 40× maior que P_Na, o resultado fica muito mais perto de E_K que de E_Na.","quant":{"E_K":"≈ −95 mV","E_Na":"≈ +60 mV","resultado":"≈ −70 mV"}},{"de":"bomba-e-eletrogenica","para":"potencial-de-repouso","tipo":"modula","certeza":"consolidado","porque":"Além de manter os gradientes, a bomba retira uma carga positiva líquida por ciclo. É uma contribuição pequena e direta, somada por cima do efeito dos gradientes.","quant":{"peso":"≈ −3 mV de ≈ −70 mV"}},{"de":"atp-disponivel","para":"bomba-e-eletrogenica","tipo":"causa","certeza":"consolidado","requer":["bomba-na-k"],"porque":"A assimetria 3:2 é uma propriedade do ciclo da bomba; ela só acontece enquanto há ATP para o ciclo rodar."}],"mecanismos":[{"id":"potencial-de-membrana","fenomeno":"Por que a célula em repouso fica em ≈ −70 mV, e não no equilíbrio do potássio (≈ −95 mV)?","entrada":"atp-disponivel","terminal":"potencial-de-repouso","limites":"Trata a permeabilidade como fixa. Ela não é: canais que abrem e fecham mudam esses pesos em milissegundos, e é exatamente disso que trata o potencial de ação. Os valores numéricos são de neurônio de mamífero a 37 °C e variam entre tipos celulares."}]},"03-potencial-de-acao.json":{"arquivo":"potencial de ação","nota_de_autoria":"Este arquivo também NÃO declara aresta nenhuma com 01 ou 02. Ele começa usando o id `potencial-de-repouso`, que o arquivo 02 produz, e a travessia costura sozinha. O mecanismo vai de canal iônico até código neural: termina em POR QUE a intensidade tem de ser representada na frequência, e não na amplitude. Nenhuma transição aqui é `inibe`, `bloqueia` ou `remove` — o que o fechamento de um canal produz está escrito como o ESTADO que resulta dele (`corrente-de-na-cessa`), porque o motor ainda trata toda aresta como propagação e uma aresta negativa faria a perturbação calcular ao contrário.","entidades":[{"id":"canal-na-voltagem","nome":"Canal de Na⁺ dependente de voltagem","escala":"molecular","funcao":"poro com DUAS comportas em série e independentes: a de ativação abre rápido com a despolarização, a de inativação fecha devagar com a mesma despolarização","se_falhar":"não há disparo nenhum; a membrana responde ao estímulo de forma passiva e o sinal se apaga em poucos milímetros (é o que a tetrodotoxina faz)"},{"id":"canal-k-voltagem","nome":"Canal de K⁺ dependente de voltagem","escala":"molecular","funcao":"retificador tardio: abre com a despolarização, mas com cinética lenta, e não se inativa nesta escala de tempo","se_falhar":"a repolarização passa a depender só do vazamento; o disparo alarga muito e o teto de frequência desaba (é o que a tetraetilamônio faz)"}],"nos":[{"id":"canais-de-na-disponiveis","entidade":"canal-na-voltagem","escala":"molecular","descricao":"Os canais de Na⁺ estão fechados mas PRONTOS: a comporta de inativação está aberta"},{"id":"estimulo-despolarizante","escala":"celular","descricao":"Uma corrente de entrada empurra o potencial para cima do repouso"},{"id":"limiar-atingido","escala":"celular","descricao":"O potencial cruza o limiar","quant":{"limiar":"≈ −55 mV","ressalva":"varia com o tipo celular e com a densidade local de canais"}},{"id":"comporta-de-ativacao-abre","entidade":"canal-na-voltagem","escala":"molecular","descricao":"As comportas de ativação giram e destravam o poro de Na⁺","quant":{"tempo":"menos de 0,5 ms"}},{"id":"na-entra-rapido","entidade":"na","escala":"molecular","descricao":"Na⁺ entra em grande quantidade pelos canais abertos"},{"id":"despolarizacao-cresce","escala":"celular","descricao":"O interior perde a negatividade e passa a positivo"},{"id":"amplitude-independente-do-estimulo","escala":"celular","descricao":"O disparo tem sempre a mesma altura, qualquer que tenha sido o estímulo que o iniciou"},{"id":"pico-do-potencial","escala":"celular","descricao":"A subida para perto do pico","quant":{"pico":"≈ +30 a +40 mV","E_Na":"≈ +60 mV","por_que_nao_chega":"a inativação começa antes de o equilíbrio ser alcançado"}},{"id":"comporta-de-inativacao-fecha","entidade":"canal-na-voltagem","escala":"molecular","descricao":"A comporta de inativação se fecha, com atraso, sobre o poro ainda ativado"},{"id":"corrente-de-na-cessa","entidade":"na","escala":"molecular","descricao":"A entrada de Na⁺ para, mesmo com a membrana ainda despolarizada"},{"id":"canais-de-k-abrem","entidade":"canal-k-voltagem","escala":"molecular","descricao":"Os canais de K⁺ dependentes de voltagem terminam de abrir","quant":{"atraso":"≈ 1 ms depois do início da despolarização"}},{"id":"k-sai-rapido","entidade":"k","escala":"molecular","descricao":"K⁺ sai em grande quantidade pelos canais dependentes de voltagem"},{"id":"repolarizacao","escala":"celular","descricao":"O interior volta a ficar negativo"},{"id":"hiperpolarizacao-tardia","escala":"celular","descricao":"O potencial passa do repouso e desce mais que ele","quant":{"vale":"≈ −80 mV","repouso":"≈ −70 mV","E_K":"≈ −95 mV"}},{"id":"fim-da-inativacao","entidade":"canal-na-voltagem","escala":"molecular","descricao":"As comportas de inativação reabrem e os canais voltam a ficar disponíveis"},{"id":"periodo-refratario","escala":"celular","descricao":"A célula não dispara de novo, por maior que seja o estímulo","quant":{"refratario_absoluto":"≈ 1 ms"}},{"id":"codigo-de-frequencia-com-teto","escala":"celular","descricao":"A intensidade só pode ser representada na frequência dos disparos, e essa frequência tem teto","quant":{"teto":"≈ 500 a 1000 disparos por segundo"}}],"transicoes":[{"de":"potencial-de-repouso","para":"canais-de-na-disponiveis","tipo":"permite","certeza":"consolidado","requer":["canal-na-voltagem","membrana"],"porque":"A comporta de inativação do canal de Na⁺ só permanece aberta enquanto a membrana está polarizada. É o repouso que mantém o canal disponível: numa célula que já esteja parcialmente despolarizada, boa parte dos canais está travada antes de qualquer estímulo chegar."},{"de":"estimulo-despolarizante","para":"limiar-atingido","tipo":"causa","certeza":"consolidado","porque":"Toda corrente de entrada desloca o potencial para cima. O limiar não é um número mágico gravado na célula: é a voltagem em que a corrente de Na⁺ que entra passa a superar a de K⁺ que sai, e o balanço deixa de puxar de volta para o repouso.","quant":{"limiar":"≈ −55 mV"}},{"de":"limiar-atingido","para":"comporta-de-ativacao-abre","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"O sensor de voltagem do canal é um segmento com resíduos carregados positivamente, segurados pelo campo elétrico da membrana polarizada. Quando o interior fica menos negativo, a força que os segurava afrouxa e o segmento se desloca, destravando o poro."},{"de":"canais-de-na-disponiveis","para":"comporta-de-ativacao-abre","tipo":"permite","certeza":"consolidado","porque":"O poro tem duas portas em série, e a corrente só passa com as duas abertas. Abrir a de ativação não serve de nada se a de inativação já estiver fechada, e é por isso que a disponibilidade prévia é condição do disparo, não consequência dele."},{"de":"comporta-de-ativacao-abre","para":"na-entra-rapido","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem","na","membrana"],"porque":"Com o poro aberto, as duas forças sobre o Na⁺ apontam para o mesmo lado: ele está dez vezes mais concentrado fora, e o interior está negativo, o que atrai um cátion. Somadas, produzem a maior corrente iônica que a célula gera.","quant":{"fora":"≈145 mM","dentro":"≈15 mM"}},{"de":"na-entra-rapido","para":"despolarizacao-cresce","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"Cada Na⁺ que entra traz uma carga positiva para o interior. Como a capacitância da membrana é pequena, um número de íons irrisório perto do total dissolvido já basta para mover a voltagem dezenas de milivolts."},{"de":"despolarizacao-cresce","para":"comporta-de-ativacao-abre","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"É a mesma sensibilidade à voltagem da abertura inicial, agora alimentada pela corrente que ela própria produziu. Aqui o laço se fecha sobre si mesmo, e é exatamente esse fechamento que separa um disparo de uma resposta passiva."},{"de":"despolarizacao-cresce","para":"amplitude-independente-do-estimulo","tipo":"causa","certeza":"consolidado","porque":"Depois que o laço se fecha, quem alimenta a subida é a corrente de Na⁺, não o estímulo. Um estímulo que mal cruza o limiar produz o mesmo disparo de um estímulo dez vezes maior, porque a partir daí o estímulo já não participa."},{"de":"despolarizacao-cresce","para":"pico-do-potencial","tipo":"causa","certeza":"consolidado","porque":"A subida para quando o interior fica positivo o bastante para que a força elétrica empurrando o Na⁺ para fora anule a química que o empurra para dentro. O teto é o potencial de equilíbrio do Na⁺, e ele nunca é alcançado por inteiro porque a inativação começa antes."},{"de":"despolarizacao-cresce","para":"comporta-de-inativacao-fecha","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"condicao":"alguns décimos de milissegundo depois da abertura","porque":"A mesma despolarização que abre a comporta de ativação também fecha a de inativação, só que devagar. É a diferença de velocidade entre as duas comportas, e não um sinal vindo de fora, que fixa a duração do disparo."},{"de":"comporta-de-inativacao-fecha","para":"corrente-de-na-cessa","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Com a porta de inativação fechada o poro deixa de conduzir, mesmo com a de ativação ainda aberta e a membrana ainda despolarizada. É um fechamento por tempo decorrido, e não por a voltagem ter voltado."},{"de":"despolarizacao-cresce","para":"canais-de-k-abrem","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem"],"condicao":"com atraso de cerca de um milissegundo","porque":"O canal de K⁺ dependente de voltagem responde à mesma despolarização, mas com cinética lenta. O atraso é o que faz o K⁺ chegar quando o Na⁺ já está saindo de cena, em vez de cancelá-lo desde o início e impedir o disparo."},{"de":"canais-de-k-abrem","para":"k-sai-rapido","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem","k","membrana"],"porque":"Com a membrana despolarizada, as duas forças sobre o K⁺ apontam para fora: ele continua mais concentrado dentro, e agora o interior positivo também o repele. A saída fica mais forte do que jamais é no repouso."},{"de":"pico-do-potencial","para":"k-sai-rapido","tipo":"modula","certeza":"consolidado","porque":"Quanto mais positivo o interior chegou, maior a distância até o equilíbrio do K⁺ e mais forte a força que empurra esse íon para fora. A altura do pico regula a velocidade da descida, e não só o tamanho do disparo."},{"de":"k-sai-rapido","para":"repolarizacao","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"Cada K⁺ que sai leva uma carga positiva embora do interior. É a mesma aritmética de carga da subida, com o sinal trocado, porque agora o cátion atravessa no sentido contrário."},{"de":"corrente-de-na-cessa","para":"repolarizacao","tipo":"permite","certeza":"consolidado","porque":"Enquanto o Na⁺ entrava, a saída de K⁺ apenas competia com ele. A descida só acontece porque a corrente de entrada já parou: com as duas ativas ao mesmo tempo elas se anulariam e a membrana ficaria travada no alto."},{"de":"repolarizacao","para":"hiperpolarizacao-tardia","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem"],"porque":"Os canais de K⁺ fecham devagar e continuam abertos depois que a voltagem já voltou. Com a condutância ao K⁺ maior do que no repouso, a membrana é puxada para mais perto do equilíbrio do próprio K⁺ do que costuma ficar."},{"de":"repolarizacao","para":"fim-da-inativacao","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"A comporta de inativação não reabre por tempo decorrido: ela reabre quando a membrana volta a polarizar. É a repolarização, e não o relógio, que devolve o canal ao estado disponível."},{"de":"hiperpolarizacao-tardia","para":"fim-da-inativacao","tipo":"modula","certeza":"consolidado","porque":"Com a membrana mais negativa do que no repouso, o campo que reposiciona as comportas de inativação fica mais forte e elas reabrem mais depressa. O undershoot não é sobra do mecanismo: é o que devolve a célula à prontidão antes do prazo normal."},{"de":"comporta-de-inativacao-fecha","para":"periodo-refratario","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Com a comporta de inativação fechada, o canal fica num terceiro estado: nem aberto, nem pronto. Enquanto ela não reabrir, nenhum estímulo produz disparo, porque o que falta à célula não é força de estímulo, é canal disponível."},{"de":"fim-da-inativacao","para":"periodo-refratario","tipo":"modula","certeza":"consolidado","porque":"Quem fixa a duração do refratário não é o disparo que passou, é a velocidade com que as comportas de inativação reabrem depois de a membrana repolarizar. Membrana mais negativa encurta esse tempo; despolarização sustentada o prolonga indefinidamente."},{"de":"amplitude-independente-do-estimulo","para":"codigo-de-frequencia-com-teto","tipo":"compoe","certeza":"consolidado","porque":"Se a altura do disparo não varia com a intensidade, a intensidade não cabe na amplitude e precisa de outro parâmetro. O único que sobra livre é quantos disparos acontecem por segundo, e é por isso que o axônio codifica em frequência."},{"de":"periodo-refratario","para":"codigo-de-frequencia-com-teto","tipo":"compoe","certeza":"consolidado","porque":"O tempo em que a célula fica indisponível é um piso para o intervalo entre dois disparos, e o inverso desse piso é o número máximo de disparos por segundo. O refratário deixa de ser detalhe de cinética e vira o limite de quanta informação o axônio consegue carregar."}],"mecanismos":[{"id":"potencial-de-acao","fenomeno":"Por que o disparo tem sempre a mesma altura, e o que isso obriga o neurônio a fazer para representar intensidade?","entrada":"potencial-de-repouso","terminal":"codigo-de-frequencia-com-teto","limites":"Descreve o disparo de axônio de mamífero, com canal de Na⁺ dependente de voltagem e retificador tardio de K⁺. Não cobre disparo dependente de Ca²⁺ (dendrito, célula cardíaca, célula ciliada), nem canais de K⁺ do tipo A, nem adaptação de frequência por correntes lentas. O teto de frequência aqui é o imposto pela inativação do Na⁺; em muitos neurônios reais o teto efetivo é bem menor e vem de outras correntes."}]},"04-conducao-saltatoria.json":{"arquivo":"condução saltatória","nota_de_autoria":"Também sem aresta declarada para arquivo nenhum: começa usando o id `despolarizacao-cresce`, que o arquivo 03 produz. A pergunta central é uma correção de intuição — quase todo mundo imagina que a mielina faz o sinal CORRER mais rápido. Não faz: a corrente pelo axoplasma já é praticamente instantânea com ou sem mielina. O que custa tempo é REGENERAR o disparo, e a mielina reduz o número de regenerações necessárias. O terminal do mecanismo é exatamente isso.","entidades":[{"id":"mielina","nome":"Bainha de mielina","escala":"celular","funcao":"dezenas de camadas de membrana glial enroladas em volta do axônio, cobrindo tudo menos as lacunas","se_falhar":"a corrente volta a vazar por todo o comprimento e o alcance passivo despenca; se o próximo nodo ficar fora de alcance, a condução não fica lenta, ela BLOQUEIA (é o que acontece na esclerose múltipla)"},{"id":"axoplasma","nome":"Axoplasma","escala":"celular","funcao":"o citoplasma do axônio, caminho condutor por dentro da fibra","se_falhar":"não há por onde a corrente local caminhar adiante, e cada ponto do axônio ficaria eletricamente isolado do vizinho"},{"id":"nodo-de-ranvier","nome":"Nodo de Ranvier","escala":"celular","funcao":"lacuna descoberta entre duas bainhas, onde a membrana fica exposta e os canais dependentes de voltagem se concentram","se_falhar":"sem membrana exposta não há onde regenerar, e o sinal atravessa passivamente até morrer"}],"nos":[{"id":"corrente-local-pelo-axoplasma","entidade":"axoplasma","escala":"celular","descricao":"A carga que entrou se redistribui pelo interior do axônio, adiante do ponto de entrada"},{"id":"vazamento-pela-membrana","entidade":"membrana","escala":"celular","descricao":"Parte da corrente que caminha por dentro escapa pela membrana antes de chegar adiante"},{"id":"decaimento-exponencial-com-a-distancia","escala":"celular","descricao":"A despolarização passiva fica menor quanto mais longe do ponto de origem","quant":{"lambda_sem_mielina":"≈ 0,1 a 1 mm","forma":"queda exponencial, não linear"}},{"id":"precisa-regenerar","escala":"celular","descricao":"O sinal tem de ser refeito com amplitude cheia em pontos sucessivos, ou não chega ao fim"},{"id":"regeneracao-custa-tempo","escala":"celular","descricao":"Cada regeneração consome tempo: abrir comportas e carregar a membrana até o limiar","quant":{"por_regeneracao":"algumas décimas de milissegundo"}},{"id":"mielina-envolve-o-axonio","entidade":"mielina","escala":"celular","descricao":"Camadas de membrana glial cobrem o axônio, deixando lacunas descobertas a intervalos regulares","quant":{"camadas":"dezenas a mais de cem","intervalo_entre_nodos":"≈ 1 a 2 mm"}},{"id":"resistencia-da-membrana-sobe","escala":"celular","descricao":"No trecho coberto, o caminho de fuga da corrente fica muito mais resistivo"},{"id":"capacitancia-da-membrana-cai","escala":"celular","descricao":"No trecho coberto, a membrana armazena muito menos carga por volt"},{"id":"constante-de-comprimento-aumenta","escala":"celular","descricao":"A distância em que a despolarização passiva ainda é aproveitável fica muito maior","quant":{"lambda_com_mielina":"vários milímetros","regra":"cresce com a raiz da razão entre resistência de membrana e resistência interna"}},{"id":"menos-carga-para-mudar-a-voltagem","escala":"celular","descricao":"O trecho coberto muda de voltagem quase sem atraso, porque exige pouca carga"},{"id":"diametro-do-axonio-maior","entidade":"axoplasma","escala":"celular","descricao":"O axônio é grosso","quant":{"axonio_gigante_da_lula":"≈ 0,5 a 1 mm de diâmetro"}},{"id":"resistencia-interna-cai","entidade":"axoplasma","escala":"celular","descricao":"A corrente encontra menos resistência para seguir adiante por dentro"},{"id":"canais-de-na-so-nos-nodos","entidade":"canal-na-voltagem","escala":"molecular","descricao":"Os canais de Na⁺ dependentes de voltagem ficam concentrados nas lacunas descobertas","quant":{"densidade_no_nodo":"ordens de grandeza acima da do trecho coberto"}},{"id":"regeneracao-so-nos-nodos","escala":"celular","descricao":"O disparo só é refeito nos nodos; o trecho coberto é atravessado passivamente"},{"id":"velocidade-vem-de-pular-regeneracoes","escala":"celular","descricao":"A velocidade não vem de o sinal correr mais rápido, e sim de ele parar menos vezes no caminho","quant":{"sem_mielina":"≈ 0,5 a 2 m/s","com_mielina":"até ≈ 120 m/s"}}],"transicoes":[{"de":"despolarizacao-cresce","para":"corrente-local-pelo-axoplasma","tipo":"causa","certeza":"consolidado","requer":["axoplasma"],"porque":"A carga que entrou não fica onde entrou. O interior do axônio conduz, e o excesso de carga positiva repele as cargas positivas vizinhas, redistribuindo-se adiante quase à velocidade da eletricidade. Nenhum canal participa desse passo: é condução elétrica, não transporte de íon ponto a ponto."},{"de":"corrente-local-pelo-axoplasma","para":"vazamento-pela-membrana","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"A membrana não é isolante perfeito: tem canais de vazamento abertos o tempo todo. Parte da corrente que caminha por dentro encontra esse caminho de saída e escapa em vez de seguir adiante."},{"de":"vazamento-pela-membrana","para":"decaimento-exponencial-com-a-distancia","tipo":"causa","certeza":"consolidado","porque":"Cada trecho de membrana subtrai uma fração constante da corrente que ainda segue. Fração constante por unidade de comprimento é justamente o que produz queda exponencial, e não linear: dobrar a distância não corta a voltagem pela metade, corta muito mais."},{"de":"constante-de-comprimento-aumenta","para":"decaimento-exponencial-com-a-distancia","tipo":"modula","certeza":"consolidado","porque":"O decaimento não desaparece com a mielina: ele passa a acontecer numa escala de distância muito maior. O sinal continua morrendo sozinho, só que agora morre depois de milímetros em vez de depois de décimos de milímetro."},{"de":"decaimento-exponencial-com-a-distancia","para":"precisa-regenerar","tipo":"causa","certeza":"consolidado","porque":"Um sinal que decai não atravessa um axônio de um metro. A única saída é refazê-lo: usar a despolarização que ainda sobrou para cruzar o limiar adiante e produzir um disparo novo, de amplitude cheia, que recomeça a contagem."},{"de":"precisa-regenerar","para":"regeneracao-custa-tempo","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Regenerar não é instantâneo: as comportas de ativação levam décimos de milissegundo para abrir, e a corrente ainda precisa carregar a capacitância local até o limiar. É este passo, e não a corrida da corrente pelo axoplasma, que consome o tempo da condução."},{"de":"regeneracao-custa-tempo","para":"velocidade-vem-de-pular-regeneracoes","tipo":"compoe","certeza":"consolidado","porque":"O custo de uma regeneração é praticamente o mesmo com mielina ou sem ela: são os mesmos canais, com a mesma cinética. É por isso que ele entra na conta da velocidade como um preço fixo por parada, e não como algo que a mielina acelere."},{"de":"mielina-envolve-o-axonio","para":"resistencia-da-membrana-sobe","tipo":"causa","certeza":"consolidado","requer":["mielina"],"porque":"A bainha são dezenas de camadas de membrana empilhadas em série, e resistências em série somam. O caminho de fuga da corrente fica tão resistivo no trecho coberto que praticamente nada vaza por ali."},{"de":"mielina-envolve-o-axonio","para":"capacitancia-da-membrana-cai","tipo":"causa","certeza":"consolidado","requer":["mielina"],"porque":"Capacitância cai quando a distância entre as placas aumenta, e a bainha afasta o meio externo do axoplasma por muitas camadas. Menos capacitância significa menos carga necessária para mover a voltagem daquele trecho."},{"de":"mielina-envolve-o-axonio","para":"canais-de-na-so-nos-nodos","tipo":"causa","certeza":"consolidado","requer":["mielina","nodo-de-ranvier","canal-na-voltagem"],"porque":"O contato da célula glial com o axônio organiza a membrana embaixo dela e empurra os canais dependentes de voltagem para as lacunas descobertas. A concentração nos nodos depende desse contato: sem bainha, os canais ficam espalhados por todo o comprimento."},{"de":"resistencia-da-membrana-sobe","para":"constante-de-comprimento-aumenta","tipo":"causa","certeza":"consolidado","porque":"A constante de comprimento cresce com a raiz da razão entre a resistência da membrana e a do interior. Com menos fuga por unidade de comprimento, a mesma corrente chega muito mais longe antes de a voltagem cair ao ponto de não servir."},{"de":"diametro-do-axonio-maior","para":"resistencia-interna-cai","tipo":"causa","certeza":"consolidado","requer":["axoplasma"],"porque":"Resistência de um condutor cai quando a área da seção aumenta, porque há mais caminhos em paralelo para a corrente. Dobrar o diâmetro quadruplica a área e derruba a resistência interna para um quarto."},{"de":"resistencia-interna-cai","para":"constante-de-comprimento-aumenta","tipo":"causa","certeza":"consolidado","porque":"O alcance passivo melhora tanto dificultando a fuga quanto facilitando o avanço por dentro. Esta é a segunda rota, e é a que os invertebrados usam: o axônio gigante da lula não tem mielina nenhuma e compensa com quase um milímetro de diâmetro."},{"de":"capacitancia-da-membrana-cai","para":"menos-carga-para-mudar-a-voltagem","tipo":"causa","certeza":"consolidado","porque":"Voltagem é carga dividida por capacitância. Com a capacitância menor, a mesma corrente que chega do nodo anterior levanta a voltagem daquele trecho muito mais depressa, quase sem gastar carga no caminho."},{"de":"canais-de-na-so-nos-nodos","para":"regeneracao-so-nos-nodos","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem","nodo-de-ranvier"],"porque":"Regenerar exige canal de Na⁺ dependente de voltagem, e onde não há canal não existe disparo possível. O trecho coberto só pode conduzir de forma passiva, e o disparo volta a existir apenas no nodo seguinte."},{"de":"menos-carga-para-mudar-a-voltagem","para":"regeneracao-so-nos-nodos","tipo":"permite","certeza":"consolidado","porque":"Pular um trecho só funciona se o que chega ao nodo seguinte ainda cruzar o limiar. A capacitância baixa é o que garante isso: quase nenhuma carga se perde enchendo a membrana do trecho coberto pelo caminho."},{"de":"constante-de-comprimento-aumenta","para":"regeneracao-so-nos-nodos","tipo":"permite","certeza":"consolidado","porque":"O nodo seguinte precisa estar dentro da distância em que a despolarização ainda é grande o bastante para disparar. É o alcance passivo aumentado que põe o próximo nodo dentro desse raio, e é por isso que perder a bainha pode bloquear a condução em vez de apenas atrasá-la."},{"de":"regeneracao-so-nos-nodos","para":"velocidade-vem-de-pular-regeneracoes","tipo":"causa","certeza":"consolidado","porque":"Atravessar uma distância exige um número de paradas igual a essa distância dividida pelo espaçamento entre nodos. Aumentar o espaçamento reduz o número de paradas na mesma proporção, e é aí que a velocidade sobe: o sinal não corre mais rápido, ele para menos vezes."}],"mecanismos":[{"id":"conducao-saltatoria","fenomeno":"Se a corrente elétrica já atravessa o axônio quase instantaneamente, por que a mielina torna a condução mais rápida?","entrada":"despolarizacao-cresce","terminal":"velocidade-vem-de-pular-regeneracoes","limites":"Descreve condução em axônio mielinizado de vertebrado, tratando a bainha como isolante passivo. Não cobre o papel metabólico da glia no sustento do axônio, nem a remodelação de mielina dependente de atividade, nem os canais de K⁺ justaparanodais. Trata o nodo como ponto; em fibras finas o comprimento do nodo importa. Os números de velocidade são de fibras motoras grandes de mamífero."}]},"05-transmissao-sinaptica.json":{"arquivo":"transmissão sináptica","nota_de_autoria":"Sem aresta declarada para arquivo nenhum: começa em `despolarizacao-cresce` (do 03) e usa `codigo-de-frequencia-com-teto` (terminal do 03) como modulador da plasticidade de curto prazo — porque o que chega ao terminal é literalmente uma taxa de disparos, e é a taxa que decide se domina facilitação ou depressão. A pergunta central não é como a sinapse funciona: é POR QUE o cérebro converte elétrico em químico e de volta, se a conversão custa meio milissegundo. Este é o primeiro arquivo com `certeza: debatido` — o sensor do Ca²⁺ residual está genuinamente em disputa, e o formato exige que isso chegue ao estudo com ressalva.","entidades":[{"id":"canal-ca-voltagem","nome":"Canal de Ca²⁺ dependente de voltagem","escala":"molecular","funcao":"abre com a despolarização no terminal pré-sináptico e fica agrupado a poucos nanômetros das vesículas prontas","se_falhar":"o disparo chega ao terminal e não acontece nada: a conversão de elétrico para químico não começa"},{"id":"ca","nome":"Íon cálcio (Ca²⁺)","escala":"molecular","funcao":"cátion divalente mantido ridiculamente baixo dentro da célula, o que o torna um sinal e não um solvente","se_falhar":"sem o mensageiro nenhuma vesícula funde, por mais disparos que cheguem"},{"id":"vesicula","nome":"Vesícula sináptica","escala":"molecular","funcao":"bolsa com uma quantidade aproximadamente fixa de transmissor, já encostada na membrana e esperando","se_falhar":"não há o que liberar; o terminal despolariza e a fenda continua vazia"},{"id":"proteinas-snare","nome":"Complexo SNARE e sinaptotagmina","escala":"molecular","funcao":"maquinaria que mantém a vesícula engatilhada e funde as membranas quando o sensor liga Ca²⁺","se_falhar":"a vesícula fica encostada e nunca funde — é o que as toxinas botulínica e tetânica fazem, cortando essas proteínas"},{"id":"neurotransmissor","nome":"Neurotransmissor","escala":"molecular","funcao":"molécula que atravessa a fenda por difusão e é lida por um receptor do outro lado","se_falhar":"a vesícula funde e nada é comunicado"},{"id":"fenda-sinaptica","nome":"Fenda sináptica","escala":"celular","funcao":"o espaço de cerca de vinte nanômetros que separa as duas células e impede continuidade elétrica","se_falhar":"sem separação as células ficariam eletricamente contínuas, e o sinal passaria sem poder ser alterado"},{"id":"receptor-ionotropico","nome":"Receptor ionotrópico","escala":"molecular","funcao":"canal que abre ao ligar o transmissor; o íon que ele deixa passar é o que define excitação ou inibição","se_falhar":"o transmissor chega à fenda e não é lido: não há corrente do outro lado"},{"id":"transportador-de-recaptacao","nome":"Transportador de recaptação","escala":"molecular","funcao":"recolhe o transmissor da fenda em poucos milissegundos, encerrando o sinal","se_falhar":"o receptor fica ligado, a resposta se arrasta e a sinapse perde a capacidade de transmitir um segundo evento"}],"nos":[{"id":"canais-de-ca-abrem","entidade":"canal-ca-voltagem","escala":"molecular","descricao":"Os canais de Ca²⁺ do terminal pré-sináptico abrem"},{"id":"ca-entra-no-terminal","entidade":"ca","escala":"molecular","descricao":"Ca²⁺ entra e a concentração local salta","quant":{"fora":"≈ 2 mM","dentro_em_repouso":"≈ 100 nM","razao":"≈ 20 000×"}},{"id":"sensor-de-ca-dispara-fusao","entidade":"proteinas-snare","escala":"molecular","descricao":"A sinaptotagmina liga Ca²⁺ e destrava o complexo SNARE"},{"id":"vesicula-funde","entidade":"vesicula","escala":"molecular","descricao":"A vesícula funde com a membrana e se abre para a fenda"},{"id":"transmissor-na-fenda","entidade":"neurotransmissor","escala":"molecular","descricao":"O transmissor está na fenda e difunde até o outro lado","quant":{"largura_da_fenda":"≈ 20 nm","atraso_sinaptico_total":"≈ 0,5 ms"}},{"id":"receptor-abre","entidade":"receptor-ionotropico","escala":"molecular","descricao":"O receptor liga o transmissor e o próprio poro dele abre"},{"id":"receptor-decide-o-sinal","entidade":"receptor-ionotropico","escala":"molecular","descricao":"É o receptor, e não o transmissor, que determina se o efeito excita ou inibe"},{"id":"corrente-pos-sinaptica","escala":"molecular","descricao":"Íons atravessam o receptor aberto, gerando corrente na célula que recebe"},{"id":"potencial-pos-sinaptico-graduado","escala":"celular","descricao":"A voltagem da célula receptora muda em proporção a quanto transmissor chegou"},{"id":"remocao-do-transmissor","entidade":"transportador-de-recaptacao","escala":"molecular","descricao":"O transmissor é recolhido da fenda em poucos milissegundos"},{"id":"sinal-vira-analogico","escala":"celular","descricao":"O disparo tudo-ou-nada volta a ser um sinal contínuo, que pode ser somado"},{"id":"numero-de-vesiculas-varia","escala":"molecular","descricao":"Quantas vesículas fundem muda de um disparo para outro","quant":{"dependencia_do_ca":"aproximadamente quártica"}},{"id":"ganho-ajustavel","escala":"celular","descricao":"A força da sinapse tem um botão do lado de quem envia"},{"id":"ca-residual-no-terminal","entidade":"ca","escala":"molecular","descricao":"Sobra Ca²⁺ no terminal depois do disparo, por dezenas a centenas de milissegundos"},{"id":"facilitacao-de-curto-prazo","escala":"celular","descricao":"O disparo seguinte solta mais transmissor que o anterior"},{"id":"esgotamento-do-estoque","entidade":"vesicula","escala":"molecular","descricao":"O conjunto de vesículas prontas para fundir se esvazia mais rápido do que é reposto"},{"id":"depressao-de-curto-prazo","escala":"celular","descricao":"O disparo seguinte solta menos transmissor que o anterior"},{"id":"historia-recente-muda-a-forca","escala":"celular","descricao":"A força da sinapse depende do que aconteceu nela nos últimos milissegundos"},{"id":"sinal-pode-ser-mudado-na-passagem","escala":"celular","descricao":"A conversão para química existe para que o sinal possa ser alterado no caminho, e não apenas transportado"}],"transicoes":[{"de":"despolarizacao-cresce","para":"canais-de-ca-abrem","tipo":"causa","certeza":"consolidado","requer":["canal-ca-voltagem"],"porque":"O terminal pré-sináptico tem canais de Ca²⁺ dependentes de voltagem, e eles respondem à mesma despolarização que percorreu o axônio. O sinal elétrico não atravessa a fenda: ele para aqui, e a partir deste ponto o que segue é outra coisa."},{"de":"canais-de-ca-abrem","para":"ca-entra-no-terminal","tipo":"causa","certeza":"consolidado","requer":["canal-ca-voltagem","ca","membrana"],"porque":"O gradiente de Ca²⁺ é o mais extremo da célula: cerca de vinte mil vezes mais concentrado fora do que dentro. Uma abertura brevíssima produz um salto local de concentração enorme, e é essa desproporção que faz do Ca²⁺ um sinal em vez de um solvente."},{"de":"ca-entra-no-terminal","para":"sensor-de-ca-dispara-fusao","tipo":"causa","certeza":"consolidado","requer":["ca","proteinas-snare"],"porque":"A sinaptotagmina liga Ca²⁺ e muda de forma, destravando um complexo SNARE que já mantinha a vesícula encostada na membrana. A maquinaria estava pronta antes do disparo: o Ca²⁺ não a constrói, só solta o gatilho, e é daí que vem a rapidez."},{"de":"sensor-de-ca-dispara-fusao","para":"vesicula-funde","tipo":"causa","certeza":"consolidado","requer":["vesicula","proteinas-snare","membrana"],"porque":"As proteínas SNARE se enrolam umas nas outras e puxam as duas membranas uma contra a outra até elas se fundirem. O conteúdo da vesícula passa a estar do lado de fora sem nunca ter atravessado membrana alguma."},{"de":"vesicula-funde","para":"transmissor-na-fenda","tipo":"causa","certeza":"consolidado","requer":["neurotransmissor","fenda-sinaptica"],"porque":"Cada vesícula despeja uma quantidade aproximadamente fixa de transmissor. Por isso a liberação é quântica: o que varia de um disparo para outro é o NÚMERO de vesículas que fundem, e não o quanto cada uma carrega."},{"de":"transmissor-na-fenda","para":"receptor-abre","tipo":"causa","certeza":"consolidado","requer":["neurotransmissor","receptor-ionotropico"],"porque":"O transmissor difunde os poucos nanômetros da fenda e se liga ao receptor. Como a distância é minúscula, essa travessia é quase instantânea: o meio milissegundo de atraso sináptico vem do passo do Ca²⁺ e da fusão, não do trajeto."},{"de":"transmissor-na-fenda","para":"remocao-do-transmissor","tipo":"causa","certeza":"consolidado","requer":["transportador-de-recaptacao","neurotransmissor"],"porque":"Transportadores no próprio terminal e nas células gliais vizinhas recolhem o transmissor da fenda em poucos milissegundos. Sem essa retirada o receptor permaneceria ligado, e a sinapse não teria como comunicar um segundo evento."},{"de":"receptor-abre","para":"corrente-pos-sinaptica","tipo":"causa","certeza":"consolidado","requer":["receptor-ionotropico","membrana"],"porque":"O receptor ionotrópico é ele próprio um canal: ligar o transmissor abre o poro, sem nenhum intermediário entre a ligação e a corrente. É esse atalho que torna a transmissão rápida o bastante para sustentar comportamento."},{"de":"receptor-abre","para":"receptor-decide-o-sinal","tipo":"causa","certeza":"consolidado","requer":["receptor-ionotropico"],"porque":"Quem determina se o efeito excita ou inibe é o íon que aquele receptor deixa passar, e não a molécula que o abriu. O mesmo transmissor despolariza numa célula e hiperpolariza noutra: a informação sobre o sinal mora no lado que recebe, não no que envia."},{"de":"corrente-pos-sinaptica","para":"potencial-pos-sinaptico-graduado","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"A corrente muda a voltagem da célula receptora em proporção a quanto transmissor chegou. Aqui não existe laço regenerativo como no axônio, e por isso a resposta é graduada: o dobro de entrada dá aproximadamente o dobro de resposta."},{"de":"remocao-do-transmissor","para":"potencial-pos-sinaptico-graduado","tipo":"modula","certeza":"consolidado","porque":"A duração do potencial pós-sináptico é fixada por quanto tempo o transmissor permanece na fenda. Remover mais devagar alarga a resposta em vez de aumentar o pico — é assim que um bloqueador de recaptação age, prolongando e não intensificando."},{"de":"potencial-pos-sinaptico-graduado","para":"sinal-vira-analogico","tipo":"compoe","certeza":"consolidado","porque":"O disparo que chegou era tudo-ou-nada e o que sai é contínuo. A sinapse desfaz a digitalização de propósito: sem voltar ao analógico não haveria o que somar, e somar entradas de muitas origens é a operação que um neurônio existe para fazer."},{"de":"ca-entra-no-terminal","para":"numero-de-vesiculas-varia","tipo":"modula","certeza":"consolidado","porque":"A probabilidade de uma vesícula fundir cresce com a concentração local de Ca²⁺ elevada à quarta potência, aproximadamente. Uma mudança pequena no Ca²⁺ que entra vira uma mudança grande em quantas vesículas soltam."},{"de":"numero-de-vesiculas-varia","para":"ganho-ajustavel","tipo":"compoe","certeza":"consolidado","porque":"Se o que varia é o número de vesículas, a força da sinapse tem um controle do lado de quem envia. Qualquer coisa que altere o Ca²⁺ do terminal muda o ganho sem encostar no receptor do outro lado."},{"de":"ca-entra-no-terminal","para":"ca-residual-no-terminal","tipo":"causa","certeza":"consolidado","porque":"Bombas e tampões levam dezenas a centenas de milissegundos para devolver o Ca²⁺ ao nível de repouso. Se outro disparo chega antes disso, o Ca²⁺ novo se soma ao que ainda não foi retirado."},{"de":"ca-residual-no-terminal","para":"facilitacao-de-curto-prazo","tipo":"causa","certeza":"debatido","porque":"O resíduo aumenta a probabilidade de liberação no disparo seguinte. QUAL proteína lê esse resíduo continua em disputa: a sinaptotagmina-7 é a candidata com mais apoio experimental, e há evidência de que outras proteínas ligadoras de Ca²⁺ respondem por parte do efeito, em proporção que varia conforme o tipo de sinapse."},{"de":"vesicula-funde","para":"esgotamento-do-estoque","tipo":"causa","certeza":"consolidado","porque":"O conjunto de vesículas já engatilhadas é pequeno e leva tempo para ser reposto. Disparos em sequência rápida consomem esse estoque mais depressa do que a reposição consegue acompanhar."},{"de":"esgotamento-do-estoque","para":"depressao-de-curto-prazo","tipo":"causa","certeza":"consolidado","porque":"Com menos vesículas prontas, o disparo seguinte solta menos transmissor. A sinapse fica mais fraca por ter sido usada, sem que nada tenha sido decidido a respeito e sem nenhum sinal de controle envolvido."},{"de":"facilitacao-de-curto-prazo","para":"historia-recente-muda-a-forca","tipo":"compoe","certeza":"consolidado","porque":"A facilitação empurra a força para cima quando os disparos chegam juntos. Como ela depende do intervalo entre eles, quem a governa é o ritmo de chegada, e não a intensidade de qualquer disparo isolado."},{"de":"depressao-de-curto-prazo","para":"historia-recente-muda-a-forca","tipo":"compoe","certeza":"consolidado","porque":"A depressão empurra a força para baixo pelo mesmo motivo temporal, em sentido contrário. Qual das duas domina depende da sinapse e d    viraria reconhecimento em vez de reconstrução.

   O slate SEMPRE reserva ao menos `MIN_ERRADAS` alternativas erradas. Sem
   isso aparece uma degeneração que o primeiro teste de fumaça pegou:
   quando a entidade derruba o recorte inteiro, todas as alternativas são
   corretas e "marcar tudo" tira nota cheia. Com a reserva, marcar tudo dá
   no máximo (n − MIN_ERRADAS)/n, que fica abaixo da nota de corte — quem
   marca tudo reprova, como tem de ser.

   Quando as corretas não cabem no slate, ele vira uma AMOSTRA das duas
   classes, e o gabarito é a interseção com o que foi mostrado. É amostra do
   conjunto derivado, não truncamento dele: continua sendo verdade sobre o
   grafo, só perguntada sobre menos itens. */
const MIN_ERRADAS = 2;

function montarSlate(g, sg, corretas, sorteio){
  const universo = [...sg.nos];
  const certas  = universo.filter(n=>corretas.includes(n));
  const erradas = universo.filter(n=>!corretas.includes(n));
  if(!certas.length || erradas.length < MIN_ERRADAS) return null;

  const n = Math.min(MAX_ALTERNATIVAS, universo.length);
  const quantasCertas = Math.min(certas.length, n - MIN_ERRADAS);
  const escolhidasCertas = embaralhar(certas, sorteio).slice(0, quantasCertas);
  const escolhidasErradas = embaralhar(erradas, sorteio).slice(0, n - escolhidasCertas.length);

  const ids = embaralhar(escolhidasCertas.concat(escolhidasErradas), sorteio);
  return {
    alternativas: ids.map(id=>({ id, texto: nomeDoNo(g, id) })),
    corretas: escolhidasCertas
  };
}

/* A revelação é o `porque` das próprias transições, com a ressalva de
   certeza junto. É o momento em que a pergunta ensina, e é por isso que ela
   nunca pode ser texto separado do conteúdo. */
function revelar(g, transicoes){
  return transicoes.map(t=>{
    const ex = G.explicar(g, t);
    return { de: nomeDoNo(g, t.de), para: nomeDoNo(g, t.para), tipo: t.tipo,
             verbo: G.VERBO[t.tipo] || t.tipo, porque: ex.resposta,
             condicao: ex.condicao, requer: ex.requer,
             certeza: ex.certeza, ressalva: ex.ressalva,
             chave: E.chaveDaTransicao(t) };
  });
}

/* ---------- construir e reconstruir ----------
   São a mesma travessia em sentidos opostos, e por isso são um gerador só.
   Para frente pergunta "o que isto causa"; para trás, "o que precisava ter
   acontecido". A resposta é um CONJUNTO de nós, porque um passo pode ter
   várias saídas — e é justamente aí que a pergunta deixa de ser decorável
   como fila. */
function gerarTravessia(g, mecanismoId, operacao, sorteio, idx){
  idx = idx || E.indexar(g);
  const sg = idx[mecanismoId];
  if(!sg) return null;
  const r = G.reconstruir(g, mecanismoId, operacao === 'construir' ? 'frente' : 'tras');
  if(!r || !r.passos.length) return null;

  const passo = escolher(r.passos, sorteio);
  const slate = montarSlate(g, sg, passo.resposta.map(x=>x.no), sorteio);
  if(!slate) return null;
  // só entram as transições cuja saída ficou no slate: a evidência tem de
  // corresponder ao que foi de fato perguntado
  const transicoes = passo.transicoes.filter(t=>
    slate.corretas.includes(operacao === 'construir' ? t.para : t.de));
  if(!transicoes.length) return null;
  return {
    operacao, mecanismo: mecanismoId,
    enunciado: passo.pergunta,
    tipoDeResposta: 'conjunto',
    alternativas: slate.alternativas,
    corretas: slate.corretas,
    transicoes,
    revelacao: revelar(g, transicoes)
  };
}

/* ---------- perturbar ----------
   O gabarito é o que SOME da alcançabilidade quando a entidade desaparece.
   Ninguém escreveu essa lista: ela é recalculada a cada pergunta, e muda
   sozinha quando o conteúdo muda. É a resposta direta ao banco finito de
   contrafactuais escritos à mão. */
function gerarPerturbar(g, mecanismoId, sorteio, idx){
  idx = idx || E.indexar(g);
  const sg = idx[mecanismoId];
  if(!sg) return null;

  /* As candidatas são exatamente as que `operacoesMensuraveisEm` aceita:
     perda real e sobreviventes suficientes. Se o gerador aceitasse mais que
     o cronograma, apareceria pergunta sem caixa para receber a evidência. */
  const candidatas = [...new Set(sg.transicoes.flatMap(t=>t.requer || []))].sort()
    .filter(ent=>{
      const perdidos = G.perturbar(g, { entidade: ent }, sg.mecanismo.entrada).perdidos
        .filter(n=>sg.nos.has(n));
      return perdidos.length > 0 && (sg.nos.size - perdidos.length) >= E.MIN_SOBREVIVENTES;
    });
  if(!candidatas.length) return null;

  const entidade = escolher(candidatas, sorteio);
  const r = G.perturbar(g, { entidade }, sg.mecanismo.entrada);
  const slate = montarSlate(g, sg, r.perdidos.filter(n=>sg.nos.has(n)), sorteio);
  if(!slate) return null;
  const alvo = g.entidades[entidade] || { nome: entidade };
  const mortas = r.mortas.filter(t=>sg.transicoes.includes(t));

  return {
    operacao: 'perturbar', mecanismo: mecanismoId, entidade,
    enunciado: `Se ${alvo.nome} deixar de existir, o que deixa de acontecer?`,
    tipoDeResposta: 'conjunto',
    alternativas: slate.alternativas,
    corretas: slate.corretas,
    transicoes: mortas,
    revelacao: revelar(g, mortas),
    seFalhar: alvo.se_falhar || null
  };
}

/* ---------- depurar ----------
   O sistema INVERTE uma transição e apresenta a cadeia como prosa. A
   afirmação invertida é a errada, e é por isso que `operacoesMensuraveisEm`
   exige que a inversa não exista de verdade no grafo: se existisse, a
   afirmação invertida seria verdadeira e a pergunta não teria gabarito. */
function gerarDepurar(g, mecanismoId, sorteio, idx){
  idx = idx || E.indexar(g);
  const sg = idx[mecanismoId];
  if(!sg) return null;

  const podem = sg.transicoes.filter(t=>
    E.operacoesMensuraveisEm(g, t, mecanismoId, idx).includes('depurar'));
  if(!podem.length) return null;

  const errada = escolher(podem, sorteio);
  const outras = embaralhar(sg.transicoes.filter(t=>t !== errada), sorteio).slice(0, 3);
  const frase = (de, verbo, para) => `${nomeDoNo(g, de)} ${verbo} ${nomeDoNo(g, para)}`;

  const itens = embaralhar(outras.map(t=>({
    id: E.chaveDaTransicao(t),
    texto: frase(t.de, G.VERBO[t.tipo] || t.tipo, t.para),
    certa: true, transicao: t
  })).concat([{
    id: E.chaveDaTransicao(errada),
    texto: frase(errada.para, G.VERBO[errada.tipo] || errada.tipo, errada.de),  // invertida
    certa: false, transicao: errada
  }]), sorteio);

  /* A revelação cobre TODAS as afirmações mostradas, não só a invertida.
     A evidência também vai para todas — julgar as quatro é o trabalho —, e
     o que foi avaliado tem de ser explicado. `chaveErrada` diz à tela qual
     destacar. */
  return {
    operacao: 'depurar', mecanismo: mecanismoId,
    enunciado: 'Uma destas afirmações está invertida. Qual?',
    tipoDeResposta: 'unica',
    alternativas: itens.map(i=>({ id: i.id, texto: i.texto })),
    corretas: [E.chaveDaTransicao(errada)],
    chaveErrada: E.chaveDaTransicao(errada),
    transicoes: itens.map(i=>i.transicao),
    revelacao: revelar(g, itens.map(i=>i.transicao)),
    correcao: frase(errada.de, G.VERBO[errada.tipo] || errada.tipo, errada.para)
  };
}

function gerar(g, mecanismoId, operacao, semente, idx){
  const sorteio = sorteador(semente);
  if(operacao === 'construir' || operacao === 'reconstruir')
    return gerarTravessia(g, mecanismoId, operacao, sorteio, idx);
  if(operacao === 'perturbar') return gerarPerturbar(g, mecanismoId, sorteio, idx);
  if(operacao === 'depurar')   return gerarDepurar(g, mecanismoId, sorteio, idx);
  throw new Error(`operação desconhecida: ${operacao}`);
}

/* ---------- correção ----------
   Conjunto usa Jaccard, e não "quantas acertou": marcar tudo tem de ser
   ruim. Quem seleciona as dez alternativas para garantir as três certas não
   demonstrou saber nada, e uma nota que premiasse isso corromperia o
   cronograma inteiro — as caixas subiriam sem retenção por trás. */
function corrigir(pergunta, escolhidas){
  const esc = [...new Set(escolhidas || [])];
  const cor = [...new Set(pergunta.corretas)];
  let nota;
  if(pergunta.tipoDeResposta === 'unica'){
    nota = (esc.length === 1 && cor.includes(esc[0])) ? 1 : 0;
  } else {
    const inter = esc.filter(x=>cor.includes(x)).length;
    const uniao = new Set(esc.concat(cor)).size;
    nota = uniao ? inter / uniao : 0;
  }
  return {
    nota,
    acertou: nota >= E.PASSA,
    faltaram: cor.filter(x=>!esc.includes(x)),
    sobraram: esc.filter(x=>!cor.includes(x)),
    /* A mesma nota vai para todas as transições que a pergunta exercitou:
       é isso que o lote consome, e é uma decisão de intervalo por caixa. */
    porTransicao: pergunta.transicoes.map(t=>({ transicao: t, nota }))
  };
}

/* Anota uma pergunta corrigida no lote do cronograma. */
function anotarNoLote(lote, pergunta, correcao){
  correcao.porTransicao.forEach(x=>E.anotar(lote, x.transicao, pergunta.operacao, x.nota));
  return correcao.porTransicao.length;
}

/* ---------- a sessão ----------
   O plano do cronograma diz QUE atividades estão vencidas; aqui elas viram
   perguntas, uma por atividade em cada volta — rodízio, não fila.

   O plano é pedido SEM TETO de propósito. O teto de `planoDeSessao` conta
   CAIXAS, e foi desenhado quando eu supunha que uma atividade liquidava o
   recorte inteiro de uma vez. Não liquida: uma pergunta cobre uma a três
   transições. Usar o teto de caixas aqui admitiria uma atividade só (a
   primeira já estoura 42 caixas) e a sessão inteira viraria a mesma
   operação no mesmo mecanismo, quatro vezes seguidas — sem intercalação,
   que é justamente o que faz revisão espaçada funcionar. Quem limita a
   sessão aqui é o número de PERGUNTAS.

   Atividade que não rende pergunta (o sorteio caiu num passo sem slate
   possível) é pulada em silêncio, e as caixas dela seguem vencidas. Nada é
   inventado para encher sessão. */
function montarSessao(g, estado, agora, opcoes){
  opcoes = opcoes || {};
  const idx = opcoes.idx || E.indexar(g);
  const max = opcoes.maxPerguntas || 10;
  const semente = (opcoes.semente || 1) >>> 0;
  const plano = E.planoDeSessao(g, estado, agora,
    opcoes.teto === undefined ? Infinity : opcoes.teto, idx);

  const perguntas = [];
  for(let volta = 0; volta < 4 && perguntas.length < max; volta++){
    const antes = perguntas.length;
    for(const a of plano.atividades){
      if(perguntas.length >= max) break;
      const p = gerar(g, a.mecanismo, a.operacao, semente + volta * 7919 + perguntas.length * 31, idx);
      if(p) perguntas.push(p);
    }
    if(perguntas.length === antes) break;   // nenhuma atividade rende: para
  }
  return { plano, perguntas };
}

module.exports = {
  MAX_ALTERNATIVAS, MIN_ERRADAS, sorteador, embaralhar, montarSlate, montarSessao,
  gerar, gerarTravessia, gerarPerturbar, gerarDepurar,
  corrigir, anotarNoLote, revelar
};

<script>
/* =====================================================================
   NeuroLab Profundo · a tela

   Esta camada é fina de propósito. Ela NÃO decide nada sobre estudo: não
   escolhe pergunta, não corrige, não calcula intervalo, não sabe o que é
   uma caixa de revisão. Tudo isso vem de `src/`, que roda igual no Node e
   é provado por cinco portões com mutantes.

   Se uma regra de estudo aparecer aqui dentro, ela é uma regra que nenhum
   portão vigia — e este projeto já provou, em quatro ocasiões, que regra
   sem portão é regra errada.
   ===================================================================== */
(function(){
'use strict';
var G = require('./grafo.js');
var E = require('./estudo.js');
var P = require('./percurso.js');
var Q = require('./perguntas.js');

var CHAVE_ESTADO = 'neurolab-profundo/estado/v1';
var app = document.getElementById('app');
var rodape = document.getElementById('rodape');
var acao = document.getElementById('acao');

var g = G.carregar();
var idx = E.indexar(g);
var estado = carregarEstado();
var sessao = null;

/* ---------- estado ---------- */
function carregarEstado(){
  var bruto = null;
  try { bruto = localStorage.getItem(CHAVE_ESTADO); } catch(e){ /* modo privado */ }
  var st = bruto ? JSON.parse(bruto) : E.novoEstado();
  /* Semear é idempotente: mecanismo novo abre caixa nova sem tocar no que
     já foi estudado. É o que faz conteúdo novo aparecer sem migração. */
  Object.keys(g.mecanismos).sort().forEach(function(id){ E.semear(g, st, id, Date.now(), idx); });
  return st;
}
function salvarEstado(){
  try { localStorage.setItem(CHAVE_ESTADO, JSON.stringify(estado)); } catch(e){ /* ignora */ }
}

/* ---------- utilidades de DOM ---------- */
function el(tag, attrs, filhos){
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function(k){
    if(k === 'texto') n.textContent = attrs[k];
    else if(k === 'html') n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  });
  (filhos || []).forEach(function(f){ if(f) n.appendChild(f); });
  return n;
}
function limpar(){ app.innerHTML = ''; }
function pct(f){ return Math.round(f * 100) + '%'; }
function nomeNo(id){ return (g.nos[id] && g.nos[id].descricao) || id; }
function botao(rotulo, aoClicar){
  rodape.classList.remove('oculto');
  acao.textContent = rotulo;
  acao.disabled = false;
  acao.onclick = aoClicar;
}
function semBotao(){ rodape.classList.add('oculto'); acao.onclick = null; }

/* ---------- tela do percurso ---------- */
function telaPercurso(){
  sessao = null;
  limpar();
  var p = P.percurso(g, estado, Date.now(), idx);

  app.appendChild(el('h1', { texto: 'NeuroLab Profundo' }));
  app.appendChild(el('p', { class: 'sub',
    texto: p.total + ' caixas de revisão · ' + g.transicoes.length + ' transições causais' }));

  /* a trilha, com os degraus coloridos por estado */
  var trilha = el('div', { class: 'trilha' });
  p.etapas.forEach(function(e, i){
    if(i) trilha.appendChild(document.createTextNode('──'));
    trilha.appendChild(el('span', {
      class: e.concluida ? 'feito' : (e.iniciada ? 'curso' : ''),
      texto: e.concluida ? '[✓]' : (e.iniciada ? '[◐]' : '[ ]')
    }));
  });
  app.appendChild(trilha);

  p.etapas.forEach(function(e){
    var cartao = el('div', { class: 'cartao' });
    cartao.appendChild(el('div', { class: 'linha' }, [
      el('h2', { texto: 'Etapa ' + e.numero }),
      el('span', {
        class: 'selo' + (e.concluida ? ' ok' : (e.iniciada ? ' curso' : '')),
        texto: e.concluida ? 'concluída' : (e.iniciada ? 'em curso' : 'não começada')
      })
    ]));
    cartao.appendChild(el('div', { class: 'rotulo',
      texto: e.total + ' caixas · ' + pct(e.peso) + ' do percurso' }));

    e.mecanismos.forEach(function(m){
      cartao.appendChild(el('div', { class: 'fenomeno', texto: m.fenomeno }));
      var barra = el('div', { class: 'barra' });

    });

  });

  /* Os dois números lado a lado: contar etapa não é contar progresso. */
  var porEtapa = p.etapas.length ? p.etapasConcluidas / p.etapas.length : 0;
  var porCaixa = p.total ? p.conquistadas / p.total : 0;
  var resumo = el('div', { class: 'cartao' });

  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Etapas concluídas' }),

  ]));
  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Caixas conquistadas' }),

  ]));
  resumo.appendChild(dois);
  if(Math.abs(porEtapa - porCaixa) > 0.1){
    resumo.appendChild(el('div', { class: 'discorda',
      texto: 'Os dois discordam em ' + pct(Math.abs(porEtapa - porCaixa)) +
             '. As etapas não têm o mesmo tamanho — o número da direita é o que vale.' }));
  }
  app.appendChild(resumo);

  app.appendChild(el('p', { class: 'aviso',
    texto: 'A conquista não desce: esquecer devolve a caixa à revisão e não reabre etapa fechada. ' +
           'As revisões vêm por fora, e continuam vindo mesmo com o percurso inteiro fechado — ' +
           'é assim que ele fica fechado.' }));

  if(p.revisoesHoje > 0) botao('Estudar (' + p.revisoesHoje + ' vencidas)', comecarSessao);
  else { rodape.classList.remove('oculto'); acao.textContent = 'Nada vencido hoje'; acao.disabled = true; acao.onclick = null; }
}

/* ---------- ler o mecanismo ----------
   A mesma cadeia que gera as perguntas, em ordem causal e por extenso. Serve
   para duas coisas: estudar antes de ser cobrado, e AUDITAR — por isso cada
   transição mostra o endereço no arquivo, para um erro de neurociência poder
   ser reportado por número em vez de por descrição.

   O deslizador de escala é uma projeção deste mesmo grafo. Não existe texto
   por camada: se existisse, a camada voltaria a ser dona do conteúdo. */
function telaExplorar(mecanismoId, escala){

  semBotao();
  var m = g.mecanismos[mecanismoId];
  var cadeia = G.projetar(g, mecanismoId, escala);
  var total = G.cadeiaOrdenada(g, mecanismoId).length;

  var voltar = el('button', { class: 'fantasma', type: 'button', texto: '‹ percurso' });
  voltar.onclick = telaPercurso;
  app.appendChild(voltar);

  app.appendChild(el('h1', { texto: mecanismoId }));
  app.appendChild(el('p', { class: 'sub', texto: m.fenomeno }));

  cabeca.appendChild(el('div', { class: 'rotulo', style: 'margin-top:10px', texto: 'termina em' }));
  cabeca.appendChild(el('div', { texto: nomeNo(m.terminal) }));

  cabeca.appendChild(el('div', { class: 'rotulo', style: 'margin-top:10px', texto: 'limites declarados' }));
  cabeca.appendChild(el('p', { class: 'fenomeno', texto: m.limites }));
  app.appendChild(cabeca);

  var faixas = [{ id: 'todas', rotulo: 'todas' }]
    .concat(G.escalasDe(g).map(function(e){ return { id: e, rotulo: e }; }))
    .concat([{ id: 'pontes', rotulo: 'pontes entre escalas' }]);

    b.onclick = (function(id){ return function(){ telaExplorar(mecanismoId, id); }; })(f.id);
    barra.appendChild(b);

    rel.appendChild(el('span', { class: 'verbo', texto: G.VERBO[t.tipo] || t.tipo }));
    rel.appendChild(document.createTextNode(' ' + nomeNo(t.para)));
    cartao.appendChild(rel);
    cartao.appendChild(el('div', { class: 'escalas',
      texto: (g.nos[t.de].escala || '?') + ' › ' + (g.nos[t.para].escala || '?') }));
    cartao.appendChild(el('p', { texto: ex.resposta }));
    var meta = [];
    if(ex.condicao) meta.push('condição: ' + ex.condicao);

    if(meta.length) cartao.appendChild(el('div', { class: 'meta', texto: meta.join('   ') }));
    if(ex.ressalva) cartao.appendChild(el('div', { class: 'ressalva', texto: ex.ressalva }));
    /* o endereço, para auditoria: dá para dizer "03[7] está errado" */
    cartao.appendChild(el('div', { class: 'endereco', texto: t._arquivo + '[' + t._i + ']' }));
    app.appendChild(cartao);
  });

  app.appendChild(el('p', { class: 'aviso',
    texto: 'Nenhum portão sabe se isto é verdade — eles verificam coerência. ' +
           'Se uma destas relações estiver errada, o endereço embaixo dela é o que identifica.' }));
}

/* ---------- sessão ---------- */
function comecarSessao(){
  var agora = Date.now();
  var montada = Q.montarSessao(g, estado, agora, { idx: idx, semente: (agora / 60000) | 0 });
  if(!montada.perguntas.length) return telaPercurso();
  sessao = {
    perguntas: montada.perguntas, i: 0, agora: agora,
    lote: E.iniciarLote(), resultados: [], caixas: 0
  };
  telaPergunta();
}

function telaPergunta(){
  limpar();
  var s = sessao, p = s.perguntas[s.i];
  var escolhidas = [];

  var prog = el('div', { class: 'progresso' });
  s.perguntas.forEach(function(_, i){
    var r = s.resultados[i];
    prog.appendChild(el('i', { class: i === s.i ? 'atual' : (r ? (r.acertou ? 'feita' : 'falha') : '') }));
  });
  app.appendChild(prog);

  app.appendChild(el('div', { class: 'linha' }, [
    el('span', { class: 'selo curso', texto: p.operacao }),
    el('span', { class: 'rotulo', texto: (s.i + 1) + ' de ' + s.perguntas.length })
  ]));
  app.appendChild(el('h2', { texto: p.enunciado }));
  app.appendChild(el('p', { class: 'sub',
    texto: p.tipoDeResposta === 'unica' ? 'Escolha uma.' : 'Pode haver mais de uma. Marcar tudo não passa.' }));

  var botoes = {};
  p.alternativas.forEach(function(a){
    var b = el('button', { class: 'alt' + (p.tipoDeResposta === 'unica' ? ' unica' : ''),
                           'aria-pressed': 'false', type: 'button' }, [
      el('span', { class: 'marca', texto: '✓' }),
      el('span', { texto: a.texto })
    ]);
    b.onclick = function(){
      if(p.tipoDeResposta === 'unica'){
        escolhidas = [a.id];
        Object.keys(botoes).forEach(function(k){ botoes[k].setAttribute('aria-pressed', String(k === a.id)); });
      } else {
        var j = escolhidas.indexOf(a.id);
        if(j >= 0) escolhidas.splice(j, 1); else escolhidas.push(a.id);
        b.setAttribute('aria-pressed', escolhidas.indexOf(a.id) >= 0 ? 'true' : 'false');
      }
      acao.disabled = escolhidas.length === 0;
    };
    botoes[a.id] = b;
    app.appendChild(b);
  });

  botao('Responder', function(){ responder(p, escolhidas, botoes); });
  acao.disabled = true;
}

function responder(p, escolhidas, botoes){
  var s = sessao;
  var c = Q.corrigir(p, escolhidas);
  s.caixas += Q.anotarNoLote(s.lote, p, c);
  s.resultados[s.i] = c;

  /* marca as alternativas: o que estava certo, o que faltou, o que sobrou */
  Object.keys(botoes).forEach(function(id){
    var b = botoes[id];
    b.onclick = null;
    b.disabled = true;
    var era = p.corretas.indexOf(id) >= 0;
    var marcou = escolhidas.indexOf(id) >= 0;
    if(era && marcou) b.className += ' certa';
    else if(era && !marcou) b.className += ' perdida';
    else if(!era && marcou) b.className += ' errada';
  });

  var caixa = el('div', { class: 'cartao' });
  caixa.appendChild(el('div', { class: 'linha' }, [
    el('h2', { texto: c.acertou ? 'Certo' : (c.nota > 0 ? 'Quase' : 'Errado') }),
    el('span', { class: 'selo' + (c.acertou ? ' ok' : ''), texto: 'nota ' + c.nota.toFixed(2) })
  ]));
  if(p.operacao === 'depurar' && p.correcao){
    caixa.appendChild(el('p', { class: 'sub', texto: 'O certo seria: ' + p.correcao }));
  }
  if(p.seFalhar){
    caixa.appendChild(el('p', { class: 'sub', texto: 'Se falhar: ' + p.seFalhar }));
  }

  /* A revelação é o `porque` da própria transição. É o momento em que a
     pergunta ensina, e por isso ela nunca é texto separado do conteúdo. */
  p.revelacao.forEach(function(r){
    var destaque = (p.chaveErrada && r.chave === p.chaveErrada) ? ' destaque' : '';
    var bloco = el('div', { class: 'rev' + destaque });
    var rel = el('div', { class: 'rel' });
    rel.appendChild(document.createTextNode(r.de + ' '));
    rel.appendChild(el('span', { class: 'verbo', texto: r.verbo }));
    rel.appendChild(document.createTextNode(' ' + r.para));
    bloco.appendChild(rel);
    bloco.appendChild(el('p', { texto: r.porque }));
    var meta = [];
    if(r.condicao) meta.push('condição: ' + r.condicao);
    if(r.requer && r.requer.length) meta.push('depende de: ' + r.requer.join(' · '));
    if(meta.length) bloco.appendChild(el('div', { class: 'meta', texto: meta.join('   ') }));
    if(r.ressalva) bloco.appendChild(el('div', { class: 'ressalva', texto: r.ressalva }));
    caixa.appendChild(bloco);
  });
  app.appendChild(caixa);
  window.scrollTo(0, document.body.scrollHeight);

  botao(s.i + 1 < s.perguntas.length ? 'Próxima' : 'Terminar', function(){
    s.i++;
    if(s.i < s.perguntas.length) telaPergunta();
    else fecharSessao();
  });
}

function fecharSessao(){
  var s = sessao;
  var r = E.fecharLote(g, estado, s.lote, s.agora);
  salvarEstado();

  limpar();
  semBotao();
  var acertos = s.resultados.filter(function(x){ return x.acertou; }).length;
  var subiram = r.decididas.filter(function(d){ return d.para > d.de; }).length;
  var cairam = r.decididas.filter(function(d){ return d.para < d.de; }).length;

  app.appendChild(el('h1', { texto: 'Sessão fechada' }));
  app.appendChild(el('p', { class: 'sub',
    texto: acertos + ' de ' + s.perguntas.length + ' perguntas · ' +
           r.decididas.length + ' caixas decididas' }));

  var cartao = el('div', { class: 'cartao' });
  var dois = el('div', { class: 'dois' });
  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Intervalos que subiram' }),
    el('div', { class: 'numero', texto: String(subiram) })
  ]));
  dois.appendChild(el('div', {}, [
    el('div', { class: 'rotulo', texto: 'Que voltaram atrás' }),
    el('div', { class: 'numero', texto: String(cairam) })
  ]));
  cartao.appendChild(dois);
  cartao.appendChild(el('p', { class: 'aviso',
    texto: 'Cada caixa tomou UMA decisão de intervalo, pela média das respostas que a ' +
           'exercitaram — não uma promoção por resposta. Acertar antes do vencimento ' +
           'não promove, e errar não zera a estrada andada.' }));
  app.appendChild(cartao);

  botao('Voltar ao percurso', telaPercurso);
}

telaPercurso();
})();

</script>
