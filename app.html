<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>NeuroLab Profundo</title>
<style>
:root{
  --fundo:#0e1116; --painel:#161b23; --painel2:#1d2430; --borda:#2a3442;
  --texto:#e6edf5; --fraco:#93a1b3; --tenue:#5d6b7e;
  --acento:#4da3ff; --certo:#3fbf7f; --errado:#e8615a; --aviso:#e0a23c;
  --raio:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--fundo); color:var(--texto);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{max-width:720px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:600}
.sub{color:var(--fraco);font-size:13px;margin:0 0 18px}

.cartao{background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);padding:14px;margin:0 0 12px}
.linha{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}

/* trilha do percurso */
.trilha{font:600 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;
        color:var(--tenue);overflow-x:auto;padding:10px 0;white-space:nowrap}
.trilha .feito{color:var(--certo)} .trilha .curso{color:var(--acento)}

.barra{height:8px;background:var(--painel2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.barra > i{display:block;height:100%;background:var(--certo);border-radius:99px;transition:width .35s}
.barra.tenue > i{background:var(--acento)}

.rotulo{font-size:12px;color:var(--fraco)}
.numero{font:600 15px/1 system-ui}
.selo{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      padding:3px 8px;border-radius:99px;background:var(--painel2);color:var(--fraco)}
.selo.ok{background:rgba(63,191,127,.15);color:var(--certo)}
.selo.curso{background:rgba(77,163,255,.15);color:var(--acento)}
.fenomeno{color:var(--fraco);font-size:13px;margin:2px 0 8px}
.dep{font-size:11px;color:var(--tenue);margin-top:6px}

/* dois números lado a lado */
.dois{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.dois > div{background:var(--painel2);border-radius:10px;padding:10px 12px}
.discorda{margin-top:10px;font-size:12px;color:var(--aviso);
          background:rgba(224,162,60,.1);border-radius:10px;padding:9px 11px}

/* botões */
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--borda);
       background:var(--painel2);color:var(--texto);padding:12px 16px}
button:disabled{opacity:.4;cursor:default}
.principal{background:var(--acento);border-color:var(--acento);color:#06121f;font-weight:600;width:100%;padding:15px}
.fantasma{background:transparent}

/* alternativas */
.alt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
     padding:13px 14px;margin:0 0 8px;background:var(--painel);border:1px solid var(--borda);border-radius:12px}
.alt .marca{flex:0 0 20px;height:20px;margin-top:1px;border:2px solid var(--tenue);
            border-radius:6px;display:grid;place-items:center;font-size:12px;color:transparent}
.alt.unica .marca{border-radius:99px}
.alt[aria-pressed="true"]{border-color:var(--acento);background:rgba(77,163,255,.09)}
.alt[aria-pressed="true"] .marca{border-color:var(--acento);background:var(--acento);color:#06121f}
.alt.certa{border-color:var(--certo);background:rgba(63,191,127,.1)}
.alt.errada{border-color:var(--errado);background:rgba(232,97,90,.1)}
.alt.perdida{border-color:var(--certo);border-style:dashed}

/* revelação */
.rev{border-left:3px solid var(--borda);padding:0 0 0 12px;margin:12px 0 0}
.rev + .rev{margin-top:14px}
.rev .rel{font-weight:600;font-size:14px;margin-bottom:4px}
.rev .verbo{color:var(--acento);font-weight:600}
.rev p{margin:6px 0 0;font-size:14px;color:var(--fraco)}
.rev .meta{font-size:12px;color:var(--tenue);margin-top:6px}
.ressalva{margin-top:8px;font-size:13px;color:var(--aviso);
          background:rgba(224,162,60,.1);border-radius:10px;padding:9px 11px}
.destaque{border-left-color:var(--errado)}

.progresso{display:flex;gap:4px;margin:0 0 14px}
.progresso i{flex:1;height:4px;background:var(--painel2);border-radius:99px}
.progresso i.feita{background:var(--certo)} .progresso i.falha{background:var(--errado)}
.progresso i.atual{background:var(--acento)}

.rodape{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--fundo) 26%);
        padding:22px 14px calc(14px + env(safe-area-inset-bottom))}
.rodape > div{max-width:720px;margin:0 auto}
.oculto{display:none}
.explorar{margin-top:12px;width:100%;padding:10px;font-size:14px}
.faixas{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.faixa{white-space:nowrap;padding:8px 13px;font-size:13px;border-radius:99px;background:var(--painel);color:var(--fraco)}
.faixa.viva{background:var(--acento);border-color:var(--acento);color:#06121f;font-weight:600}
.rel{font-weight:600;font-size:14px;margin-bottom:3px}
.verbo{color:var(--acento);font-weight:600}
.escalas{font-size:11px;color:var(--tenue);letter-spacing:.04em;margin-bottom:7px}
.meta{font-size:12px;color:var(--tenue);margin-top:7px}
.endereco{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tenue);margin-top:9px;opacity:.7}
.cartao > p{margin:6px 0 0;font-size:14px;color:var(--fraco)}
.aviso{font-size:12px;color:var(--tenue);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div class="rodape oculto" id="rodape"><div><button class="principal" id="acao"></button></div></div>
<script>

o","escala":"celular","descricao":"O interior fica eletricamente negativo em relação ao exterior"},{"id":"campo-eletrico-puxa-k-de-volta","entidade":"k","escala":"molecular","descricao":"O interior negativo atrai K⁺ de volta para dentro"},{"id":"equilibrio-eletroquimico","escala":"celular","descricao":"A saída por difusão e a entrada por atração elétrica se igualam: fluxo líquido zero"},{"id":"potencial-de-equilibrio-do-k","escala":"celular","descricao":"A voltagem em que as duas forças se anulam para o K⁺","quant":{"valor":"≈ −95 mV com estas concentrações","equacao":"E_K = 61,5 · log([K⁺]fora / [K⁺]dentro) = 61,5 · log(4/140)","por_que_os_livros_dizem_90":"o número muda com as concentrações assumidas: 5/140 mM dá ≈ −90 mV. A faixa −90 a −95 mV é a mesma conta com entradas diferentes, não duas teorias"}}],"transicoes":[{"de":"atp-disponivel","para":"k-concentrado-dentro","tipo":"causa","certeza":"consolidado","requer":["membrana","bomba-na-k"],"porque":"Transporte ativo: a ATPase usa a energia liberada pela quebra do ATP para empurrar íons CONTRA o gradiente — 3 Na⁺ para fora e 2 K⁺ para dentro a cada ciclo. É a única etapa desta cadeia que consome energia; todo o resto acontece de graça, a favor do que já está desequilibrado.","condicao":"membrana íntegra separando os dois meios"},{"de":"k-concentrado-dentro","para":"k-difunde-para-fora","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-k","membrana"],"porque":"Difusão: o movimento térmico de cada íon é aleatório e não tem direção preferida. Mas como há 35× mais K⁺ dentro, o número de íons que por acaso cruza para fora é maior que o número que cruza para dentro. O fluxo líquido não vem de nenhuma força puxando — vem só de haver mais partículas de um lado.","condicao":"canal de vazamento aberto — sem ele a diferença de concentração existe e não vai a lugar nenhum"},{"de":"k-difunde-para-fora","para":"carga-positiva-deixa-a-celula","tipo":"causa","certeza":"consolidado","porque":"O K⁺ é um cátion: mover o íon é mover a carga. Não existe transporte de matéria sem transporte de carga quando a partícula é carregada."},{"de":"carga-positiva-deixa-a-celula","para":"interior-mais-negativo","tipo":"causa","certeza":"consolidado","requer":["anions-internos","membrana"],"porque":"Os ânions intracelulares — proteínas e fosfatos — são grandes demais para atravessar a membrana. Quando o K⁺ sai, essas cargas negativas ficam para trás sem contraparte positiva. A negatividade não é criada: ela é o que sobra."},{"de":"interior-mais-negativo","para":"campo-eletrico-puxa-k-de-volta","tipo":"causa","certeza":"consolidado","porque":"Atração eletrostática: cargas opostas se atraem. O interior negativo passa a exercer força sobre o K⁺ positivo, no sentido oposto ao da difusão."},{"de":"k-difunde-para-fora","para":"equilibrio-eletroquimico","tipo":"compoe","certeza":"consolidado","porque":"A força química continua empurrando K⁺ para fora enquanto houver diferença de concentração."},{"de":"campo-eletrico-puxa-k-de-volta","para":"equilibrio-eletroquimico","tipo":"compoe","certeza":"consolidado","porque":"A força elétrica cresce à medida que mais K⁺ sai. Quando ela iguala a força química, cada íon que sai é compensado por um que entra: o fluxo líquido cessa, mas os dois fluxos continuam acontecendo. Equilíbrio não é imobilidade."},{"de":"equilibrio-eletroquimico","para":"potencial-de-equilibrio-do-k","tipo":"causa","certeza":"consolidado","porque":"Nernst quantifica em que voltagem as duas forças se anulam. O valor depende só da razão entre as concentrações — não de quantos íons existem, mas de quão desiguais estão.","quant":{"calculo":"61,5 · log(4/140) = 61,5 · (−1,544) ≈ −95 mV"}}],"mecanismos":[{"id":"gradiente-eletroquimico","fenomeno":"Por que existe uma diferença de carga elétrica entre o interior e o exterior da célula?","entrada":"atp-disponivel","terminal":"potencial-de-equilibrio-do-k","limites":"Descreve o equilíbrio para UM íon (K⁺) numa membrana permeável só a ele. A célula real é permeável a vários íons ao mesmo tempo, e por isso o potencial de repouso não fica no valor de equilíbrio do K⁺ — ver o mecanismo do potencial de membrana. Nernst também assume temperatura fixa e atividade iônica ideal."}]},"02-potencial-de-membrana.json":{"arquivo":"potencial de membrana em repouso","nota_de_autoria":"Este arquivo NÃO declara nenhuma aresta de ligação com o arquivo 01. Ele apenas usa os mesmos ids de nó (`atp-disponivel`, `potencial-de-equilibrio-do-k`). Se a travessia encontrar o caminho de ponta a ponta, a composição sem costura está provada.","entidades":[{"id":"canal-vazamento-na","nome":"Canal de vazamento de Na⁺","escala":"molecular","funcao":"poro sempre aberto para Na⁺, mas MUITO menos numeroso que os de K⁺","se_falhar":"a membrana ficaria permeável só a K⁺ e o repouso cairia praticamente em cima do equilíbrio do K⁺ (≈ −95 mV)"},{"id":"na","nome":"Íon sódio (Na⁺)","escala":"molecular","funcao":"cátion monovalente, concentrado do lado de FORA","se_falhar":"some a força que puxa o potencial para cima"}],"nos":[{"id":"na-concentrado-fora","entidade":"na","escala":"molecular","descricao":"Na⁺ muito mais concentrado fora do que dentro","quant":{"fora":"≈145 mM","dentro":"≈15 mM","razao":"≈10×"}},{"id":"na-difunde-para-dentro","entidade":"na","escala":"molecular","descricao":"Mais Na⁺ entra do que sai, pelos poucos canais de vazamento de Na⁺"},{"id":"carga-positiva-entra-na-celula","escala":"molecular","descricao":"Cada Na⁺ que entra traz uma carga positiva para dentro"},{"id":"mais-canais-de-k-que-de-na","escala":"molecular","descricao":"Há muito mais canais de vazamento de K⁺ abertos na membrana em repouso do que de Na⁺","quant":{"proporcao":"ordem de 25 a 40 canais de K⁺ para cada um de Na⁺, em número efetivo de poros abertos"}},{"id":"permeabilidade-desigual","escala":"celular","descricao":"A membrana em repouso é muito mais permeável a K⁺ do que a Na⁺","quant":{"razao_P_K_por_P_Na":"≈ 25 a 40 vezes"}},{"id":"bomba-e-eletrogenica","escala":"molecular","descricao":"A bomba tira 3 cargas positivas e devolve 2 — o saldo por ciclo é negativo","quant":{"contribuicao_direta":"≈ −3 mV"}},{"id":"potencial-de-repouso","escala":"celular","descricao":"A voltagem em que a célula se estabiliza quando nada a perturba","quant":{"valor":"≈ −70 mV","equacao":"Goldman: pondera cada íon pela permeabilidade da membrana a ele"}}],"transicoes":[{"de":"atp-disponivel","para":"na-concentrado-fora","tipo":"causa","certeza":"consolidado","requer":["membrana","bomba-na-k"],"porque":"Transporte ativo: a mesma ATPase que puxa K⁺ para dentro empurra Na⁺ para fora, no mesmo ciclo. Os dois gradientes são o mesmo investimento de energia.","condicao":"membrana íntegra separando os dois meios"},{"de":"na-concentrado-fora","para":"na-difunde-para-dentro","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-na","membrana"],"porque":"Difusão: há mais Na⁺ fora, então cruzam mais para dentro do que para fora. É o mesmo princípio do K⁺, no sentido oposto — porque o desequilíbrio é oposto."},{"de":"na-difunde-para-dentro","para":"carga-positiva-entra-na-celula","tipo":"causa","certeza":"consolidado","porque":"O Na⁺ é um cátion: mover o íon é mover a carga."},{"de":"potencial-de-equilibrio-do-k","para":"potencial-de-repouso","tipo":"compoe","certeza":"consolidado","porque":"O K⁺ é o íon a que a membrana é mais permeável, então é ele quem mais puxa o potencial. Por isso o repouso fica PERTO de E_K — mas não nele."},{"de":"carga-positiva-entra-na-celula","para":"potencial-de-repouso","tipo":"compoe","certeza":"consolidado","porque":"A entrada contínua de Na⁺ despeja carga positiva no interior e impede o potencial de chegar ao equilíbrio do K⁺ puro (≈ −95 mV). É esta a resposta para 'por que −70 e não o valor do potássio': existe um vazamento de sódio o tempo todo."},{"de":"mais-canais-de-k-que-de-na","para":"permeabilidade-desigual","tipo":"causa","certeza":"consolidado","requer":["canal-vazamento-k","canal-vazamento-na","membrana"],"porque":"Permeabilidade não é propriedade do íon, é do número de portas abertas para ele. A membrana não escolhe o K⁺: ela simplesmente tem muito mais poros por onde o K⁺ passa. Troque a densidade de canais e a permeabilidade muda junto, sem que nada no íon mude."},{"de":"permeabilidade-desigual","para":"potencial-de-repouso","tipo":"modula","certeza":"consolidado","porque":"Goldman: o potencial final é uma média dos potenciais de equilíbrio de cada íon, PONDERADA pela permeabilidade a cada um. Como P_K é 25 a 40× maior que P_Na, o resultado fica muito mais perto de E_K que de E_Na.","quant":{"E_K":"≈ −95 mV","E_Na":"≈ +60 mV","resultado":"≈ −70 mV"}},{"de":"bomba-e-eletrogenica","para":"potencial-de-repouso","tipo":"modula","certeza":"consolidado","porque":"Além de manter os gradientes, a bomba retira uma carga positiva líquida por ciclo. É uma contribuição pequena e direta, somada por cima do efeito dos gradientes.","quant":{"peso":"≈ −3 mV de ≈ −70 mV"}},{"de":"atp-disponivel","para":"bomba-e-eletrogenica","tipo":"causa","certeza":"consolidado","requer":["bomba-na-k"],"porque":"A assimetria 3:2 é uma propriedade do ciclo da bomba; ela só acontece enquanto há ATP para o ciclo rodar."}],"mecanismos":[{"id":"potencial-de-membrana","fenomeno":"Por que a célula em repouso fica em ≈ −70 mV, e não no equilíbrio do potássio (≈ −95 mV)?","entrada":"atp-disponivel","terminal":"potencial-de-repouso","limites":"Trata a permeabilidade como fixa. Ela não é: canais que abrem e fecham mudam esses pesos em milissegundos, e é exatamente disso que trata o potencial de ação. Os valores numéricos são de neurônio de mamífero a 37 °C e variam entre tipos celulares."}]},"03-potencial-de-acao.json":{"arquivo":"potencial de ação","nota_de_autoria":"Este arquivo também NÃO declara aresta nenhuma com 01 ou 02. Ele começa usando o id `potencial-de-repouso`, que o arquivo 02 produz, e a travessia costura sozinha. O mecanismo vai de canal iônico até código neural: termina em POR QUE a intensidade tem de ser representada na frequência, e não na amplitude. Nenhuma transição aqui é `inibe`, `bloqueia` ou `remove` — o que o fechamento de um canal produz está escrito como o ESTADO que resulta dele (`corrente-de-na-cessa`), porque o motor ainda trata toda aresta como propagação e uma aresta negativa faria a perturbação calcular ao contrário.","entidades":[{"id":"canal-na-voltagem","nome":"Canal de Na⁺ dependente de voltagem","escala":"molecular","funcao":"poro com DUAS comportas em série e independentes: a de ativação abre rápido com a despolarização, a de inativação fecha devagar com a mesma despolarização","se_falhar":"não há disparo nenhum; a membrana responde ao estímulo de forma passiva e o sinal se apaga em poucos milímetros (é o que a tetrodotoxina faz)"},{"id":"canal-k-voltagem","nome":"Canal de K⁺ dependente de voltagem","escala":"molecular","funcao":"retificador tardio: abre com a despolarização, mas com cinética lenta, e não se inativa nesta escala de tempo","se_falhar":"a repolarização passa a depender só do vazamento; o disparo alarga muito e o teto de frequência desaba (é o que a tetraetilamônio faz)"}],"nos":[{"id":"canais-de-na-disponiveis","entidade":"canal-na-voltagem","escala":"molecular","descricao":"Os canais de Na⁺ estão fechados mas PRONTOS: a comporta de inativação está aberta"},{"id":"estimulo-despolarizante","escala":"celular","descricao":"Uma corrente de entrada empurra o potencial para cima do repouso"},{"id":"limiar-atingido","escala":"celular","descricao":"O potencial cruza o limiar","quant":{"limiar":"≈ −55 mV","ressalva":"varia com o tipo celular e com a densidade local de canais"}},{"id":"comporta-de-ativacao-abre","entidade":"canal-na-voltagem","escala":"molecular","descricao":"As comportas de ativação giram e destravam o poro de Na⁺","quant":{"tempo":"menos de 0,5 ms"}},{"id":"na-entra-rapido","entidade":"na","escala":"molecular","descricao":"Na⁺ entra em grande quantidade pelos canais abertos"},{"id":"despolarizacao-cresce","escala":"celular","descricao":"O interior perde a negatividade e passa a positivo"},{"id":"amplitude-independente-do-estimulo","escala":"celular","descricao":"O disparo tem sempre a mesma altura, qualquer que tenha sido o estímulo que o iniciou"},{"id":"pico-do-potencial","escala":"celular","descricao":"A subida para perto do pico","quant":{"pico":"≈ +30 a +40 mV","E_Na":"≈ +60 mV","por_que_nao_chega":"a inativação começa antes de o equilíbrio ser alcançado"}},{"id":"comporta-de-inativacao-fecha","entidade":"canal-na-voltagem","escala":"molecular","descricao":"A comporta de inativação se fecha, com atraso, sobre o poro ainda ativado"},{"id":"corrente-de-na-cessa","entidade":"na","escala":"molecular","descricao":"A entrada de Na⁺ para, mesmo com a membrana ainda despolarizada"},{"id":"canais-de-k-abrem","entidade":"canal-k-voltagem","escala":"molecular","descricao":"Os canais de K⁺ dependentes de voltagem terminam de abrir","quant":{"atraso":"≈ 1 ms depois do início da despolarização"}},{"id":"k-sai-rapido","entidade":"k","escala":"molecular","descricao":"K⁺ sai em grande quantidade pelos canais dependentes de voltagem"},{"id":"repolarizacao","escala":"celular","descricao":"O interior volta a ficar negativo"},{"id":"hiperpolarizacao-tardia","escala":"celular","descricao":"O potencial passa do repouso e desce mais que ele","quant":{"vale":"≈ −80 mV","repouso":"≈ −70 mV","E_K":"≈ −95 mV"}},{"id":"fim-da-inativacao","entidade":"canal-na-voltagem","escala":"molecular","descricao":"As comportas de inativação reabrem e os canais voltam a ficar disponíveis"},{"id":"periodo-refratario","escala":"celular","descricao":"A célula não dispara de novo, por maior que seja o estímulo","quant":{"refratario_absoluto":"≈ 1 ms"}},{"id":"codigo-de-frequencia-com-teto","escala":"celular","descricao":"A intensidade só pode ser representada na frequência dos disparos, e essa frequência tem teto","quant":{"teto":"≈ 500 a 1000 disparos por segundo"}}],"transicoes":[{"de":"potencial-de-repouso","para":"canais-de-na-disponiveis","tipo":"permite","certeza":"consolidado","requer":["canal-na-voltagem","membrana"],"porque":"A comporta de inativação do canal de Na⁺ só permanece aberta enquanto a membrana está polarizada. É o repouso que mantém o canal disponível: numa célula que já esteja parcialmente despolarizada, boa parte dos canais está travada antes de qualquer estímulo chegar."},{"de":"estimulo-despolarizante","para":"limiar-atingido","tipo":"causa","certeza":"consolidado","porque":"Toda corrente de entrada desloca o potencial para cima. O limiar não é um número mágico gravado na célula: é a voltagem em que a corrente de Na⁺ que entra passa a superar a de K⁺ que sai, e o balanço deixa de puxar de volta para o repouso.","quant":{"limiar":"≈ −55 mV"}},{"de":"limiar-atingido","para":"comporta-de-ativacao-abre","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"O sensor de voltagem do canal é um segmento com resíduos carregados positivamente, segurados pelo campo elétrico da membrana polarizada. Quando o interior fica menos negativo, a força que os segurava afrouxa e o segmento se desloca, destravando o poro."},{"de":"canais-de-na-disponiveis","para":"comporta-de-ativacao-abre","tipo":"permite","certeza":"consolidado","porque":"O poro tem duas portas em série, e a corrente só passa com as duas abertas. Abrir a de ativação não serve de nada se a de inativação já estiver fechada, e é por isso que a disponibilidade prévia é condição do disparo, não consequência dele."},{"de":"comporta-de-ativacao-abre","para":"na-entra-rapido","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem","na","membrana"],"porque":"Com o poro aberto, as duas forças sobre o Na⁺ apontam para o mesmo lado: ele está dez vezes mais concentrado fora, e o interior está negativo, o que atrai um cátion. Somadas, produzem a maior corrente iônica que a célula gera.","quant":{"fora":"≈145 mM","dentro":"≈15 mM"}},{"de":"na-entra-rapido","para":"despolarizacao-cresce","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"Cada Na⁺ que entra traz uma carga positiva para o interior. Como a capacitância da membrana é pequena, um número de íons irrisório perto do total dissolvido já basta para mover a voltagem dezenas de milivolts."},{"de":"despolarizacao-cresce","para":"comporta-de-ativacao-abre","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"É a mesma sensibilidade à voltagem da abertura inicial, agora alimentada pela corrente que ela própria produziu. Aqui o laço se fecha sobre si mesmo, e é exatamente esse fechamento que separa um disparo de uma resposta passiva."},{"de":"despolarizacao-cresce","para":"amplitude-independente-do-estimulo","tipo":"causa","certeza":"consolidado","porque":"Depois que o laço se fecha, quem alimenta a subida é a corrente de Na⁺, não o estímulo. Um estímulo que mal cruza o limiar produz o mesmo disparo de um estímulo dez vezes maior, porque a partir daí o estímulo já não participa."},{"de":"despolarizacao-cresce","para":"pico-do-potencial","tipo":"causa","certeza":"consolidado","porque":"A subida para quando o interior fica positivo o bastante para que a força elétrica empurrando o Na⁺ para fora anule a química que o empurra para dentro. O teto é o potencial de equilíbrio do Na⁺, e ele nunca é alcançado por inteiro porque a inativação começa antes."},{"de":"despolarizacao-cresce","para":"comporta-de-inativacao-fecha","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"condicao":"alguns décimos de milissegundo depois da abertura","porque":"A mesma despolarização que abre a comporta de ativação também fecha a de inativação, só que devagar. É a diferença de velocidade entre as duas comportas, e não um sinal vindo de fora, que fixa a duração do disparo."},{"de":"comporta-de-inativacao-fecha","para":"corrente-de-na-cessa","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Com a porta de inativação fechada o poro deixa de conduzir, mesmo com a de ativação ainda aberta e a membrana ainda despolarizada. É um fechamento por tempo decorrido, e não por a voltagem ter voltado."},{"de":"despolarizacao-cresce","para":"canais-de-k-abrem","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem"],"condicao":"com atraso de cerca de um milissegundo","porque":"O canal de K⁺ dependente de voltagem responde à mesma despolarização, mas com cinética lenta. O atraso é o que faz o K⁺ chegar quando o Na⁺ já está saindo de cena, em vez de cancelá-lo desde o início e impedir o disparo."},{"de":"canais-de-k-abrem","para":"k-sai-rapido","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem","k","membrana"],"porque":"Com a membrana despolarizada, as duas forças sobre o K⁺ apontam para fora: ele continua mais concentrado dentro, e agora o interior positivo também o repele. A saída fica mais forte do que jamais é no repouso."},{"de":"pico-do-potencial","para":"k-sai-rapido","tipo":"modula","certeza":"consolidado","porque":"Quanto mais positivo o interior chegou, maior a distância até o equilíbrio do K⁺ e mais forte a força que empurra esse íon para fora. A altura do pico regula a velocidade da descida, e não só o tamanho do disparo."},{"de":"k-sai-rapido","para":"repolarizacao","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"Cada K⁺ que sai leva uma carga positiva embora do interior. É a mesma aritmética de carga da subida, com o sinal trocado, porque agora o cátion atravessa no sentido contrário."},{"de":"corrente-de-na-cessa","para":"repolarizacao","tipo":"permite","certeza":"consolidado","porque":"Enquanto o Na⁺ entrava, a saída de K⁺ apenas competia com ele. A descida só acontece porque a corrente de entrada já parou: com as duas ativas ao mesmo tempo elas se anulariam e a membrana ficaria travada no alto."},{"de":"repolarizacao","para":"hiperpolarizacao-tardia","tipo":"causa","certeza":"consolidado","requer":["canal-k-voltagem"],"porque":"Os canais de K⁺ fecham devagar e continuam abertos depois que a voltagem já voltou. Com a condutância ao K⁺ maior do que no repouso, a membrana é puxada para mais perto do equilíbrio do próprio K⁺ do que costuma ficar."},{"de":"repolarizacao","para":"fim-da-inativacao","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"A comporta de inativação não reabre por tempo decorrido: ela reabre quando a membrana volta a polarizar. É a repolarização, e não o relógio, que devolve o canal ao estado disponível."},{"de":"hiperpolarizacao-tardia","para":"fim-da-inativacao","tipo":"modula","certeza":"consolidado","porque":"Com a membrana mais negativa do que no repouso, o campo que reposiciona as comportas de inativação fica mais forte e elas reabrem mais depressa. O undershoot não é sobra do mecanismo: é o que devolve a célula à prontidão antes do prazo normal."},{"de":"comporta-de-inativacao-fecha","para":"periodo-refratario","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Com a comporta de inativação fechada, o canal fica num terceiro estado: nem aberto, nem pronto. Enquanto ela não reabrir, nenhum estímulo produz disparo, porque o que falta à célula não é força de estímulo, é canal disponível."},{"de":"fim-da-inativacao","para":"periodo-refratario","tipo":"modula","certeza":"consolidado","porque":"Quem fixa a duração do refratário não é o disparo que passou, é a velocidade com que as comportas de inativação reabrem depois de a membrana repolarizar. Membrana mais negativa encurta esse tempo; despolarização sustentada o prolonga indefinidamente."},{"de":"amplitude-independente-do-estimulo","para":"codigo-de-frequencia-com-teto","tipo":"compoe","certeza":"consolidado","porque":"Se a altura do disparo não varia com a intensidade, a intensidade não cabe na amplitude e precisa de outro parâmetro. O único que sobra livre é quantos disparos acontecem por segundo, e é por isso que o axônio codifica em frequência."},{"de":"periodo-refratario","para":"codigo-de-frequencia-com-teto","tipo":"compoe","certeza":"consolidado","porque":"O tempo em que a célula fica indisponível é um piso para o intervalo entre dois disparos, e o inverso desse piso é o número máximo de disparos por segundo. O refratário deixa de ser detalhe de cinética e vira o limite de quanta informação o axônio consegue carregar."}],"mecanismos":[{"id":"potencial-de-acao","fenomeno":"Por que o disparo tem sempre a mesma altura, e o que isso obriga o neurônio a fazer para representar intensidade?","entrada":"potencial-de-repouso","terminal":"codigo-de-frequencia-com-teto","limites":"Descreve o disparo de axônio de mamífero, com canal de Na⁺ dependente de voltagem e retificador tardio de K⁺. Não cobre disparo dependente de Ca²⁺ (dendrito, célula cardíaca, célula ciliada), nem canais de K⁺ do tipo A, nem adaptação de frequência por correntes lentas. O teto de frequência aqui é o imposto pela inativação do Na⁺; em muitos neurônios reais o teto efetivo é bem menor e vem de outras correntes."}]},"04-conducao-saltatoria.json":{"arquivo":"condução saltatória","nota_de_autoria":"Também sem aresta declarada para arquivo nenhum: começa usando o id `despolarizacao-cresce`, que o arquivo 03 produz. A pergunta central é uma correção de intuição — quase todo mundo imagina que a mielina faz o sinal CORRER mais rápido. Não faz: a corrente pelo axoplasma já é praticamente instantânea com ou sem mielina. O que custa tempo é REGENERAR o disparo, e a mielina reduz o número de regenerações necessárias. O terminal do mecanismo é exatamente isso.","entidades":[{"id":"mielina","nome":"Bainha de mielina","escala":"celular","funcao":"dezenas de camadas de membrana glial enroladas em volta do axônio, cobrindo tudo menos as lacunas","se_falhar":"a corrente volta a vazar por todo o comprimento e o alcance passivo despenca; se o próximo nodo ficar fora de alcance, a condução não fica lenta, ela BLOQUEIA (é o que acontece na esclerose múltipla)"},{"id":"axoplasma","nome":"Axoplasma","escala":"celular","funcao":"o citoplasma do axônio, caminho condutor por dentro da fibra","se_falhar":"não há por onde a corrente local caminhar adiante, e cada ponto do axônio ficaria eletricamente isolado do vizinho"},{"id":"nodo-de-ranvier","nome":"Nodo de Ranvier","escala":"celular","funcao":"lacuna descoberta entre duas bainhas, onde a membrana fica exposta e os canais dependentes de voltagem se concentram","se_falhar":"sem membrana exposta não há onde regenerar, e o sinal atravessa passivamente até morrer"}],"nos":[{"id":"corrente-local-pelo-axoplasma","entidade":"axoplasma","escala":"celular","descricao":"A carga que entrou se redistribui pelo interior do axônio, adiante do ponto de entrada"},{"id":"vazamento-pela-membrana","entidade":"membrana","escala":"celular","descricao":"Parte da corrente que caminha por dentro escapa pela membrana antes de chegar adiante"},{"id":"decaimento-exponencial-com-a-distancia","escala":"celular","descricao":"A despolarização passiva fica menor quanto mais longe do ponto de origem","quant":{"lambda_sem_mielina":"≈ 0,1 a 1 mm","forma":"queda exponencial, não linear"}},{"id":"precisa-regenerar","escala":"celular","descricao":"O sinal tem de ser refeito com amplitude cheia em pontos sucessivos, ou não chega ao fim"},{"id":"regeneracao-custa-tempo","escala":"celular","descricao":"Cada regeneração consome tempo: abrir comportas e carregar a membrana até o limiar","quant":{"por_regeneracao":"algumas décimas de milissegundo"}},{"id":"mielina-envolve-o-axonio","entidade":"mielina","escala":"celular","descricao":"Camadas de membrana glial cobrem o axônio, deixando lacunas descobertas a intervalos regulares","quant":{"camadas":"dezenas a mais de cem","intervalo_entre_nodos":"≈ 1 a 2 mm"}},{"id":"resistencia-da-membrana-sobe","escala":"celular","descricao":"No trecho coberto, o caminho de fuga da corrente fica muito mais resistivo"},{"id":"capacitancia-da-membrana-cai","escala":"celular","descricao":"No trecho coberto, a membrana armazena muito menos carga por volt"},{"id":"constante-de-comprimento-aumenta","escala":"celular","descricao":"A distância em que a despolarização passiva ainda é aproveitável fica muito maior","quant":{"lambda_com_mielina":"vários milímetros","regra":"cresce com a raiz da razão entre resistência de membrana e resistência interna"}},{"id":"menos-carga-para-mudar-a-voltagem","escala":"celular","descricao":"O trecho coberto muda de voltagem quase sem atraso, porque exige pouca carga"},{"id":"diametro-do-axonio-maior","entidade":"axoplasma","escala":"celular","descricao":"O axônio é grosso","quant":{"axonio_gigante_da_lula":"≈ 0,5 a 1 mm de diâmetro"}},{"id":"resistencia-interna-cai","entidade":"axoplasma","escala":"celular","descricao":"A corrente encontra menos resistência para seguir adiante por dentro"},{"id":"canais-de-na-so-nos-nodos","entidade":"canal-na-voltagem","escala":"molecular","descricao":"Os canais de Na⁺ dependentes de voltagem ficam concentrados nas lacunas descobertas","quant":{"densidade_no_nodo":"ordens de grandeza acima da do trecho coberto"}},{"id":"regeneracao-so-nos-nodos","escala":"celular","descricao":"O disparo só é refeito nos nodos; o trecho coberto é atravessado passivamente"},{"id":"velocidade-vem-de-pular-regeneracoes","escala":"celular","descricao":"A velocidade não vem de o sinal correr mais rápido, e sim de ele parar menos vezes no caminho","quant":{"sem_mielina":"≈ 0,5 a 2 m/s","com_mielina":"até ≈ 120 m/s"}}],"transicoes":[{"de":"despolarizacao-cresce","para":"corrente-local-pelo-axoplasma","tipo":"causa","certeza":"consolidado","requer":["axoplasma"],"porque":"A carga que entrou não fica onde entrou. O interior do axônio conduz, e o excesso de carga positiva repele as cargas positivas vizinhas, redistribuindo-se adiante quase à velocidade da eletricidade. Nenhum canal participa desse passo: é condução elétrica, não transporte de íon ponto a ponto."},{"de":"corrente-local-pelo-axoplasma","para":"vazamento-pela-membrana","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"A membrana não é isolante perfeito: tem canais de vazamento abertos o tempo todo. Parte da corrente que caminha por dentro encontra esse caminho de saída e escapa em vez de seguir adiante."},{"de":"vazamento-pela-membrana","para":"decaimento-exponencial-com-a-distancia","tipo":"causa","certeza":"consolidado","porque":"Cada trecho de membrana subtrai uma fração constante da corrente que ainda segue. Fração constante por unidade de comprimento é justamente o que produz queda exponencial, e não linear: dobrar a distância não corta a voltagem pela metade, corta muito mais."},{"de":"constante-de-comprimento-aumenta","para":"decaimento-exponencial-com-a-distancia","tipo":"modula","certeza":"consolidado","porque":"O decaimento não desaparece com a mielina: ele passa a acontecer numa escala de distância muito maior. O sinal continua morrendo sozinho, só que agora morre depois de milímetros em vez de depois de décimos de milímetro."},{"de":"decaimento-exponencial-com-a-distancia","para":"precisa-regenerar","tipo":"causa","certeza":"consolidado","porque":"Um sinal que decai não atravessa um axônio de um metro. A única saída é refazê-lo: usar a despolarização que ainda sobrou para cruzar o limiar adiante e produzir um disparo novo, de amplitude cheia, que recomeça a contagem."},{"de":"precisa-regenerar","para":"regeneracao-custa-tempo","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem"],"porque":"Regenerar não é instantâneo: as comportas de ativação levam décimos de milissegundo para abrir, e a corrente ainda precisa carregar a capacitância local até o limiar. É este passo, e não a corrida da corrente pelo axoplasma, que consome o tempo da condução."},{"de":"regeneracao-custa-tempo","para":"velocidade-vem-de-pular-regeneracoes","tipo":"compoe","certeza":"consolidado","porque":"O custo de uma regeneração é praticamente o mesmo com mielina ou sem ela: são os mesmos canais, com a mesma cinética. É por isso que ele entra na conta da velocidade como um preço fixo por parada, e não como algo que a mielina acelere."},{"de":"mielina-envolve-o-axonio","para":"resistencia-da-membrana-sobe","tipo":"causa","certeza":"consolidado","requer":["mielina"],"porque":"A bainha são dezenas de camadas de membrana empilhadas em série, e resistências em série somam. O caminho de fuga da corrente fica tão resistivo no trecho coberto que praticamente nada vaza por ali."},{"de":"mielina-envolve-o-axonio","para":"capacitancia-da-membrana-cai","tipo":"causa","certeza":"consolidado","requer":["mielina"],"porque":"Capacitância cai quando a distância entre as placas aumenta, e a bainha afasta o meio externo do axoplasma por muitas camadas. Menos capacitância significa menos carga necessária para mover a voltagem daquele trecho."},{"de":"mielina-envolve-o-axonio","para":"canais-de-na-so-nos-nodos","tipo":"causa","certeza":"consolidado","requer":["mielina","nodo-de-ranvier","canal-na-voltagem"],"porque":"O contato da célula glial com o axônio organiza a membrana embaixo dela e empurra os canais dependentes de voltagem para as lacunas descobertas. A concentração nos nodos depende desse contato: sem bainha, os canais ficam espalhados por todo o comprimento."},{"de":"resistencia-da-membrana-sobe","para":"constante-de-comprimento-aumenta","tipo":"causa","certeza":"consolidado","porque":"A constante de comprimento cresce com a raiz da razão entre a resistência da membrana e a do interior. Com menos fuga por unidade de comprimento, a mesma corrente chega muito mais longe antes de a voltagem cair ao ponto de não servir."},{"de":"diametro-do-axonio-maior","para":"resistencia-interna-cai","tipo":"causa","certeza":"consolidado","requer":["axoplasma"],"porque":"Resistência de um condutor cai quando a área da seção aumenta, porque há mais caminhos em paralelo para a corrente. Dobrar o diâmetro quadruplica a área e derruba a resistência interna para um quarto."},{"de":"resistencia-interna-cai","para":"constante-de-comprimento-aumenta","tipo":"causa","certeza":"consolidado","porque":"O alcance passivo melhora tanto dificultando a fuga quanto facilitando o avanço por dentro. Esta é a segunda rota, e é a que os invertebrados usam: o axônio gigante da lula não tem mielina nenhuma e compensa com quase um milímetro de diâmetro."},{"de":"capacitancia-da-membrana-cai","para":"menos-carga-para-mudar-a-voltagem","tipo":"causa","certeza":"consolidado","porque":"Voltagem é carga dividida por capacitância. Com a capacitância menor, a mesma corrente que chega do nodo anterior levanta a voltagem daquele trecho muito mais depressa, quase sem gastar carga no caminho."},{"de":"canais-de-na-so-nos-nodos","para":"regeneracao-so-nos-nodos","tipo":"causa","certeza":"consolidado","requer":["canal-na-voltagem","nodo-de-ranvier"],"porque":"Regenerar exige canal de Na⁺ dependente de voltagem, e onde não há canal não existe disparo possível. O trecho coberto só pode conduzir de forma passiva, e o disparo volta a existir apenas no nodo seguinte."},{"de":"menos-carga-para-mudar-a-voltagem","para":"regeneracao-so-nos-nodos","tipo":"permite","certeza":"consolidado","porque":"Pular um trecho só funciona se o que chega ao nodo seguinte ainda cruzar o limiar. A capacitância baixa é o que garante isso: quase nenhuma carga se perde enchendo a membrana do trecho coberto pelo caminho."},{"de":"constante-de-comprimento-aumenta","para":"regeneracao-so-nos-nodos","tipo":"permite","certeza":"consolidado","porque":"O nodo seguinte precisa estar dentro da distância em que a despolarização ainda é grande o bastante para disparar. É o alcance passivo aumentado que põe o próximo nodo dentro desse raio, e é por isso que perder a bainha pode bloquear a condução em vez de apenas atrasá-la."},{"de":"regeneracao-so-nos-nodos","para":"velocidade-vem-de-pular-regeneracoes","tipo":"causa","certeza":"consolidado","porque":"Atravessar uma distância exige um número de paradas igual a essa distância dividida pelo espaçamento entre nodos. Aumentar o espaçamento reduz o número de paradas na mesma proporção, e é aí que a velocidade sobe: o sinal não corre mais rápido, ele para menos vezes."}],"mecanismos":[{"id":"conducao-saltatoria","fenomeno":"Se a corrente elétrica já atravessa o axônio quase instantaneamente, por que a mielina torna a condução mais rápida?","entrada":"despolarizacao-cresce","terminal":"velocidade-vem-de-pular-regeneracoes","limites":"Descreve condução em axônio mielinizado de vertebrado, tratando a bainha como isolante passivo. Não cobre o papel metabólico da glia no sustento do axônio, nem a remodelação de mielina dependente de atividade, nem os canais de K⁺ justaparanodais. Trata o nodo como ponto; em fibras finas o comprimento do nodo importa. Os números de velocidade são de fibras motoras grandes de mamífero."}]},"05-transmissao-sinaptica.json":{"arquivo":"transmissão sináptica","nota_de_autoria":"Sem aresta declarada para arquivo nenhum: começa em `despolarizacao-cresce` (do 03) e usa `codigo-de-frequencia-com-teto` (terminal do 03) como modulador da plasticidade de curto prazo — porque o que chega ao terminal é literalmente uma taxa de disparos, e é a taxa que decide se domina facilitação ou depressão. A pergunta central não é como a sinapse funciona: é POR QUE o cérebro converte elétrico em químico e de volta, se a conversão custa meio milissegundo. Este é o primeiro arquivo com `certeza: debatido` — o sensor do Ca²⁺ residual está genuinamente em disputa, e o formato exige que isso chegue ao estudo com ressalva.","entidades":[{"id":"canal-ca-voltagem","nome":"Canal de Ca²⁺ dependente de voltagem","escala":"molecular","funcao":"abre com a despolarização no terminal pré-sináptico e fica agrupado a poucos nanômetros das vesículas prontas","se_falhar":"o disparo chega ao terminal e não acontece nada: a conversão de elétrico para químico não começa"},{"id":"ca","nome":"Íon cálcio (Ca²⁺)","escala":"molecular","funcao":"cátion divalente mantido ridiculamente baixo dentro da célula, o que o torna um sinal e não um solvente","se_falhar":"sem o mensageiro nenhuma vesícula funde, por mais disparos que cheguem"},{"id":"vesicula","nome":"Vesícula sináptica","escala":"molecular","funcao":"bolsa com uma quantidade aproximadamente fixa de transmissor, já encostada na membrana e esperando","se_falhar":"não há o que liberar; o terminal despolariza e a fenda continua vazia"},{"id":"proteinas-snare","nome":"Complexo SNARE e sinaptotagmina","escala":"molecular","funcao":"maquinaria que mantém a vesícula engatilhada e funde as membranas quando o sensor liga Ca²⁺","se_falhar":"a vesícula fica encostada e nunca funde — é o que as toxinas botulínica e tetânica fazem, cortando essas proteínas"},{"id":"neurotransmissor","nome":"Neurotransmissor","escala":"molecular","funcao":"molécula que atravessa a fenda por difusão e é lida por um receptor do outro lado","se_falhar":"a vesícula funde e nada é comunicado"},{"id":"fenda-sinaptica","nome":"Fenda sináptica","escala":"celular","funcao":"o espaço de cerca de vinte nanômetros que separa as duas células e impede continuidade elétrica","se_falhar":"sem separação as células ficariam eletricamente contínuas, e o sinal passaria sem poder ser alterado"},{"id":"receptor-ionotropico","nome":"Receptor ionotrópico","escala":"molecular","funcao":"canal que abre ao ligar o transmissor; o íon que ele deixa passar é o que define excitação ou inibição","se_falhar":"o transmissor chega à fenda e não é lido: não há corrente do outro lado"},{"id":"transportador-de-recaptacao","nome":"Transportador de recaptação","escala":"molecular","funcao":"recolhe o transmissor da fenda em poucos milissegundos, encerrando o sinal","se_falhar":"o receptor fica ligado, a resposta se arrasta e a sinapse perde a capacidade de transmitir um segundo evento"}],"nos":[{"id":"canais-de-ca-abrem","entidade":"canal-ca-voltagem","escala":"molecular","descricao":"Os canais de Ca²⁺ do terminal pré-sináptico abrem"},{"id":"ca-entra-no-terminal","entidade":"ca","escala":"molecular","descricao":"Ca²⁺ entra e a concentração local salta","quant":{"fora":"≈ 2 mM","dentro_em_repouso":"≈ 100 nM","razao":"≈ 20 000×"}},{"id":"sensor-de-ca-dispara-fusao","entidade":"proteinas-snare","escala":"molecular","descricao":"A sinaptotagmina liga Ca²⁺ e destrava o complexo SNARE"},{"id":"vesicula-funde","entidade":"vesicula","escala":"molecular","descricao":"A vesícula funde com a membrana e se abre para a fenda"},{"id":"transmissor-na-fenda","entidade":"neurotransmissor","escala":"molecular","descricao":"O transmissor está na fenda e difunde até o outro lado","quant":{"largura_da_fenda":"≈ 20 nm","atraso_sinaptico_total":"≈ 0,5 ms"}},{"id":"receptor-abre","entidade":"receptor-ionotropico","escala":"molecular","descricao":"O receptor liga o transmissor e o próprio poro dele abre"},{"id":"receptor-decide-o-sinal","entidade":"receptor-ionotropico","escala":"molecular","descricao":"É o receptor, e não o transmissor, que determina se o efeito excita ou inibe"},{"id":"corrente-pos-sinaptica","escala":"molecular","descricao":"Íons atravessam o receptor aberto, gerando corrente na célula que recebe"},{"id":"potencial-pos-sinaptico-graduado","escala":"celular","descricao":"A voltagem da célula receptora muda em proporção a quanto transmissor chegou"},{"id":"remocao-do-transmissor","entidade":"transportador-de-recaptacao","escala":"molecular","descricao":"O transmissor é recolhido da fenda em poucos milissegundos"},{"id":"sinal-vira-analogico","escala":"celular","descricao":"O disparo tudo-ou-nada volta a ser um sinal contínuo, que pode ser somado"},{"id":"numero-de-vesiculas-varia","escala":"molecular","descricao":"Quantas vesículas fundem muda de um disparo para outro","quant":{"dependencia_do_ca":"aproximadamente quártica"}},{"id":"ganho-ajustavel","escala":"celular","descricao":"A força da sinapse tem um botão do lado de quem envia"},{"id":"ca-residual-no-terminal","entidade":"ca","escala":"molecular","descricao":"Sobra Ca²⁺ no terminal depois do disparo, por dezenas a centenas de milissegundos"},{"id":"facilitacao-de-curto-prazo","escala":"celular","descricao":"O disparo seguinte solta mais transmissor que o anterior"},{"id":"esgotamento-do-estoque","entidade":"vesicula","escala":"molecular","descricao":"O conjunto de vesículas prontas para fundir se esvazia mais rápido do que é reposto"},{"id":"depressao-de-curto-prazo","escala":"celular","descricao":"O disparo seguinte solta menos transmissor que o anterior"},{"id":"historia-recente-muda-a-forca","escala":"celular","descricao":"A força da sinapse depende do que aconteceu nela nos últimos milissegundos"},{"id":"sinal-pode-ser-mudado-na-passagem","escala":"celular","descricao":"A conversão para química existe para que o sinal possa ser alterado no caminho, e não apenas transportado"}],"transicoes":[{"de":"despolarizacao-cresce","para":"canais-de-ca-abrem","tipo":"causa","certeza":"consolidado","requer":["canal-ca-voltagem"],"porque":"O terminal pré-sináptico tem canais de Ca²⁺ dependentes de voltagem, e eles respondem à mesma despolarização que percorreu o axônio. O sinal elétrico não atravessa a fenda: ele para aqui, e a partir deste ponto o que segue é outra coisa."},{"de":"canais-de-ca-abrem","para":"ca-entra-no-terminal","tipo":"causa","certeza":"consolidado","requer":["canal-ca-voltagem","ca","membrana"],"porque":"O gradiente de Ca²⁺ é o mais extremo da célula: cerca de vinte mil vezes mais concentrado fora do que dentro. Uma abertura brevíssima produz um salto local de concentração enorme, e é essa desproporção que faz do Ca²⁺ um sinal em vez de um solvente."},{"de":"ca-entra-no-terminal","para":"sensor-de-ca-dispara-fusao","tipo":"causa","certeza":"consolidado","requer":["ca","proteinas-snare"],"porque":"A sinaptotagmina liga Ca²⁺ e muda de forma, destravando um complexo SNARE que já mantinha a vesícula encostada na membrana. A maquinaria estava pronta antes do disparo: o Ca²⁺ não a constrói, só solta o gatilho, e é daí que vem a rapidez."},{"de":"sensor-de-ca-dispara-fusao","para":"vesicula-funde","tipo":"causa","certeza":"consolidado","requer":["vesicula","proteinas-snare","membrana"],"porque":"As proteínas SNARE se enrolam umas nas outras e puxam as duas membranas uma contra a outra até elas se fundirem. O conteúdo da vesícula passa a estar do lado de fora sem nunca ter atravessado membrana alguma."},{"de":"vesicula-funde","para":"transmissor-na-fenda","tipo":"causa","certeza":"consolidado","requer":["neurotransmissor","fenda-sinaptica"],"porque":"Cada vesícula despeja uma quantidade aproximadamente fixa de transmissor. Por isso a liberação é quântica: o que varia de um disparo para outro é o NÚMERO de vesículas que fundem, e não o quanto cada uma carrega."},{"de":"transmissor-na-fenda","para":"receptor-abre","tipo":"causa","certeza":"consolidado","requer":["neurotransmissor","receptor-ionotropico"],"porque":"O transmissor difunde os poucos nanômetros da fenda e se liga ao receptor. Como a distância é minúscula, essa travessia é quase instantânea: o meio milissegundo de atraso sináptico vem do passo do Ca²⁺ e da fusão, não do trajeto."},{"de":"transmissor-na-fenda","para":"remocao-do-transmissor","tipo":"causa","certeza":"consolidado","requer":["transportador-de-recaptacao","neurotransmissor"],"porque":"Transportadores no próprio terminal e nas células gliais vizinhas recolhem o transmissor da fenda em poucos milissegundos. Sem essa retirada o receptor permaneceria ligado, e a sinapse não teria como comunicar um segundo evento."},{"de":"receptor-abre","para":"corrente-pos-sinaptica","tipo":"causa","certeza":"consolidado","requer":["receptor-ionotropico","membrana"],"porque":"O receptor ionotrópico é ele próprio um canal: ligar o transmissor abre o poro, sem nenhum intermediário entre a ligação e a corrente. É esse atalho que torna a transmissão rápida o bastante para sustentar comportamento."},{"de":"receptor-abre","para":"receptor-decide-o-sinal","tipo":"causa","certeza":"consolidado","requer":["receptor-ionotropico"],"porque":"Quem determina se o efeito excita ou inibe é o íon que aquele receptor deixa passar, e não a molécula que o abriu. O mesmo transmissor despolariza numa célula e hiperpolariza noutra: a informação sobre o sinal mora no lado que recebe, não no que envia."},{"de":"corrente-pos-sinaptica","para":"potencial-pos-sinaptico-graduado","tipo":"causa","certeza":"consolidado","requer":["membrana"],"porque":"A corrente muda a voltagem da célula receptora em proporção a quanto transmissor chegou. Aqui não existe laço regenerativo como no axônio, e por isso a resposta é graduada: o dobro de entrada dá aproximadamente o dobro de resposta."},{"de":"remocao-do-transmissor","para":"potencial-pos-sinaptico-graduado","tipo":"modula","certeza":"consolidado","porque":"A duração do potencial pós-sináptico é fixada por quanto tempo o transmissor permanece na fenda. Remover mais devagar alarga a resposta em vez de aumentar o pico — é assim que um bloqueador de recaptação age, prolongando e não intensificando."},{"de":"potencial-pos-sinaptico-graduado","para":"sinal-vira-analogico","tipo":"compoe","certeza":"consolidado","porque":"O disparo que chegou era tudo-ou-nada e o que sai é contínuo. A sinapse desfaz a digitalização de propósito: sem voltar ao analógico não haveria o que somar, e somar entradas de muitas origens é a operação que um neurônio existe para fazer."},{"de":"ca-entra-no-terminal","para":"numero-de-vesiculas-varia","tipo":"modula","certeza":"consolidado","porque":"A probabilidade de uma vesícula fundir cresce com a concentração local de Ca²⁺ elevada à quarta potência, aproximadamente. Uma mudança pequena no Ca²⁺ que entra vira uma mudança grande em quantas vesículas soltam."},{"de":"numero-de-vesiculas-varia","para":"ganho-ajustavel","tipo":"compoe","certeza":"consolidado","porque":"Se o que varia é o número de vesículas, a força da sinapse tem um controle do lado de quem envia. Qualquer coisa que altere o Ca²⁺ do terminal muda o ganho sem encostar no receptor do outro lado."},{"de":"ca-entra-no-terminal","para":"ca-residual-no-terminal","tipo":"causa","certeza":"consolidado","porque":"Bombas e tampões levam dezenas a centenas de milissegundos para devolver o Ca²⁺ ao nível de repouso. Se outro disparo chega antes disso, o Ca²⁺ novo se soma ao que ainda não foi retirado."},{"de":"ca-residual-no-terminal","para":"facilitacao-de-curto-prazo","tipo":"causa","certeza":"debatido","porque":"O resíduo aumenta a probabilidade de liberação no disparo seguinte. QUAL proteína lê esse resíduo continua em disputa: a sinaptotagmina-7 é a candidata com mais apoio experimental, e há evidência de que outras proteínas ligadoras de Ca²⁺ respondem por parte do efeito, em proporção que varia conforme o tipo de sinapse."},{"de":"vesicula-funde","para":"esgotamento-do-estoque","tipo":"causa","certeza":"consolidado","porque":"O conjunto de vesículas já engatilhadas é pequeno e leva tempo para ser reposto. Disparos em sequência rápida consomem esse estoque mais depressa do que a reposição consegue acompanhar."},{"de":"esgotamento-do-estoque","para":"depressao-de-curto-prazo","tipo":"causa","certeza":"consolidado","porque":"Com menos vesículas prontas, o disparo seguinte solta menos transmissor. A sinapse fica mais fraca por ter sido usada, sem que nada tenha sido decidido a respeito e sem nenhum sinal de controle envolvido."},{"de":"facilitacao-de-curto-prazo","para":"historia-recente-muda-a-forca","tipo":"compoe","certeza":"consolidado","porque":"A facilitação empurra a força para cima quando os disparos chegam juntos. Como ela depende do intervalo entre eles, quem a governa é o ritmo de chegada, e não a intensidade de qualquer disparo isolado."},{"de":"depressao-de-curto-prazo","para":"historia-recente-muda-a-forca","tipo":"compoe","certeza":"consolidado","porque":"A depressão empurra a força para baixo pelo mesmo motivo temporal, em sentido contrário. Qual das duas domina depende da sinapse e da frequência, e a mesma via pode amplificar rajadas curtas enquanto filtra as longas."},{"de":"codigo-de-frequencia-com-teto","para":"historia-recente-muda-a-forca","tipo":"modula","certeza":"consolidado","porque":"O que chega ao terminal é uma sequência de disparos idênticos, e a única grandeza que ela carrega é a taxa. É essa taxa que decide se domina a facilitação ou a depressão, de modo que a sinapse lê exatamente a variável em que a intensidade tinha sido codificada."},{"de":"historia-recente-muda-a-forca","para":"sinal-pode-ser-mudado-na-passagem","tipo":"compoe","certeza":"consolidado","porque":"Uma sinapse cuja força depende do próprio uso recente não é um fio: é um elemento com memória de curtíssimo prazo. Nenhuma junção puramente elétrica tem como fazer isso, porque não há nada nela que se gaste ou se acumule."},{"de":"ganho-ajustavel","para":"sinal-pode-ser-mudado-na-passagem","tipo":"compoe","certeza":"consolidado","porque":"Ter um controle de força do lado de quem envia é o que permite a uma terceira célula regular a conversa entre duas. Modulação assim exige um ponto de conversão: num contato elétrico direto não há onde encaixar o botão."},{"de":"receptor-decide-o-sinal","para":"sinal-pode-ser-mudado-na-passagem","tipo":"compoe","certeza":"consolidado","porque":"Como o sinal do efeito é escolhido por quem recebe, a mesma mensagem pode excitar um alvo e inibir outro. Inverter o sinal na passagem é impossível num condutor, e é uma das coisas que a conversão química compra."},{"de":"sinal-vira-analogico","para":"sinal-pode-ser-mudado-na-passagem","tipo":"compoe","certeza":"consolidado","porque":"Voltar ao contínuo é o que torna as entradas somáveis, e sem soma não há decisão a tomar no corpo celular. Junto com as outras três, fecha a resposta: o meio milissegundo perdido na conversão é o preço de o sinal poder ser mudado em vez de apenas transportado."}],"mecanismos":[{"id":"transmissao-sinaptica","fenomeno":"Se converter elétrico em químico e de volta custa meio milissegundo, por que o cérebro faz isso em quase toda conexão?","entrada":"despolarizacao-cresce","terminal":"sinal-pode-ser-mudado-na-passagem","limites":"Descreve sinapse química rápida com receptor ionotrópico, do tipo que domina a comunicação ponto a ponto no sistema nervoso central. Não cobre receptores metabotrópicos e cascatas de segundo mensageiro, nem sinapses elétricas por junção comunicante (que existem e são rápidas, justamente por não fazerem nada disto), nem plasticidade de longo prazo, nem liberação por volume. A dependência quártica do Ca²⁺ é aproximação: o expoente medido varia com a sinapse."}]},"06-ltp-nmda.json":{"arquivo":"LTP dependente de NMDA","nota_de_autoria":"Sem aresta declarada para arquivo nenhum: entra por `transmissor-na-fenda` e usa `sinal-vira-analogico` (ambos do 05) e `potencial-de-repouso` (do 02). A pergunta não é como a LTP funciona: é como uma sinapse consegue REGISTRAR que participou de uma coincidência, se nenhuma molécula ali tem acesso ao que a célula inteira fez. A resposta é que ninguém compara nada — o receptor NMDA implementa uma porta lógica E numa molécula só, e o espinho impede o resultado de vazar. O `debatido` daqui é a manutenção: que a autofosforilação da CaMKII prolongue a atividade é medido, que ela seja o que SUSTENTA a potenciação por horas é disputado.","entidades":[{"id":"receptor-nmda","nome":"Receptor NMDA","escala":"molecular","funcao":"canal de glutamato que exige ligante E despolarização ao mesmo tempo, e que deixa passar Ca²⁺ além de Na⁺","se_falhar":"a transmissão continua normal e a sinapse deixa de aprender: o sinal passa e não fica registro nenhum"},{"id":"mg","nome":"Íon magnésio (Mg²⁺)","escala":"molecular","funcao":"cátion divalente que encalha dentro do poro do NMDA quando a membrana está polarizada","se_falhar":"o NMDA passa a conduzir com glutamato apenas, a porta lógica E vira porta simples, e a sinapse perde a capacidade de distinguir coincidência de atividade isolada"},{"id":"receptor-ampa","nome":"Receptor AMPA","escala":"molecular","funcao":"canal de glutamato que faz o trabalho comum da transmissão rápida; a quantidade dele na membrana é o que muda na potenciação","se_falhar":"não há corrente para potenciar: a sinapse fica muda mesmo com toda a maquinaria de detecção intacta"},{"id":"camkii","nome":"CaMKII","escala":"molecular","funcao":"quinase de doze subunidades, ativada por Ca²⁺ e calmodulina, cujas subunidades fosforilam umas às outras","se_falhar":"o Ca²⁺ entra, a coincidência é detectada, e nada é feito a respeito"},{"id":"espinho-dendritico","nome":"Espinho dendrítico","escala":"celular","funcao":"bulbo de volume ínfimo preso ao dendrito por um pescoço fino, que segura o Ca²⁺ dentro dele","se_falhar":"o Ca²⁺ se dilui no dendrito e a mudança deixa de ser específica daquela sinapse: aprender uma coisa alteraria todas as outras conexões vizinhas"}],"nos":[{"id":"mg-tampa-o-poro","entidade":"mg","escala":"molecular","descricao":"O Mg²⁺ está encalhado dentro do poro do NMDA, obstruindo-o"},{"id":"nmda-liga-glutamato","entidade":"receptor-nmda","escala":"molecular","descricao":"O NMDA liga glutamato, e mesmo assim não passa corrente"},{"id":"somacao-despolariza-o-espinho","escala":"celular","descricao":"Muitas entradas somadas levantam a voltagem local do espinho"},{"id":"mg-sai-do-poro","entidade":"mg","escala":"molecular","descricao":"O Mg²⁺ é expelido e o poro fica desobstruído"},{"id":"as-duas-condicoes-juntas","entidade":"receptor-nmda","escala":"molecular","descricao":"Ligante presente E poro desobstruído, ao mesmo tempo, no mesmo receptor"},{"id":"ca-entra-no-espinho","entidade":"ca","escala":"molecular","descricao":"Ca²⁺ atravessa o NMDA aberto e entra no espinho"},{"id":"espinho-isola-o-calcio","entidade":"espinho-dendritico","escala":"celular","descricao":"O pescoço fino do espinho atrasa a saída de íons para o dendrito","quant":{"volume_do_espinho":"da ordem de femtolitros"}},{"id":"ca-sobe-so-nesta-sinapse","entidade":"ca","escala":"molecular","descricao":"A concentração de Ca²⁺ sobe muito dentro deste espinho e em nenhum outro"},{"id":"camkii-ativa","entidade":"camkii","escala":"molecular","descricao":"A CaMKII daquele espinho é ativada por Ca²⁺ e calmodulina"},{"id":"camkii-se-autofosforila","entidade":"camkii","escala":"molecular","descricao":"Subunidades vizinhas fosforilam umas às outras dentro do complexo"},{"id":"atividade-persiste-sem-o-sinal","entidade":"camkii","escala":"molecular","descricao":"A enzima continua ativa depois que o Ca²⁺ já voltou ao normal"},{"id":"ampa-inserido-na-membrana","entidade":"receptor-ampa","escala":"molecular","descricao":"Mais receptores AMPA passam a ficar fixados na membrana do espinho"},{"id":"mesma-liberacao-da-mais-corrente","escala":"celular","descricao":"A mesma quantidade de glutamato passa a produzir uma corrente maior"},{"id":"so-a-sinapse-coincidente-fica-mais-forte","escala":"celular","descricao":"A sinapse que participou da coincidência fica mais forte, e só ela, usando apenas informação local"}],"transicoes":[{"de":"potencial-de-repouso","para":"mg-tampa-o-poro","tipo":"causa","certeza":"consolidado","requer":["receptor-nmda","mg","membrana"],"porque":"O Mg²⁺ é um cátion e o interior negativo da célula em repouso o puxa para dentro do poro, onde ele encalha por ser grande demais para atravessar. O bloqueio não é uma tampa construída pela célula: é eletrostática pura, e é por isso que ele se desfaz sozinho quando a voltagem muda."},{"de":"mg-tampa-o-poro","para":"mg-sai-do-poro","tipo":"modula","certeza":"consolidado","porque":"A saída do Mg²⁺ só é um evento porque ele estava lá. O bloqueio em repouso é a condição de partida que torna a despolarização informativa: num receptor sem bloqueio prévio, despolarizar não mudaria nada."},{"de":"transmissor-na-fenda","para":"nmda-liga-glutamato","tipo":"causa","certeza":"consolidado","requer":["receptor-nmda","neurotransmissor"],"porque":"O NMDA liga glutamato como qualquer receptor de glutamato liga. A diferença está no que acontece depois: o poro continua obstruído, e a ligação sozinha não deixa passar corrente nenhuma."},{"de":"sinal-vira-analogico","para":"somacao-despolariza-o-espinho","tipo":"permite","certeza":"consolidado","porque":"Um único potencial pós-sináptico não despolariza o bastante para nada. É porque as respostas voltaram a ser contínuas que muitas entradas próximas no tempo podem se somar, e é a soma delas, nunca uma isolada, que levanta a voltagem local."},{"de":"somacao-despolariza-o-espinho","para":"mg-sai-do-poro","tipo":"causa","certeza":"consolidado","requer":["mg","receptor-nmda"],"porque":"Com o interior menos negativo, a força que segurava o Mg²⁺ afrouxa e ele é expelido do poro. Repare que o receptor não foi ABERTO pela voltagem: ele foi desobstruído por ela, e é essa distinção que obriga as duas condições a valerem juntas."},{"de":"nmda-liga-glutamato","para":"as-duas-condicoes-juntas","tipo":"compoe","certeza":"consolidado","porque":"O glutamato só está ali se a célula que envia disparou. Esta é a metade pré-sináptica da coincidência, e sozinha ela não abre nada — é o que separa a detecção de coincidência de uma simples resposta a estímulo."},{"de":"mg-sai-do-poro","para":"as-duas-condicoes-juntas","tipo":"compoe","certeza":"consolidado","porque":"A despolarização só existe se a célula que recebe já estava sendo ativada por outras entradas. Esta é a metade pós-sináptica, e sozinha ela também não abre nada, porque sem glutamato ligado o poro está fechado de qualquer modo."},{"de":"as-duas-condicoes-juntas","para":"ca-entra-no-espinho","tipo":"causa","certeza":"consolidado","requer":["receptor-nmda","ca","membrana"],"porque":"Com ligante presente e poro desobstruído ao mesmo tempo, o NMDA conduz — e, ao contrário do AMPA, deixa passar Ca²⁺. A porta lógica E está implementada dentro de uma única molécula, sem que nenhuma instância precise comparar os dois eventos."},{"de":"espinho-isola-o-calcio","para":"ca-sobe-so-nesta-sinapse","tipo":"permite","certeza":"consolidado","requer":["espinho-dendritico"],"porque":"O espinho é um bulbo preso ao dendrito por um pescoço fino e comprido, que atrasa muito a difusão de íons para fora. Sem esse confinamento o Ca²⁺ se espalharia pelo dendrito e não mudaria a concentração em lugar nenhum de forma apreciável."},{"de":"ca-entra-no-espinho","para":"ca-sobe-so-nesta-sinapse","tipo":"causa","certeza":"consolidado","requer":["ca"],"porque":"Vale aqui a mesma desproporção de gradiente que faz o Ca²⁺ ser sinal no terminal, agora dentro de um compartimento de femtolitros. Um número pequeno de íons multiplica a concentração local por dezenas de vezes."},{"de":"ca-sobe-so-nesta-sinapse","para":"camkii-ativa","tipo":"causa","certeza":"consolidado","requer":["camkii","ca"],"porque":"A CaMKII é ativada por Ca²⁺ ligado à calmodulina, e ela está ancorada dentro do espinho. Quem a ativa é a concentração daquele espinho e não a média da célula, de modo que a especificidade da mudança já começa neste passo."},{"de":"camkii-ativa","para":"camkii-se-autofosforila","tipo":"causa","certeza":"consolidado","requer":["camkii"],"porque":"A CaMKII é um complexo de doze subunidades encostadas umas nas outras, e uma subunidade ativa fosforila a vizinha. A geometria da enzima é o que torna esse contágio possível: não é uma reação com uma molécula qualquer, é com quem já está ao lado."},{"de":"camkii-se-autofosforila","para":"atividade-persiste-sem-o-sinal","tipo":"causa","certeza":"debatido","porque":"Que a autofosforilação prolongue a atividade além do pulso de Ca²⁺ é medido e não está em disputa. Que ela seja o que MANTÉM a sinapse forte é: a fosforilação decai em minutos enquanto a potenciação dura horas, e animais com o sítio mutado ainda mostram potenciação em algumas condições. A manutenção provavelmente envolve mais de um mecanismo."},{"de":"camkii-ativa","para":"ampa-inserido-na-membrana","tipo":"causa","certeza":"consolidado","requer":["camkii","receptor-ampa"],"porque":"A CaMKII fosforila receptores AMPA e proteínas de ancoragem, e o resultado é mais AMPA fixado na membrana do espinho. Os receptores já existiam em vesículas ali perto: neste passo a sinapse não fabrica nada, apenas muda onde as coisas ficam."},{"de":"ampa-inserido-na-membrana","para":"mesma-liberacao-da-mais-corrente","tipo":"causa","certeza":"consolidado","requer":["receptor-ampa","neurotransmissor"],"porque":"Com mais canais para o mesmo glutamato encontrar, a mesma quantidade liberada abre mais poros. A sinapse ficou mais forte sem que o lado que envia tenha mudado coisa alguma no que faz."},{"de":"sinal-pode-ser-mudado-na-passagem","para":"mesma-liberacao-da-mais-corrente","tipo":"permite","certeza":"consolidado","porque":"Potenciar é mudar quanta corrente a mesma liberação produz, e isso só é possível porque a força já era determinada localmente, do lado que recebe. Numa junção elétrica não haveria receptor nenhum a acrescentar: guardar uma mudança exige um ponto onde a força seja ajustável, e é a conversão química que cria esse ponto."},{"de":"mesma-liberacao-da-mais-corrente","para":"so-a-sinapse-coincidente-fica-mais-forte","tipo":"compoe","certeza":"consolidado","porque":"A potenciação é medida como corrente maior para a mesma entrada. É isto que \"mais forte\" significa em número, e não uma metáfora sobre a conexão ter ficado mais importante."},{"de":"ca-sobe-so-nesta-sinapse","para":"so-a-sinapse-coincidente-fica-mais-forte","tipo":"compoe","certeza":"consolidado","porque":"Como o sinal de Ca²⁺ não sai do espinho, as sinapses vizinhas do mesmo dendrito não recebem ordem nenhuma. A especificidade não vem de a célula escolher qual conexão mudar: vem de a mudança não conseguir se espalhar."},{"de":"as-duas-condicoes-juntas","para":"so-a-sinapse-coincidente-fica-mais-forte","tipo":"compoe","certeza":"consolidado","porque":"A sinapse não tem acesso ao que a célula inteira fez. O que ela consegue é registrar que as duas coisas estavam presentes no mesmo ponto ao mesmo tempo, e esse encontro local faz as vezes de uma comparação que nenhuma instância executou."},{"de":"atividade-persiste-sem-o-sinal","para":"so-a-sinapse-coincidente-fica-mais-forte","tipo":"compoe","certeza":"consolidado","porque":"Sem alguma coisa que continue depois de o Ca²⁺ ter ido embora, a mudança acabaria junto com o estímulo. Persistir além do sinal é exatamente o que separa uma resposta de um registro."}],"mecanismos":[{"id":"ltp-nmda","fenomeno":"Como uma sinapse registra que participou de uma coincidência, se nenhuma molécula ali sabe o que a célula inteira fez?","entrada":"transmissor-na-fenda","terminal":"so-a-sinapse-coincidente-fica-mais-forte","limites":"Descreve a fase inicial da LTP dependente de NMDA em CA1 do hipocampo, que dura de dezenas de minutos a poucas horas. Não cobre a fase tardia, que exige transcrição e síntese de proteína, nem marcação e captura sinápticas, nem LTP independente de NMDA (fibras musgosas), nem plasticidade estrutural do espinho, nem os mecanismos pré-sinápticos de expressão que existem em algumas sinapses. Trata a inserção de AMPA como o mecanismo de expressão, que é o mais apoiado em CA1 mas não é universal."}]},"07-ltd-metaplasticidade.json":{"arquivo":"LTD e metaplasticidade","nota_de_autoria":"Entra pelo terminal do 06 (`so-a-sinapse-coincidente-fica-mais-forte`), e essa ligação é o argumento do mecanismo: uma regra que só fortalece realimenta a si mesma e satura. O paradoxo central é que o MESMO mensageiro produz efeitos opostos — a resposta é que quem lê o Ca²⁺ são duas enzimas com afinidades diferentes, e a amplitude do sinal escolhe qual responde. O `debatido` daqui é quanto da metaplasticidade a troca de subunidade do NMDA explica.","entidades":[{"id":"calmodulina","nome":"Calmodulina","escala":"molecular","funcao":"sensor de Ca²⁺ que muda de forma ao ligar o íon e passa a ativar outras proteínas; é a mesma para as duas vias","se_falhar":"o Ca²⁺ entra e nenhuma das duas vias é acionada — nem a que fortalece nem a que enfraquece"},{"id":"calcineurina","nome":"Calcineurina (PP2B)","escala":"molecular","funcao":"fosfatase ativada por Ca²⁺-calmodulina com afinidade ALTA, o que a faz responder a concentrações baixas","se_falhar":"some a via da depressão: a sinapse só consegue subir, e satura"},{"id":"pp1","nome":"Fosfatase PP1","escala":"molecular","funcao":"enzima que retira os mesmos fosfatos que a CaMKII coloca; fica presa por um inibidor até ser liberada","se_falhar":"a calcineurina ativa e nada acontece com os receptores: falta o executor da retirada"}],"nos":[{"id":"estimulo-fraco-e-prolongado","escala":"celular","descricao":"A sinapse recebe estimulação de baixa frequência por muito tempo","quant":{"protocolo_tipico":"≈ 1 Hz por 10 a 15 min"}},{"id":"ca-sobe-pouco-e-por-muito-tempo","entidade":"ca","escala":"molecular","descricao":"O Ca²⁺ do espinho fica bem acima do repouso e bem abaixo do que um estímulo forte produz"},{"id":"calcineurina-tem-alta-afinidade","entidade":"calcineurina","escala":"molecular","descricao":"A calcineurina satura com pouco Ca²⁺-calmodulina"},{"id":"camkii-precisa-de-muito-ca","entidade":"camkii","escala":"molecular","descricao":"A CaMKII só arranca com Ca²⁺ alto, porque precisa de várias subunidades ligadas ao mesmo tempo"},{"id":"as-duas-vias-tem-limiares-diferentes","escala":"molecular","descricao":"A enzima que enfraquece liga antes da que fortalece"},{"id":"mesmo-mensageiro-dois-destinos","escala":"molecular","descricao":"É a amplitude do sinal de Ca²⁺, e não a identidade dele, que decide o destino"},{"id":"calcineurina-ativa","entidade":"calcineurina","escala":"molecular","descricao":"A calcineurina daquele espinho é ativada"},{"id":"pp1-desfosforila","entidade":"pp1","escala":"molecular","descricao":"A PP1 é liberada e retira fosfatos dos receptores e das âncoras"},{"id":"ampa-retirado-da-membrana","entidade":"receptor-ampa","escala":"molecular","descricao":"Receptores AMPA são internalizados e saem da membrana do espinho"},{"id":"mesma-liberacao-da-menos-corrente","escala":"celular","descricao":"A mesma quantidade de glutamato passa a produzir uma corrente menor"},{"id":"sinapse-forte-despolariza-mais","escala":"celular","descricao":"Uma sinapse já potenciada produz mais despolarização para a mesma entrada"},{"id":"realimentacao-positiva-satura","escala":"celular","descricao":"Fortalecer facilita fortalecer, e o processo caminha até o teto"},{"id":"atividade-alta-sustentada","escala":"celular","descricao":"A célula passa a manter taxa de disparo alta por longos períodos"},{"id":"troca-de-subunidade-do-nmda","entidade":"receptor-nmda","escala":"molecular","descricao":"A composição do NMDA muda, com mais NR2A e menos NR2B, e cada evento passa a admitir menos Ca²⁺"},{"id":"limiar-sobe","escala":"celular","descricao":"A fronteira entre deprimir e potenciar se desloca para cima"},{"id":"a-forca-fica-onde-ainda-pode-mudar","escala":"celular","descricao":"A força da sinapse permanece numa faixa em que ainda dá para subir e descer"}],"transicoes":[{"de":"estimulo-fraco-e-prolongado","para":"ca-sobe-pouco-e-por-muito-tempo","tipo":"causa","certeza":"consolidado","requer":["receptor-nmda","ca"],"porque":"Estimulação de baixa frequência abre o NMDA de vez em quando e por pouco tempo a cada vez. O Ca²⁺ entra num filete em vez de num jato, e a concentração do espinho se estabiliza num patamar intermediário em vez de dar um pico."},{"de":"calcineurina-tem-alta-afinidade","para":"as-duas-vias-tem-limiares-diferentes","tipo":"compoe","certeza":"consolidado","requer":["calcineurina","calmodulina"],"porque":"A calcineurina liga o complexo Ca²⁺-calmodulina com afinidade alta, o que significa que ela satura com pouca coisa. Responder cedo é propriedade bioquímica da proteína, e não uma decisão tomada pela célula em algum lugar."},{"de":"camkii-precisa-de-muito-ca","para":"as-duas-vias-tem-limiares-diferentes","tipo":"compoe","certeza":"consolidado","requer":["camkii","calmodulina"],"porque":"A CaMKII só começa a se autofosforilar quando subunidades vizinhas do mesmo complexo estão ligadas ao mesmo tempo. Esse requisito de simultaneidade põe o gatilho dela num patamar bem mais alto que o da fosfatase."},{"de":"as-duas-vias-tem-limiares-diferentes","para":"mesmo-mensageiro-dois-destinos","tipo":"permite","certeza":"consolidado","porque":"Se as duas leitoras ligassem no mesmo ponto, o Ca²⁺ não poderia significar duas coisas. É a diferença entre os limiares que transforma uma grandeza contínua em duas decisões opostas, sem que nada precise medir e comparar."},{"de":"ca-sobe-pouco-e-por-muito-tempo","para":"mesmo-mensageiro-dois-destinos","tipo":"compoe","certeza":"consolidado","porque":"É a AMPLITUDE do sinal de Ca²⁺, e não a identidade dele, que escolhe o destino. O mesmo íon que fortalece quando entra em jato enfraquece quando entra em filete, e a diferença está inteiramente em quem consegue ligar naquele nível."},{"de":"ca-sobe-pouco-e-por-muito-tempo","para":"calcineurina-ativa","tipo":"causa","certeza":"consolidado","requer":["calcineurina","ca","calmodulina"],"porque":"Uma concentração modesta já basta para a calcineurina, e a duração longa compensa a intensidade baixa. Um estímulo que nunca chegaria perto de disparar potenciação aciona esta via por inteiro."},{"de":"calcineurina-ativa","para":"pp1-desfosforila","tipo":"causa","certeza":"consolidado","requer":["calcineurina","pp1"],"porque":"A calcineurina desfosforila o inibidor que mantinha a PP1 presa, e a fosfatase é solta. A via da depressão não constrói maquinaria nova: ela libera uma enzima que já estava ali contida, e é daí que vem a rapidez dela."},{"de":"pp1-desfosforila","para":"ampa-retirado-da-membrana","tipo":"causa","certeza":"consolidado","requer":["pp1","receptor-ampa"],"porque":"A PP1 retira exatamente os fosfatos que a CaMKII tinha colocado nos receptores AMPA e nas proteínas de ancoragem. Sem essa marca o receptor deixa de ser retido e é internalizado por endocitose."},{"de":"ampa-retirado-da-membrana","para":"mesma-liberacao-da-menos-corrente","tipo":"causa","certeza":"consolidado","requer":["receptor-ampa","neurotransmissor"],"porque":"Com menos canais para o mesmo glutamato encontrar, a mesma liberação abre menos poros. A depressão é a mesma grandeza da potenciação com o sinal trocado, medida do mesmo jeito, e não um processo de outra natureza."},{"de":"so-a-sinapse-coincidente-fica-mais-forte","para":"sinapse-forte-despolariza-mais","tipo":"causa","certeza":"consolidado","porque":"Uma sinapse potenciada produz mais despolarização para a mesma entrada. Como é a despolarização que desbloqueia o NMDA, cada potenciação torna a seguinte mais fácil de disparar naquele mesmo lugar."},{"de":"sinapse-forte-despolariza-mais","para":"realimentacao-positiva-satura","tipo":"causa","certeza":"consolidado","porque":"Fortalecer facilita fortalecer, e realimentação positiva sem freio caminha até o limite físico. No teto todas as sinapses ficam igualmente fortes, e as diferenças entre elas, que é onde a informação está guardada, desaparecem."},{"de":"realimentacao-positiva-satura","para":"atividade-alta-sustentada","tipo":"causa","certeza":"consolidado","porque":"Sinapses perto do teto disparam a célula com facilidade, e ela passa a manter taxa alta por longos períodos. O que era propriedade de conexões isoladas vira um estado mensurável da célula inteira."},{"de":"atividade-alta-sustentada","para":"limiar-sobe","tipo":"causa","certeza":"consolidado","porque":"Depois de um período de atividade alta, é preciso um estímulo mais forte para produzir potenciação, e protocolos que antes potenciavam passam a deprimir. A fronteira entre os dois destinos acompanha a média da atividade recente em vez de ficar parada."},{"de":"atividade-alta-sustentada","para":"troca-de-subunidade-do-nmda","tipo":"causa","certeza":"consolidado","requer":["receptor-nmda"],"porque":"Atividade alta prolongada muda a composição dos receptores NMDA da sinapse, aumentando a proporção de NR2A em relação a NR2B. A corrente de cada evento fica mais curta, e portanto entra menos Ca²⁺ por ativação."},{"de":"troca-de-subunidade-do-nmda","para":"limiar-sobe","tipo":"compoe","certeza":"debatido","porque":"Esta é a explicação molecular mais apoiada para o deslocamento do limiar: menos Ca²⁺ por evento exige estímulo mais forte para alcançar o patamar da CaMKII. QUANTO do deslizamento ela responde continua em disputa, e há evidência de contribuições das próprias enzimas e da inibição da rede em volta."},{"de":"limiar-sobe","para":"a-forca-fica-onde-ainda-pode-mudar","tipo":"compoe","certeza":"consolidado","porque":"Um limiar que se move junto com a atividade impede tanto o teto quanto o chão: quando tudo está forte fica mais difícil fortalecer, e quando tudo está fraco fica mais fácil. O freio não é um limite imposto de fora, é a própria história de uso movendo a fronteira."},{"de":"mesma-liberacao-da-menos-corrente","para":"a-forca-fica-onde-ainda-pode-mudar","tipo":"compoe","certeza":"consolidado","porque":"Sem um caminho de descida a força só acumula, e uma sinapse no teto não consegue mais representar nada de novo. Poder enfraquecer é o que devolve alcance à sinapse, e não apenas o que desfaz um aprendizado errado."},{"de":"mesmo-mensageiro-dois-destinos","para":"a-forca-fica-onde-ainda-pode-mudar","tipo":"compoe","certeza":"consolidado","porque":"Subir e descer usam o mesmo mensageiro, a mesma entrada e o mesmo receptor, mudando só a intensidade. Por isso a sinapse não precisa de um segundo sistema para enfraquecer, e a decisão sai da própria grandeza que ela já estava medindo."}],"mecanismos":[{"id":"ltd-metaplasticidade","fenomeno":"Se o Ca²⁺ é o sinal que fortalece a sinapse, por que uma entrada fraca de Ca²⁺ a enfraquece em vez de fortalecer pouco?","entrada":"so-a-sinapse-coincidente-fica-mais-forte","terminal":"a-forca-fica-onde-ainda-pode-mudar","limites":"Descreve a LTD dependente de NMDA em CA1 e o limiar deslizante do tipo BCM. Não cobre LTD dependente de
